---
- name: Remove OpsCtl-managed deployment container
  hosts: all
  gather_facts: false
  become: true
  vars:
    container_name: "{{ app_container_name | default('') }}"
    expected_org_id: "{{ app_org_id | default('') }}"
    expected_app_slug: "{{ app_slug | default('') }}"
    expected_deployment_id: "{{ app_deployment_id | default('') }}"
    expected_image_ref: "{{ app_expected_image_ref | default(none) }}"
  tasks:
    - name: Validate canonical removal identity before inspection
      assert:
        that:
          - app_managed is defined
          - app_managed is boolean
          - app_managed
          - expected_org_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
          - expected_deployment_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
          - container_name is string
          - container_name | length > 0
          - expected_app_slug is string
          - expected_app_slug | length > 0
          - expected_image_ref is none or (expected_image_ref is string and expected_image_ref | length > 0)
        fail_msg: "Managed container removal identity is invalid"

    - name: OPERATION_STEP remove:start
      shell: |
        printf 'OPERATION_STEP={"name":"remove:start","status":"running","metadata":{"display_name":"Remove container","container_name":{{ container_name | to_json }}}}\n'
      args:
        executable: /bin/sh

    - name: Inspect exact named container
      command:
        argv:
          - docker
          - inspect
          - --type=container
          - "{{ container_name }}"
      register: container_inspect
      changed_when: false
      failed_when: false
      no_log: true

    - name: Classify confirmed container absence
      set_fact:
        container_absent: >-
          {{ container_inspect.rc == 1 and
             (container_inspect.stdout | trim) == '[]' and
             (container_inspect.stderr | trim) in [
               'Error: No such object: ' ~ container_name,
               'Error response from daemon: No such container: ' ~ container_name
             ] }}
      no_log: true

    - name: Reject unobservable container state
      fail:
        msg: "Container removal inspection did not establish present or absent state"
      when:
        - container_inspect.rc != 0
        - not container_absent

    - name: OPERATION_STEP remove:complete when confirmed absent
      shell: |
        printf 'OPERATION_STEP={"name":"remove:complete","status":"completed","metadata":{"display_name":"Container already absent","container_name":{{ container_name | to_json }},"removed":false,"reason":"not_found"}}\n'
      args:
        executable: /bin/sh
      when: container_absent

    - name: Parse exact inspect payload
      set_fact:
        container_payloads: "{{ container_inspect.stdout | from_json }}"
        container_payload: "{{ (container_inspect.stdout | from_json)[0] }}"
      when: container_inspect.rc == 0
      no_log: true

    - name: Validate inspect object shape
      assert:
        that:
          - container_payloads is sequence
          - container_payloads | length == 1
          - container_payload is mapping
          - container_payload.Id is string
          - container_payload.Id is match('^[0-9a-f]{64}$')
          - container_payload.Name == '/' ~ container_name
          - container_payload.Config is mapping
          - container_payload.Config.Labels is mapping
        fail_msg: "Container removal inspection payload is malformed"
      when: container_inspect.rc == 0
      no_log: true

    - name: Validate exact managed identity and expected revision image
      assert:
        that:
          - container_payload.Config.Labels.get('com.opsctl.managed') == 'true'
          - container_payload.Config.Labels.get('com.opsctl.org_id') == expected_org_id
          - container_payload.Config.Labels.get('com.opsctl.deployment_id') == expected_deployment_id
          - container_payload.Config.Labels.get('com.opsctl.app') == expected_app_slug
          - expected_image_ref is none or container_payload.Config.Image == expected_image_ref
        fail_msg: "Refusing to remove a container without exact OpsCtl ownership"
      when: container_inspect.rc == 0
      no_log: true

    - name: Require the recorded managed predecessor or qualified absence
      ansible.builtin.assert:
        that:
          - app_previous_container_id is none or app_previous_container_id is match('^[0-9a-f]{64}$')
          - container_absent or (app_previous_container_id is not none and container_payload.Id == app_previous_container_id)
        fail_msg: Managed container identity changed. Refresh its observation before removal.
      when: app_previous_container_id is defined
      no_log: true

    - name: Require public route withdrawal on the same image target
      ansible.builtin.assert:
        that:
          - app_route_retirement is mapping
          - app_route_retirement.route_state == 'absent'
          - app_route_retirement.org_id == app_org_id
          - app_route_retirement.deployment_id == app_deployment_id
          - app_route_retirement.target_server == target_server
          - app_route_retirement.simulate == false
        fail_msg: Whole-deployment route retirement inputs are invalid.
      when: app_route_retirement is defined
      no_log: true

- import_playbook: traefik_route_converge.yml
  when: app_route_retirement is defined
  vars: &retirement_converge
    deployment_id: "{{ app_route_retirement.deployment_id }}"
    org_id: "{{ app_route_retirement.org_id }}"
    server_id: "{{ app_route_retirement.server_id }}"
    target_server: "{{ app_route_retirement.target_server }}"
    target_server_ip: "{{ app_route_retirement.target_server_ip }}"
    route_state: "{{ app_route_retirement.route_state }}"
    route_hosts: "{{ app_route_retirement.route_hosts }}"
    route_port: "{{ app_route_retirement.route_port }}"
    route_https: "{{ app_route_retirement.route_https }}"
    redirect_http_to_https: "{{ app_route_retirement.redirect_http_to_https }}"
    route_middlewares: "{{ app_route_retirement.route_middlewares }}"
    traefik_backends: "{{ app_route_retirement.traefik_backends }}"
    expected_route: "{{ app_route_retirement.expected_route }}"
    simulate: "{{ app_route_retirement.simulate }}"

- name: Verify qualified whole-deployment route absence
  hosts: all
  gather_facts: false
  become: true
  vars:
    <<: *retirement_converge
    traefik_container_name: traefik
    traefik_dynamic_dir: /etc/traefik/dynamic/opsctl
    route_file_path: "{{ traefik_dynamic_dir }}/deployment-{{ deployment_id }}.yml"
    route_key: "deployment-{{ deployment_id }}"
  tasks:
    - name: Reobserve canonical route after retirement
      when: app_route_retirement is defined
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/traefik_route_observation.yml"

    - name: Require exact typed route absence
      assert:
        that:
          - route_observation.outcome == 'succeeded'
          - route_observation.presence == 'absent'
        fail_msg: "Whole-deployment route absence could not be verified"
      when: app_route_retirement is defined

    - name: Retain typed route absence for completed child output
      set_fact:
        retirement_after: "{{ route_observation }}"
      when: app_route_retirement is defined

- name: Finish exact managed container removal
  hosts: all
  gather_facts: false
  become: true
  vars:
    container_name: "{{ app_container_name | default('') }}"
  tasks:
    - name: Observe and drain only the admitted retiring incarnation
      when: drain_before_remove is defined
      block:
        - name: Validate bounded drain inputs
          ansible.builtin.assert:
            that:
              - drain_before_remove is mapping
              - drain_before_remove.keys() | difference(['container_id', 'container_port', 'timeout_s']) | length == 0
              - drain_before_remove.container_id is match('^[0-9a-f]{64}$')
              - drain_before_remove.container_port is integer
              - drain_before_remove.container_port >= 1
              - drain_before_remove.container_port <= 65535
              - drain_before_remove.timeout_s | default(120) is integer
              - drain_before_remove.timeout_s | default(120) >= 1
              - drain_before_remove.timeout_s | default(120) <= 120
            fail_msg: Routing procedure inputs are invalid. Refresh the review.
          no_log: true

        - name: Inspect recorded full runtime identity without adoption
          community.docker.docker_container_info:
            name: "{{ drain_before_remove.container_id }}"
          register: drain_container_info
          no_log: true

        - name: Require matching isolated running incarnation or exact absence
          ansible.builtin.assert:
            that:
              - container_absent == (not drain_container_info.exists)
              - container_absent or drain_container_info.container.Id == container_payload.Id
              - container_absent or drain_container_info.container.State.Running
              - container_absent or drain_container_info.container.State.Pid > 0
              - container_absent or drain_container_info.container.HostConfig.NetworkMode != 'host'
              - container_absent or not drain_container_info.container.HostConfig.NetworkMode.startswith('container:')
            fail_msg: Runtime connections could not be observed. Runtime removal was not performed.
          no_log: true

        - name: Capture admitted finite grace deadline
          ansible.builtin.command:
            argv:
              - date
              - --utc
              - "--date=+{{ drain_before_remove.timeout_s | default(120) }} seconds"
              - '+%Y-%m-%dT%H:%M:%S.000000Z'
          register: drain_deadline
          changed_when: false
          when: not container_absent

        - name: Poll read-only connections until clear or grace expiry
          ansible.builtin.script:
            cmd: >-
              {{ playbook_dir }}/../scripts/container_connection_drain.py
              --pid {{ drain_container_info.container.State.Pid }}
              --container-id {{ drain_before_remove.container_id }}
              --port {{ drain_before_remove.container_port }}
            executable: python3
          register: drain_sample
          changed_when: false
          until: >-
            drain_sample.rc != 0 or
            (drain_sample.stdout | from_json).active_inbound_connections == 0 or
            (drain_sample.stdout | from_json).observed_at >= drain_deadline.stdout
          retries: "{{ (drain_before_remove.timeout_s | default(120)) + 1 }}"
          delay: 1
          when: not container_absent
          no_log: true

        - name: Require observable count without treating elapsed time as absence
          ansible.builtin.assert:
            that:
              - drain_sample.rc == 0
              - (drain_sample.stdout | from_json).container_id == drain_before_remove.container_id
              - (drain_sample.stdout | from_json).active_inbound_connections is integer
              - (drain_sample.stdout | from_json).active_inbound_connections >= 0
            fail_msg: Runtime connections could not be observed. Runtime removal was not performed.
          when: not container_absent
          no_log: true

        - name: Recheck incarnation immediately before normal removal
          community.docker.docker_container_info:
            name: "{{ drain_before_remove.container_id }}"
          register: drain_recheck
          when: not container_absent
          no_log: true

        - name: Refuse changed incarnation before stopping
          ansible.builtin.assert:
            that:
              - drain_recheck.exists
              - drain_recheck.container.Id == drain_container_info.container.Id
              - drain_recheck.container.State.Pid == drain_container_info.container.State.Pid
              - drain_recheck.container.State.StartedAt == drain_container_info.container.State.StartedAt
              - drain_recheck.container.Image == drain_container_info.container.Image
              - drain_recheck.container.State.Running
            fail_msg: Runtime connections could not be observed. Runtime removal was not performed.
          when: not container_absent
          no_log: true

        - name: Timestamp confirmed prior absence without inventing a count
          ansible.builtin.command:
            argv: [date, -u, '+%Y-%m-%dT%H:%M:%SZ']
          register: drain_absent_time
          changed_when: false
          when: container_absent

        - name: Retain last observed runtime drain facts
          ansible.builtin.set_fact:
            removal_drain_facts:
              outcome: succeeded
              observed_at: "{{ drain_absent_time.stdout if container_absent else (drain_sample.stdout | from_json).observed_at }}"
              phase: runtime
              state: "{{ 'unknown' if container_absent else ('clear' if (drain_sample.stdout | from_json).active_inbound_connections == 0 else 'timed_out') }}"
              remaining_backends: null
              container_id: "{{ drain_before_remove.container_id }}"
              active_inbound_connections: "{{ none if container_absent else (drain_sample.stdout | from_json).active_inbound_connections }}"
          no_log: true
      rescue:
        - name: Timestamp unavailable runtime observation
          ansible.builtin.command:
            argv: [date, -u, '+%Y-%m-%dT%H:%M:%SZ']
          register: drain_failure_time
          changed_when: false

        - name: Publish bounded refusal without native error details
          ansible.builtin.debug:
            msg: >-
              TEMPLATE_OUTPUT_JSON={{ {'connection_drain': {
                'outcome': 'incomplete', 'observed_at': drain_failure_time.stdout,
                'phase': 'runtime', 'state': 'unknown', 'remaining_backends': none,
                'container_id': none, 'active_inbound_connections': none},
                'procedure_error': {'phase': 'drain', 'code': 'drain_unobservable'}} | to_json }}

        - name: Refuse unobservable drain without removal
          ansible.builtin.fail:
            msg: Runtime connections could not be observed. Runtime removal was not performed.

    - name: Remove inspected immutable container identity
      community.docker.docker_container:
        name: "{{ container_payload.Id }}"
        state: absent
        keep_volumes: true
        stop_timeout: 10
      register: container_remove
      when: container_inspect.rc == 0
      no_log: true

    - name: Verify inspected container identity is absent
      command:
        argv:
          - docker
          - inspect
          - --type=container
          - "{{ container_payload.Id }}"
      register: container_removed_inspect
      changed_when: false
      failed_when: false
      when: container_inspect.rc == 0
      no_log: true

    - name: Require exact inspected identity absence
      assert:
        that:
          - container_removed_inspect.rc == 1
          - (container_removed_inspect.stdout | trim) == '[]'
          - >-
            (container_removed_inspect.stderr | trim) in [
              'Error: No such object: ' ~ container_payload.Id,
              'Error response from daemon: No such container: ' ~ container_payload.Id
            ]
        fail_msg: "Inspected container removal could not be verified"
      when: container_inspect.rc == 0
      no_log: true

    - name: OPERATION_STEP remove:complete
      shell: |
        printf 'OPERATION_STEP={"name":"remove:complete","status":"completed","metadata":{"display_name":"Container removed","container_name":{{ container_name | to_json }},"removed":true}}\n'
      args:
        executable: /bin/sh
      when: container_inspect.rc == 0

    - name: Assemble complete verified removal output
      ansible.builtin.set_fact:
        verified_removal_output: >-
          {{ ({'deployment_route_observation': retirement_after} if app_route_retirement is defined else {}) |
            combine({'connection_drain': removal_drain_facts} if drain_before_remove is defined else {}) }}
      no_log: true

    - name: Observe retained native resources and exact predecessor absence
      ansible.builtin.include_tasks:
        file: ../tasks/container_observe.yml
        apply:
          no_log: true
      vars:
        image_runtime_action: remove

    - name: Add plain image facts without replacing separate routing and drain outputs
      ansible.builtin.set_fact:
        verified_removal_output: "{{ verified_removal_output | combine({'image_runtime': image_runtime}) }}"
      no_log: true

    - name: Bound complete removal output
      ansible.builtin.assert:
        that: verified_removal_output | to_json | length <= (131072 if (drain_before_remove is defined or app_route_retirement is defined) else 262144)
        fail_msg: Native removal observation exceeds the supported output limit.
      no_log: true

    - name: Return complete verified removal output
      ansible.builtin.debug:
        msg: "TEMPLATE_OUTPUT_JSON={{ verified_removal_output | to_json }}"

    - name: Refuse unqualified removal observation after publishing available facts
      ansible.builtin.assert:
        that:
          - image_runtime.observation_complete
          - image_runtime.container is none
          - image_runtime.previous_container_absent is none or image_runtime.previous_container_absent
        fail_msg: Native removal observation is incomplete. Retained resources remain referenced.
