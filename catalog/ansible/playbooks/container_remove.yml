---
- name: Remove OpsCtl-managed deployment container
  hosts: all
  gather_facts: false
  become: true
  vars:
    container_name: "{{ app_container_name | default('') }}"
    expected_org_id: "{{ app_org_id | default('') }}"
    expected_app_slug: "{{ app_slug | default('') }}"
    expected_deployment_id: "{{ app_deployment_id | default('') }}"
    expected_image_ref: "{{ app_expected_image_ref | default(none) }}"
  pre_tasks:
    - name: Validate exact reviewed Compose group removal
      ansible.builtin.assert:
        that:
          - app_compose_runtime is mapping
          - app_compose_runtime.protocol in ['opsctl-compose-runtime/1', 'opsctl-compose-runtime/2', 'opsctl-compose-attempt-cleanup/1', 'opsctl-compose-attempt-cleanup/2']
          - app_compose_runtime.action == 'remove'
          - app_compose_runtime.organization_id == app_org_id
          - app_compose_runtime.deployment_id == app_deployment_id
          - app_compose_runtime.server_id == server_id
          - app_compose_runtime.revision_id == app_revision_id
          - app_route_retirement is not defined
          - app_connection_drain is not defined
        fail_msg: "Compose group removal requires exact supported identity"
      when: app_compose_runtime is defined

    - name: Remove exact reviewed group through shared Compose exclusion
      ansible.builtin.include_tasks: ../tasks/container_compose.yml
      when: app_compose_runtime is defined

    - name: End grouped removal before single-container effects
      ansible.builtin.meta: end_play
      when: app_compose_runtime is defined
  tasks:
    - name: Validate canonical removal identity before inspection
      assert:
        that:
          - app_managed is defined
          - app_managed is boolean
          - app_managed
          - expected_org_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
          - expected_deployment_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
          - container_name is string
          - container_name | length > 0
          - expected_app_slug is string
          - expected_app_slug | length > 0
          - expected_image_ref is none or (expected_image_ref is string and expected_image_ref | length > 0)
        fail_msg: "Managed container removal identity is invalid"

    - name: Validate opt-in local removal identity
      assert:
        that:
          - app_local_runtime is mapping
          - app_local_runtime.protocol == 'opsctl-local-runtime/1'
          - app_local_runtime.action == 'remove'
          - app_local_runtime.organization_id == expected_org_id
          - app_local_runtime.deployment_id == expected_deployment_id
          - app_local_runtime.server_id == server_id
          - app_local_runtime.container_name == container_name
        fail_msg: "Local removal requires exact managed identity"
      when: app_local_runtime is defined

    - name: OPERATION_STEP remove:start
      shell: |
        printf 'OPERATION_STEP={"name":"remove:start","status":"running","metadata":{"display_name":"Remove container","container_name":{{ container_name | to_json }}}}\n'
      args:
        executable: /bin/sh

    - name: Inspect exact named container
      command:
        argv:
          - docker
          - inspect
          - --type=container
          - "{{ container_name }}"
      register: container_inspect
      changed_when: false
      failed_when: false
      no_log: true

    - name: Classify confirmed container absence
      set_fact:
        container_absent: >-
          {{ container_inspect.rc == 1 and
             (container_inspect.stdout | trim) == '[]' and
             (container_inspect.stderr | trim) in [
               'Error: No such object: ' ~ container_name,
               'Error response from daemon: No such container: ' ~ container_name
             ] }}
      no_log: true

    - name: Reject unobservable container state
      fail:
        msg: "Container removal inspection did not establish present or absent state"
      when:
        - container_inspect.rc != 0
        - not container_absent

    - name: OPERATION_STEP remove:complete when confirmed absent
      shell: |
        printf 'OPERATION_STEP={"name":"remove:complete","status":"completed","metadata":{"display_name":"Container already absent","container_name":{{ container_name | to_json }},"removed":false,"reason":"not_found"}}\n'
      args:
        executable: /bin/sh
      when: container_absent

    - name: Parse exact inspect payload
      set_fact:
        container_payloads: "{{ container_inspect.stdout | from_json }}"
        container_payload: "{{ (container_inspect.stdout | from_json)[0] }}"
      when: container_inspect.rc == 0
      no_log: true

    - name: Validate inspect object shape
      assert:
        that:
          - container_payloads is sequence
          - container_payloads | length == 1
          - container_payload is mapping
          - container_payload.Id is string
          - container_payload.Id is match('^[0-9a-f]{64}$')
          - container_payload.Name == '/' ~ container_name
          - container_payload.Config is mapping
          - container_payload.Config.Labels is mapping
        fail_msg: "Container removal inspection payload is malformed"
      when: container_inspect.rc == 0
      no_log: true

    - name: Validate exact managed identity and expected revision image
      assert:
        that:
          - container_payload.Config.Labels.get('com.opsctl.managed') == 'true'
          - container_payload.Config.Labels.get('com.opsctl.org_id') == expected_org_id
          - container_payload.Config.Labels.get('com.opsctl.deployment_id') == expected_deployment_id
          - container_payload.Config.Labels.get('com.opsctl.app') == expected_app_slug
          - expected_image_ref is none or container_payload.Config.Image == expected_image_ref
        fail_msg: "Refusing to remove a container without exact OpsCtl ownership"
      when: container_inspect.rc == 0
      no_log: true

    - name: Observe explicitly qualified whole-deployment route
      when: app_route_retirement is defined
      vars: &retirement_identity
        deployment_id: "{{ app_route_retirement.topology.deployment_id }}"
        org_id: "{{ app_route_retirement.topology.organization_id }}"
        server_id: "{{ app_route_retirement.topology.server_id }}"
        target_server: "{{ app_route_retirement.topology.server_name }}"
        traefik_container_name: traefik
        traefik_dynamic_dir: /etc/traefik/dynamic/opsctl
        route_file_path: "{{ traefik_dynamic_dir }}/deployment-{{ deployment_id }}.yml"
        route_key: "deployment-{{ deployment_id }}"
      block:
        - name: Validate opt-in route retirement identity
          assert:
            that:
              - app_route_retirement is mapping
              - app_route_retirement.version == 1
              - app_route_retirement.topology.gateway_engine in ['traefik', 'caddy']
              - org_id == app_org_id
              - deployment_id == app_deployment_id
              - app_route_retirement.topology.app_container_name == app_container_name
              - app_route_retirement.topology.app_slug == app_slug
              - app_route_retirement.topology.server_name == target_server
              - app_route_retirement.topology.route_hosts | length > 0
            fail_msg: "Whole-deployment route retirement identity is invalid"

        - name: Read canonical route observation
          block: &retirement_observer
            - name: Observe exact Traefik watched file
              include_tasks: "{{ playbook_dir }}/../tasks/traefik_route_observation.yml"
              when: app_route_retirement.topology.gateway_engine == 'traefik'

            - name: Observe exact Caddy route through its canonical helper
              script: "{{ playbook_dir }}/../scripts/caddy_route_contract.py observe"
              environment:
                OPSCTL_DEPLOYMENT_ID: "{{ deployment_id }}"
                OPSCTL_ORGANIZATION_ID: "{{ org_id }}"
                OPSCTL_PROXY_ENGINE: caddy
                OPSCTL_SERVER_ID: "{{ server_id }}"
                OPSCTL_TARGET_SERVER: "{{ target_server }}"
              register: retirement_caddy_observer
              changed_when: false
              when: app_route_retirement.topology.gateway_engine == 'caddy'

            - name: Read canonical Caddy output envelope
              set_fact:
                retirement_caddy_outputs: >-
                  {{ retirement_caddy_observer.stdout_lines | select('match', '^TEMPLATE_OUTPUT_JSON=') | list }}
              when: app_route_retirement.topology.gateway_engine == 'caddy'

            - name: Require one Caddy output envelope
              assert:
                that: retirement_caddy_outputs | length == 1
                fail_msg: "Canonical Caddy route observation is unavailable"
              when: app_route_retirement.topology.gateway_engine == 'caddy'

            - name: Read typed Caddy observation without parsing route files
              set_fact:
                route_observation: "{{ (retirement_caddy_outputs[0] | regex_replace('^TEMPLATE_OUTPUT_JSON=', '') | from_json).deployment_route_observation }}"
              when: app_route_retirement.topology.gateway_engine == 'caddy'

        - name: Require current route to match captured ownership or absence
          assert:
            that:
              - route_observation == app_route_retirement.present or route_observation == app_route_retirement.absent
            fail_msg: "Whole-deployment route changed before retirement"

        - name: Preserve fresh route comparison evidence
          set_fact:
            retirement_before: "{{ route_observation }}"

- import_playbook: traefik_route_converge.yml
  when: app_route_retirement is defined and app_route_retirement.topology.gateway_engine == 'traefik'
  vars: &retirement_converge
    deployment_id: "{{ app_route_retirement.topology.deployment_id }}"
    org_id: "{{ app_route_retirement.topology.organization_id }}"
    server_id: "{{ app_route_retirement.topology.server_id }}"
    target_server: "{{ app_route_retirement.topology.server_name }}"
    app_slug: "{{ app_route_retirement.topology.app_slug }}"
    app_container_name: "{{ app_route_retirement.topology.app_container_name }}"
    route_state: absent
    route_hosts: []
    route_port: "{{ app_route_retirement.remove_args.route_port }}"
    route_https: false
    redirect_http_to_https: false
    route_middlewares: "{{ app_route_retirement.remove_args.route_middlewares }}"
    route_tls_binding: null
    expected_route_observation: "{{ retirement_before }}"
    proxy_engine: caddy
    execution_contract: configuration

- import_playbook: caddy_route_converge.yml
  when: app_route_retirement is defined and app_route_retirement.topology.gateway_engine == 'caddy'
  vars: *retirement_converge

- name: Verify qualified whole-deployment route absence
  hosts: all
  gather_facts: false
  become: true
  vars: *retirement_identity
  pre_tasks:
    - name: Exclude grouped removal from single-container route verification
      ansible.builtin.meta: end_play
      when: app_compose_runtime is defined
  tasks:
    - name: Reobserve canonical route after retirement
      when: app_route_retirement is defined
      block: *retirement_observer

    - name: Require exact typed route absence
      assert:
        that: route_observation == app_route_retirement.absent
        fail_msg: "Whole-deployment route absence could not be verified"
      when: app_route_retirement is defined

    - name: Retain typed route absence for completed child output
      set_fact:
        retirement_after: "{{ route_observation }}"
      when: app_route_retirement is defined

- name: Finish exact managed container removal
  hosts: all
  gather_facts: false
  become: true
  vars:
    container_name: "{{ app_container_name | default('') }}"
  pre_tasks:
    - name: Exclude already-verified grouped removal from single-container completion
      ansible.builtin.meta: end_play
      when: app_compose_runtime is defined
  tasks:
    - name: Verify opt-in HTTP drain barrier and exact inbound-zero before removal
      command:
        argv:
          - python3
          - -c
          - |
            import datetime, hashlib, json, os, pathlib, re, subprocess, sys, time
            from urllib.parse import urlsplit

            packet = json.loads(sys.argv[1])
            mode = sys.argv[2]
            root_dir = pathlib.Path(sys.argv[3])
            contract, previous = packet['contract'], packet['receipt']
            def digest(value):
                return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
            def run(*args):
                return subprocess.check_output(args, text=True).strip()
            def confirmed_absence(identity):
                result = subprocess.run(
                    ['docker', 'inspect', '--type=container', identity],
                    text=True, capture_output=True,
                )
                return (result.returncode == 1 and result.stdout.strip() == '[]'
                        and result.stderr.strip() in (
                            'Error: No such object: ' + identity,
                            'Error response from daemon: No such container: ' + identity,
                        ))
            def inspect():
                items = json.loads(run('docker', 'inspect', '--type=container', contract['container_name']))
                if len(items) != 1:
                    raise ValueError('drain_container_unobservable')
                value = items[0]
                labels = value['Config']['Labels']
                required = {
                    'com.opsctl.managed': 'true', 'com.opsctl.org_id': contract['organization_id'],
                    'com.opsctl.deployment_id': contract['deployment_id'],
                    'com.opsctl.app': contract['app_slug'], 'com.opsctl.revision_id': contract['revision_id'],
                }
                if any(labels.get(key) != item for key, item in required.items()):
                    raise ValueError('drain_container_owner_changed')
                if value['Config']['Image'] != contract['image_ref'] or not value['State']['Running']:
                    raise ValueError('drain_container_revision_changed')
                network_mode = value['HostConfig']['NetworkMode']
                if network_mode == 'host' or network_mode.startswith('container:'):
                    raise ValueError('drain_shared_namespace_unsupported')
                return value
            now = datetime.datetime.now(datetime.timezone.utc)
            gateway = previous['gateway']
            if (previous['contract_digest'] != digest(contract)
                    or previous['digest'] != digest({k: v for k, v in previous.items() if k != 'digest'})
                    or gateway['route_observation'] != contract['route_observation']):
                raise ValueError('drain_gateway_authority_changed')
            if mode == 'remove' and confirmed_absence(contract['container_name']):
                expected = previous['runtime']
                chain = 'ocd' + digest({'root_id': contract['root_id'], 'container_id': expected['container_id']})[:20]
                path = root_dir / (chain + '.json')
                if (not isinstance(expected['container_id'], str)
                        or re.fullmatch('[0-9a-f]{64}', expected['container_id']) is None
                        or root_dir.is_symlink() or not root_dir.is_dir()
                        or root_dir.stat().st_uid != 0 or root_dir.stat().st_mode & 0o077
                        or path.is_symlink() or not path.is_file()
                        or path.stat().st_uid != 0 or path.stat().st_mode & 0o077
                        or json.loads(path.read_text()) != previous
                        or expected['barrier_id'] != chain
                        or type(expected['active_inbound_connections']) is not int
                        or expected['active_inbound_connections'] != 0
                        or not confirmed_absence(expected['container_id'])):
                    raise ValueError('drain_absence_replay_unqualified')
                sys.exit(0)
            age = (now - datetime.datetime.fromisoformat(gateway['observed_at'].replace('Z', '+00:00'))).total_seconds()
            if not 0 <= age <= contract['timeout_s'] + 60:
                raise ValueError('drain_gateway_authority_stale')
            runtime = inspect()
            container_id, pid = runtime['Id'], runtime['State']['Pid']
            namespace = os.stat('/proc/%s/ns/net' % pid).st_ino
            if namespace == os.stat('/proc/1/ns/net').st_ino:
                raise ValueError('drain_host_namespace_unsupported')
            for other_id in run('docker', 'ps', '-q').splitlines():
                other = json.loads(run('docker', 'inspect', other_id))[0]
                if other['Id'] != container_id and os.stat('/proc/%s/ns/net' % other['State']['Pid']).st_ino == namespace:
                    raise ValueError('drain_namespace_is_shared')
            endpoint = urlsplit(contract['backend_url'])
            mappings = runtime['HostConfig']['PortBindings'] or {}
            ports = []
            for internal, bindings in mappings.items():
                for binding in bindings or []:
                    if int(binding['HostPort']) == endpoint.port and binding['HostIp'] in ('', '0.0.0.0', endpoint.hostname):
                        if not internal.endswith('/tcp'):
                            raise ValueError('drain_non_tcp_port')
                        ports.append(int(internal.split('/')[0]))
            if len(ports) != 1:
                raise ValueError('drain_port_binding_ambiguous')
            port = ports[0]
            chain = 'ocd' + digest({'root_id': contract['root_id'], 'container_id': container_id})[:20]
            def firewall(*args):
                current = inspect()
                if (current['Id'] != container_id or current['State']['Pid'] != pid
                        or os.stat('/proc/%s/ns/net' % pid).st_ino != namespace):
                    raise ValueError('drain_barrier_namespace_changed')
                return run('nsenter', '-t', str(pid), '-n', 'iptables', '-w', *args)
            jump = ('INPUT', '-p', 'tcp', '-m', 'tcp', '--dport', str(port), '-m', 'conntrack', '--ctstate', 'NEW', '-j', chain)
            barrier_rule = '-A %s -p tcp -m tcp -j REJECT --reject-with tcp-reset' % chain
            def check_barrier():
                if firewall('-S', chain).splitlines() != ['-N ' + chain, barrier_rule]:
                    raise ValueError('drain_barrier_changed')
                firewall('-C', *jump)
            def count():
                active, listeners = 0, 0
                for table in ('tcp', 'tcp6'):
                    for line in pathlib.Path('/proc/%s/net/%s' % (pid, table)).read_text().splitlines()[1:]:
                        fields = line.split()
                        if int(fields[1].rsplit(':', 1)[1], 16) != port:
                            continue
                        state = fields[3]
                        if state == '0A':
                            listeners += 1
                        elif state not in ('06', '07'):
                            active += 1
                if not listeners:
                    raise ValueError('drain_listener_unobservable')
                current = inspect()
                if (current['Id'] != container_id or current['State']['Pid'] != pid
                        or os.stat('/proc/%s/ns/net' % pid).st_ino != namespace):
                    raise ValueError('drain_runtime_changed')
                return active
            root_dir.mkdir(mode=0o700, parents=True, exist_ok=True)
            if root_dir.is_symlink() or root_dir.stat().st_uid != 0 or root_dir.stat().st_mode & 0o077:
                raise ValueError('drain_custody_directory_invalid')
            path = root_dir / (chain + '.json')
            if path.is_symlink() or path.with_suffix('.tmp').is_symlink():
                raise ValueError('drain_custody_path_invalid')
            if path.exists():
                if not path.is_file() or path.stat().st_uid != 0 or path.stat().st_mode & 0o077:
                    raise ValueError('drain_local_custody_invalid')
                prior = json.loads(path.read_text())
                expected = prior['runtime']
                if (prior['contract_digest'] != digest(contract)
                        or prior['digest'] != digest({k: v for k, v in prior.items() if k != 'digest'})
                        or prior['gateway']['route_observation'] != gateway['route_observation']
                        or (expected['container_id'], expected['netns_inode'], expected['listen_port'], expected['barrier_id'])
                        != (container_id, namespace, port, chain)):
                    raise ValueError('drain_local_owner_changed')
            if mode == 'remove':
                if json.loads(path.read_text()) != previous:
                    raise ValueError('drain_local_receipt_changed')
                expected = previous['runtime']
                if (expected['container_id'], expected['netns_inode'], expected['listen_port'], expected['barrier_id']) != (container_id, namespace, port, chain):
                    raise ValueError('drain_removal_binding_changed')
                check_barrier()
                if count() != 0:
                    raise ValueError('drain_inbound_connections_not_zero')
            elif mode == 'observe':
                intent_path = root_dir / (chain + '.barrier')
                intent = {
                    'contract_digest': digest(contract), 'container_id': container_id,
                    'netns_inode': namespace, 'listen_port': port, 'barrier_id': chain,
                }
                def chain_rules():
                    current = inspect()
                    if (current['Id'] != container_id or current['State']['Pid'] != pid
                            or os.stat('/proc/%s/ns/net' % pid).st_ino != namespace):
                        raise ValueError('drain_barrier_namespace_changed')
                    result = subprocess.run(
                        ['nsenter', '-t', str(pid), '-n', 'iptables', '-w', '-S', chain],
                        text=True, capture_output=True,
                    )
                    if result.returncode == 0:
                        return result.stdout.strip().splitlines()
                    if result.returncode == 1 and 'No chain/target/match by that name' in result.stderr:
                        return None
                    raise ValueError('drain_barrier_unobservable')
                initial_rules = chain_rules()
                if intent_path.exists() or intent_path.is_symlink():
                    if (intent_path.is_symlink() or not intent_path.is_file()
                            or intent_path.stat().st_uid != 0 or intent_path.stat().st_mode & 0o077
                            or json.loads(intent_path.read_text()) != intent):
                        raise ValueError('drain_barrier_custody_changed')
                else:
                    if initial_rules is not None:
                        raise ValueError('drain_foreign_barrier')
                    descriptor = os.open(str(intent_path), os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                    with os.fdopen(descriptor, 'w') as stream:
                        json.dump(intent, stream, sort_keys=True, separators=(',', ':'))
                jump_rule = '-A ' + ' '.join(jump)
                def owned_partial():
                    if json.loads(intent_path.read_text()) != intent:
                        raise ValueError('drain_barrier_custody_changed')
                    rules = chain_rules()
                    if rules not in (None, ['-N ' + chain], ['-N ' + chain, barrier_rule]):
                        raise ValueError('drain_barrier_changed')
                    references = [line for line in firewall('-S').splitlines() if '-j ' + chain in line]
                    if references not in ([], [jump_rule]):
                        raise ValueError('drain_barrier_references_changed')
                    return rules, references
                try:
                    rules, references = owned_partial()
                    if rules is None:
                        firewall('-N', chain)
                        rules = ['-N ' + chain]
                    if rules == ['-N ' + chain]:
                        firewall('-A', chain, '-p', 'tcp', '-m', 'tcp', '-j', 'REJECT', '--reject-with', 'tcp-reset')
                    if not references:
                        firewall('-I', *jump)
                    deadline = time.monotonic() + contract['timeout_s']
                    while True:
                        check_barrier()
                        if count() == 0:
                            break
                        if time.monotonic() >= deadline:
                            raise ValueError('drain_active_inbound_timeout')
                        time.sleep(0.25)
                    observed = {
                        'container_id': container_id, 'netns_inode': namespace, 'listen_port': port,
                        'active_inbound_connections': 0, 'barrier_id': chain,
                        'observed_at': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
                    }
                    receipt = {'version': 1, 'contract_digest': digest(contract), 'gateway': gateway, 'runtime': observed}
                    receipt['digest'] = digest(receipt)
                    encoded = json.dumps(receipt, sort_keys=True, separators=(',', ':'))
                    temporary = path.with_suffix('.tmp')
                    descriptor = os.open(str(temporary), os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
                    with os.fdopen(descriptor, 'w') as stream:
                        stream.write(encoded)
                    os.replace(temporary, path)
                    print('TEMPLATE_OUTPUT_JSON=' + json.dumps({'connection_drain': receipt}, separators=(',', ':')))
                except Exception:
                    rules, references = owned_partial()
                    if references:
                        firewall('-D', *jump)
                    if rules == ['-N ' + chain, barrier_rule]:
                        firewall('-D', chain, '-p', 'tcp', '-m', 'tcp', '-j', 'REJECT', '--reject-with', 'tcp-reset')
                    if rules is not None:
                        firewall('-X', chain)
                    raise
            else:
                raise ValueError('drain_mode_invalid')
          - "{{ app_connection_drain | to_json }}"
          - "{{ app_connection_drain_mode | default('remove') }}"
          - "{{ opsctl_drain_receipt_dir | default('/var/lib/opsctl/connection-drains') }}"
      register: connection_drain_check
      when: app_connection_drain is defined

    - name: Return registered connection drain observation
      debug:
        msg: "{{ connection_drain_check.stdout }}"
      when: app_connection_drain is defined and app_connection_drain_mode | default('remove') == 'observe'

    - name: End observation-only drain without container removal
      meta: end_play
      when: app_connection_drain is defined and app_connection_drain_mode | default('remove') == 'observe'

    - name: Require drain receipt to match originally inspected immutable container
      assert:
        that:
          - not container_absent
          - container_payload.Id == app_connection_drain.receipt.runtime.container_id
        fail_msg: "Connection drain inspected container identity changed"
      when: app_connection_drain is defined and not container_absent

    - name: Bind Compose removal to the same canonical drain incarnation
      assert:
        that:
          - app_local_runtime.previous.container_id == app_connection_drain.receipt.runtime.container_id
          - app_local_runtime.previous.revision_id == app_connection_drain.contract.revision_id
          - container_absent or app_local_runtime.previous.container_id == container_payload.Id
        fail_msg: "Compose removal and drain receipt must name the same incarnation"
      when: app_local_runtime is defined and app_connection_drain is defined

    - name: Remove the shared reviewed Compose deployment
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/container_compose.yml"
        apply:
          no_log: true
      when: app_local_runtime is defined

    - name: Remove inspected immutable container identity
      command:
        argv:
          - docker
          - rm
          - -f
          - "{{ container_payload.Id }}"
      register: container_remove
      changed_when: container_remove.rc == 0
      when: container_inspect.rc == 0 and app_local_runtime is not defined

    - name: Record exact whole-final route retirement evidence
      set_fact:
        removal_route_receipt: >-
            {{ {'version': 1, 'identity': {
              'organization_id': app_route_retirement.topology.organization_id,
              'deployment_id': app_route_retirement.topology.deployment_id,
              'server_id': app_route_retirement.topology.server_id,
              'gateway_id': app_route_retirement.topology.gateway_id,
              'node_id': app_route_retirement.topology.node_id,
              'revision_id': app_route_retirement.topology.revision_id,
              'identity_digest': app_route_retirement.topology.identity_digest
            }, 'observation': retirement_after} }}
      when: app_route_retirement is defined

    - name: Verify inspected container identity is absent
      command:
        argv:
          - docker
          - inspect
          - --type=container
          - "{{ container_payload.Id }}"
      register: container_removed_inspect
      changed_when: false
      failed_when: false
      when: container_inspect.rc == 0
      no_log: true

    - name: Require exact inspected identity absence
      assert:
        that:
          - container_removed_inspect.rc == 1
          - (container_removed_inspect.stdout | trim) == '[]'
          - >-
            (container_removed_inspect.stderr | trim) in [
              'Error: No such object: ' ~ container_payload.Id,
              'Error response from daemon: No such container: ' ~ container_payload.Id
            ]
        fail_msg: "Inspected container removal could not be verified"
      when: container_inspect.rc == 0
      no_log: true

    - name: OPERATION_STEP remove:complete
      shell: |
        printf 'OPERATION_STEP={"name":"remove:complete","status":"completed","metadata":{"display_name":"Container removed","container_name":{{ container_name | to_json }},"removed":true}}\n'
      args:
        executable: /bin/sh
      when: container_inspect.rc == 0

    - name: Record exact drain-bound verified removal
      command:
        argv:
          - python3
          - -c
          - |
            import json, sys
            receipt = json.loads(sys.argv[1])
            value = {
                'contract_digest': receipt['contract_digest'],
                'container_id': receipt['runtime']['container_id'], 'absent': True,
            }
            print('TEMPLATE_OUTPUT_JSON=' + json.dumps({'connection_drain_removal': value}, separators=(',', ':')))
          - "{{ app_connection_drain.receipt | to_json }}"
      register: drain_removal_output
      changed_when: false
      when: app_connection_drain is defined
      no_log: true

    - name: Assemble complete verified removal output
      command:
        argv:
          - python3
          - -c
          - |
            import json, sys

            def registered(text, key):
                lines = text.strip().splitlines()
                prefix = 'TEMPLATE_OUTPUT_JSON='
                if len(lines) != 1 or not lines[0].startswith(prefix):
                    raise ValueError()
                envelope = json.loads(lines[0][len(prefix):])
                if not isinstance(envelope, dict) or set(envelope) != {key}:
                    raise ValueError()
                value = envelope[key]
                if not isinstance(value, dict):
                    raise ValueError()
                return value

            try:
                request = json.loads(sys.argv[2])
                route = json.loads(sys.argv[3])
                drain_required = json.loads(sys.argv[5])
                output = {}
                if request:
                    proof = registered(sys.argv[1], 'local_runtime')
                    if (proof.get('protocol') != 'opsctl-local-runtime/1'
                            or proof.get('presence') != 'absent' or proof.get('ready') is not False
                            or any(proof.get(key) != request[key] for key in (
                                'organization_id', 'deployment_id', 'server_id', 'operation_id', 'revision_id'))
                            or proof.get('container_id') != request['previous']['container_id']
                            or not isinstance(proof.get('attachments'), list)
                            or not isinstance(proof.get('detached_attachments', []), list)):
                        raise ValueError()
                    output['local_runtime'] = proof
                elif sys.argv[1]:
                    raise ValueError()
                if route:
                    if (not isinstance(route, dict) or set(route) != {'version', 'identity', 'observation'}
                            or type(route['version']) is not int or route['version'] != 1
                            or not isinstance(route['identity'], dict) or not isinstance(route['observation'], dict)):
                        raise ValueError()
                    output['route_retirement'] = route
                if drain_required:
                    receipt = registered(sys.argv[4], 'connection_drain_removal')
                    if set(receipt) != {'contract_digest', 'container_id', 'absent'} or receipt['absent'] is not True:
                        raise ValueError()
                    output['connection_drain_removal'] = receipt
                elif sys.argv[4]:
                    raise ValueError()
                if output:
                    print('TEMPLATE_OUTPUT_JSON=' + json.dumps(output, separators=(',', ':')))
            except Exception:
                print('Canonical removal output is invalid.', file=sys.stderr)
                raise SystemExit(1)
          - "{{ compose_transition.stdout | default('') if app_local_runtime is defined else '' }}"
          - "{{ (app_local_runtime if app_local_runtime is defined else {}) | to_json }}"
          - "{{ removal_route_receipt | default({}) | to_json }}"
          - "{{ drain_removal_output.stdout | default('') if app_connection_drain is defined else '' }}"
          - "{{ (app_connection_drain is defined) | to_json }}"
      register: verified_removal_output
      changed_when: false
      no_log: true

    - name: Return complete verified removal output
      debug:
        msg: "{{ verified_removal_output.stdout }}"
      when: verified_removal_output.stdout | length > 0
