---
- name: Ensure canonical managed Traefik gateway
  hosts: all
  gather_facts: false
  become: true
  vars:
    traefik_container_name: "traefik"
    traefik_image: "traefik@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0"
    traefik_dynamic_dir: "/etc/traefik/dynamic/opsctl"
    traefik_acme_dir: "/var/lib/traefik"
    traefik_certificate_dir: "/etc/traefik/certificates/opsctl"
    acme_staging_url: "https://acme-staging-v02.api.letsencrypt.org/directory"
    traefik_gateway_target_major: 3
    traefik_gateway_target_version: "3.7.13"
    traefik_gateway_allow_major_upgrade: false
  pre_tasks:
    - name: Skip Traefik ensure when running in simulate mode
      meta: end_play
      when: simulate | default(false)

  tasks:
    - name: OPERATION_STEP traefik:start
      shell: |
        printf 'OPERATION_STEP={"name":"traefik:start","status":"running","metadata":{"display_name":"Ensure Traefik gateway"}}\n'
      args:
        executable: /bin/sh

    - name: Converge managed Traefik gateway
      block:
        - name: Build Traefik command arguments
          include_tasks: ../tasks/traefik_gateway_command.yml
          vars:
            traefik_gateway_acme_enabled: true
            traefik_gateway_acme_environment: "{{ traefik_acme_server | default('production') }}"
            traefik_gateway_acme_staging_url: "{{ acme_staging_url }}"
            traefik_gateway_dashboard_enabled: false

        - name: Converge canonical Traefik runtime layout
          include_tasks: ../tasks/traefik_gateway_runtime_layout.yml
          vars:
            traefik_gateway_policy_labels: {}
            traefik_gateway_force_recreate: false
            traefik_gateway_sensitive: false

        - name: OPERATION_STEP traefik:ready
          shell: |
            printf 'OPERATION_STEP={"name":"traefik:ready","status":"completed","metadata":{"display_name":"Verify Traefik gateway"}}\n'
          args:
            executable: /bin/sh

        - name: OPERATION_STEP traefik:complete
          shell: |
            printf 'OPERATION_STEP={"name":"traefik:complete","status":"completed","metadata":{"display_name":"Traefik gateway ready"}}\n'
          args:
            executable: /bin/sh
      rescue:
        - name: OPERATION_STEP traefik:failure
          shell: |
            printf 'OPERATION_STEP={"name":"traefik:failure","status":"failed","metadata":{"display_name":"Traefik gateway failed"}}\n'
          args:
            executable: /bin/sh

        - name: Fail Traefik gateway ensure
          fail:
            msg: "Traefik gateway ensure failed"
