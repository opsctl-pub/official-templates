---
- name: Ensure per-deployment WireGuard overlay
  hosts: all
  gather_facts: false
  become: true
  vars:
    wireguard_base_dir: "/etc/wireguard"
    wireguard_requested_state: "{{ wireguard_state | default('present') }}"
    wireguard_requested_listen_port: "{{ wireguard_listen_port | default(51820) }}"
    short_deployment_id: "{{ (deployment_id | string | regex_replace('-', ''))[:8] }}"
    wireguard_interface_name: "wg-{{ short_deployment_id }}"
    wireguard_private_key_path: "{{ wireguard_base_dir }}/{{ wireguard_interface_name }}.key"
    wireguard_public_key_path: "{{ wireguard_base_dir }}/{{ wireguard_interface_name }}.pub"
    wireguard_config_path: "{{ wireguard_base_dir }}/{{ wireguard_interface_name }}.conf"
    wireguard_service_name: "wg-quick@{{ wireguard_interface_name }}"
    wireguard_requested_peers: "{{ wireguard_peers | default([]) }}"
  pre_tasks:
    - name: Skip WireGuard ensure when running in simulate mode
      meta: end_play
      when: simulate | default(false)

  tasks:
    - name: OPERATION_STEP wireguard:start
      shell: |
        printf 'OPERATION_STEP={"name":"wireguard:start","status":"running","metadata":{"display_name":"Configure WireGuard overlay"}}\n'
      args:
        executable: /bin/sh

    - name: Converge WireGuard overlay state
      block:
        - name: Ensure WireGuard packages present
          apt:
            name:
              - wireguard
            state: present
            update_cache: true

        - name: Ensure WireGuard base directory exists
          file:
            path: "{{ wireguard_base_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Remove WireGuard overlay when absent requested
          block:
            - name: Stop WireGuard service
              systemd:
                name: "{{ wireguard_service_name }}"
                state: stopped
                enabled: false
              failed_when: false

            - name: Delete WireGuard interface
              command: "ip link delete dev {{ wireguard_interface_name }}"
              failed_when: false
              changed_when: false

            - name: Remove WireGuard files
              file:
                path: "{{ item }}"
                state: absent
              loop:
                - "{{ wireguard_config_path }}"
                - "{{ wireguard_private_key_path }}"
                - "{{ wireguard_public_key_path }}"

            - name: OPERATION_STEP wireguard:complete absent
              shell: |
                printf 'OPERATION_STEP={"name":"wireguard:complete","status":"completed","metadata":{"display_name":"WireGuard overlay removed"}}\n'
              args:
                executable: /bin/sh

            - name: End play after WireGuard cleanup
              meta: end_play
          when: wireguard_requested_state == "absent"

        - name: Validate required WireGuard variables
          assert:
            that:
              - deployment_id is defined
              - overlay_cidr is defined
              - wireguard_ip is defined
              - (overlay_cidr | string | length) > 0
              - (wireguard_ip | string | length) > 0
            fail_msg: "deployment_id, overlay_cidr, and wireguard_ip are required for WireGuard overlay setup"

        - name: Derive WireGuard interface address
          set_fact:
            wireguard_interface_address: "{{ wireguard_ip if ('/' in (wireguard_ip | string)) else (wireguard_ip ~ '/' ~ (overlay_cidr | regex_replace('^.*/', ''))) }}"

        - name: Capture exact WireGuard systemd unit state
          ansible.builtin.systemd_service:
            name: "{{ wireguard_service_name }}.service"
          register: wireguard_service_query
          changed_when: false
          failed_when: false

        - name: Capture existing WireGuard interface state
          command: "ip link show dev {{ wireguard_interface_name }}"
          register: wireguard_interface_before
          changed_when: false
          failed_when: false

        - name: Capture existing WireGuard file state
          stat:
            path: "{{ item.path }}"
          loop:
            - {name: config, path: "{{ wireguard_config_path }}"}
            - {name: private, path: "{{ wireguard_private_key_path }}"}
            - {name: public, path: "{{ wireguard_public_key_path }}"}
          register: wireguard_file_stats

        - name: Normalize exact WireGuard systemd state
          set_fact:
            wireguard_service_before: "{{ wireguard_service_query.status | default({}) }}"
            wireguard_interface_was_present: "{{ wireguard_interface_before.rc == 0 }}"
            wireguard_config_before: "{{ (wireguard_file_stats.results | selectattr('item.name', 'equalto', 'config') | list | first).stat }}"
            wireguard_private_before: "{{ (wireguard_file_stats.results | selectattr('item.name', 'equalto', 'private') | list | first).stat }}"
            wireguard_public_before: "{{ (wireguard_file_stats.results | selectattr('item.name', 'equalto', 'public') | list | first).stat }}"
            wireguard_activation_started: false

        - name: Normalize WireGuard systemd status fields
          set_fact:
            wireguard_service_has_status: "{{ wireguard_service_before is mapping and wireguard_service_before | length > 0 }}"
            wireguard_service_load_state: "{{ wireguard_service_before.get('LoadState', '') }}"
            wireguard_service_active_state: "{{ wireguard_service_before.get('ActiveState', '') }}"
            wireguard_service_sub_state: "{{ wireguard_service_before.get('SubState', '') }}"
            wireguard_service_unit_file_state: "{{ wireguard_service_before.get('UnitFileState', '') }}"

        - name: Validate exact WireGuard systemd status
          set_fact:
            wireguard_service_status_valid: >-
              {{ wireguard_service_has_status
                 and wireguard_service_load_state == 'loaded'
                 and wireguard_service_active_state in ['active', 'inactive']
                 and wireguard_service_sub_state is string
                 and wireguard_service_sub_state | length > 0
                 and wireguard_service_sub_state not in ['unknown', 'failed']
                 and wireguard_service_unit_file_state in ['enabled', 'disabled'] }}
            wireguard_service_was_enabled: "{{ wireguard_service_unit_file_state == 'enabled' }}"
            wireguard_service_was_running: "{{ wireguard_service_active_state == 'active' }}"

        - name: Require preexisting WireGuard interface ownership
          assert:
            that:
              - >-
                (not wireguard_interface_was_present)
                or (
                  wireguard_service_status_valid
                  and wireguard_service_was_running
                )
              - >-
                (not wireguard_service_has_status)
                or wireguard_service_status_valid
            fail_msg: >-
              WireGuard systemd ownership is missing, malformed, inactive, failed,
              or unsupported before activation.

        - name: Create private WireGuard transaction scratch
          tempfile:
            state: directory
            prefix: opsctl-wireguard-
          register: wireguard_transaction_scratch
          no_log: true

        - name: Back up existing WireGuard configuration
          copy:
            src: "{{ wireguard_config_path }}"
            dest: "{{ wireguard_transaction_scratch.path }}/config"
            remote_src: true
            owner: root
            group: root
            mode: "{{ wireguard_config_before.mode }}"
          when: wireguard_transaction_scratch is defined and wireguard_config_before is defined and wireguard_config_before.exists
          no_log: true

        - name: Back up existing WireGuard private key
          copy:
            src: "{{ wireguard_private_key_path }}"
            dest: "{{ wireguard_transaction_scratch.path }}/private"
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          when: wireguard_private_before.exists
          no_log: true

        - name: Back up existing WireGuard public key
          copy:
            src: "{{ wireguard_public_key_path }}"
            dest: "{{ wireguard_transaction_scratch.path }}/public"
            remote_src: true
            owner: root
            group: root
            mode: "{{ wireguard_public_before.mode }}"
          when: wireguard_public_before.exists
          no_log: true

        - name: Build candidate WireGuard private key
          shell: |
            umask 077
            wg genkey > "{{ wireguard_transaction_scratch.path }}/candidate-private"
          args:
            executable: /bin/sh
          when: not wireguard_private_before.exists
          no_log: true

        - name: Copy existing private key into candidate
          copy:
            src: "{{ wireguard_transaction_scratch.path }}/private"
            dest: "{{ wireguard_transaction_scratch.path }}/candidate-private"
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          when: wireguard_private_before.exists
          no_log: true

        - name: Derive candidate WireGuard public key
          shell: |
            umask 077
            wg pubkey < "{{ wireguard_transaction_scratch.path }}/candidate-private" > "{{ wireguard_transaction_scratch.path }}/candidate-public"
          args:
            executable: /bin/sh
          no_log: true

        - name: Read candidate WireGuard public key
          command: "cat {{ wireguard_transaction_scratch.path }}/candidate-public"
          register: wireguard_candidate_public_key
          changed_when: false

        - name: Read candidate WireGuard private key
          command: "cat {{ wireguard_transaction_scratch.path }}/candidate-private"
          register: wireguard_candidate_private_key
          changed_when: false
          no_log: true

        - name: Build candidate WireGuard configuration
          copy:
            dest: "{{ wireguard_transaction_scratch.path }}/candidate.conf"
            owner: root
            group: root
            mode: "0600"
            content: |
              [Interface]
              Address = {{ wireguard_interface_address }}
              ListenPort = {{ wireguard_requested_listen_port }}
              PrivateKey = {{ wireguard_candidate_private_key.stdout | trim }}
              PostUp = iptables -C INPUT -p udp --dport {{ wireguard_requested_listen_port }} -j ACCEPT || iptables -I INPUT -p udp --dport {{ wireguard_requested_listen_port }} -j ACCEPT
              PostDown = iptables -D INPUT -p udp --dport {{ wireguard_requested_listen_port }} -j ACCEPT || true
              {% for peer in wireguard_requested_peers %}

              [Peer]
              PublicKey = {{ peer.public_key }}
              AllowedIPs = {{ peer.allowed_ips }}
              {% if peer.endpoint is defined and peer.endpoint %}
              Endpoint = {{ peer.endpoint }}
              {% endif %}
              {% if peer.persistent_keepalive is defined and peer.persistent_keepalive %}
              PersistentKeepalive = {{ peer.persistent_keepalive }}
              {% endif %}
              {% endfor %}
          no_log: true

        - name: Validate candidate WireGuard configuration
          command: "wg-quick strip {{ wireguard_transaction_scratch.path }}/candidate.conf"
          changed_when: false
          no_log: true

        - name: Mark WireGuard activation as started
          set_fact:
            wireguard_activation_started: true

        - name: Install validated WireGuard private key
          copy:
            src: "{{ wireguard_transaction_scratch.path }}/candidate-private"
            dest: "{{ wireguard_private_key_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Install validated WireGuard public key
          copy:
            src: "{{ wireguard_transaction_scratch.path }}/candidate-public"
            dest: "{{ wireguard_public_key_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Install validated WireGuard configuration
          copy:
            src: "{{ wireguard_transaction_scratch.path }}/candidate.conf"
            dest: "{{ wireguard_config_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Ensure WireGuard service enabled and restarted
          systemd:
            name: "{{ wireguard_service_name }}"
            enabled: true
            state: restarted

        - name: Verify WireGuard service is active
          systemd:
            name: "{{ wireguard_service_name }}"
          register: wireguard_service_status

        - name: Verify WireGuard interface responds
          command: "wg show {{ wireguard_interface_name }}"
          register: wireguard_show_result
          changed_when: false

        - name: Assert WireGuard overlay is ready
          assert:
            that:
              - wireguard_service_status.status.ActiveState == "active"
              - wireguard_show_result.rc == 0
            fail_msg: "WireGuard overlay did not converge to a ready state"

        - name: Emit WireGuard structured outputs
          shell: |
            printf 'TEMPLATE_OUTPUT_JSON=%s\n' '{{ wireguard_output_payload | to_json }}'
          args:
            executable: /bin/sh
          vars:
            wireguard_output_payload:
              wireguard_public_key: "{{ wireguard_candidate_public_key.stdout | trim }}"
              wireguard_ip: "{{ wireguard_ip }}"

        - name: OPERATION_STEP wireguard:ready
          shell: |
            printf 'OPERATION_STEP={"name":"wireguard:ready","status":"completed","metadata":{"display_name":"Verify WireGuard overlay"}}\n'
          args:
            executable: /bin/sh

        - name: OPERATION_STEP wireguard:complete
          shell: |
            printf 'OPERATION_STEP={"name":"wireguard:complete","status":"completed","metadata":{"display_name":"WireGuard overlay ready"}}\n'
          args:
            executable: /bin/sh
      rescue:
        - name: Stop WireGuard service after failure
          systemd:
            name: "{{ wireguard_service_name }}"
            state: stopped
            enabled: false
          when: wireguard_activation_started | default(false)
          failed_when: false

        - name: Delete WireGuard interface after failure
          command: "ip link delete dev {{ wireguard_interface_name }}"
          when: wireguard_activation_started | default(false)
          failed_when: false
          changed_when: false

        - name: Restore existing WireGuard configuration
          copy:
            src: "{{ wireguard_transaction_scratch.path }}/config"
            dest: "{{ wireguard_config_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "{{ wireguard_config_before.mode }}"
          when: >-
            wireguard_activation_started | default(false)
            and wireguard_transaction_scratch is defined
            and wireguard_config_before is defined
            and wireguard_config_before.exists
          no_log: true

        - name: Remove newly created WireGuard configuration
          file:
            path: "{{ wireguard_config_path }}"
            state: absent
          when: >-
            wireguard_activation_started | default(false)
            and wireguard_config_before is defined
            and not wireguard_config_before.exists
          failed_when: false

        - name: Restore existing WireGuard private key
          copy:
            src: "{{ wireguard_transaction_scratch.path }}/private"
            dest: "{{ wireguard_private_key_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "{{ wireguard_private_before.mode }}"
          when: >-
            wireguard_activation_started | default(false)
            and wireguard_transaction_scratch is defined
            and wireguard_private_before is defined
            and wireguard_private_before.exists
          no_log: true

        - name: Remove newly created WireGuard private key
          file:
            path: "{{ wireguard_private_key_path }}"
            state: absent
          when: >-
            wireguard_activation_started | default(false)
            and wireguard_private_before is defined
            and not wireguard_private_before.exists
          failed_when: false

        - name: Restore existing WireGuard public key
          copy:
            src: "{{ wireguard_transaction_scratch.path }}/public"
            dest: "{{ wireguard_public_key_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "{{ wireguard_public_before.mode }}"
          when: >-
            wireguard_activation_started | default(false)
            and wireguard_transaction_scratch is defined
            and wireguard_public_before is defined
            and wireguard_public_before.exists
          no_log: true

        - name: Remove newly created WireGuard public key
          file:
            path: "{{ wireguard_public_key_path }}"
            state: absent
          when: >-
            wireguard_activation_started | default(false)
            and wireguard_public_before is defined
            and not wireguard_public_before.exists
          failed_when: false

        - name: Restore preexisting WireGuard service state
          systemd:
            name: "{{ wireguard_service_name }}"
            enabled: "{{ wireguard_service_was_enabled }}"
            state: "{{ 'started' if wireguard_service_was_running else 'stopped' }}"
          when: >-
            wireguard_activation_started | default(false)
            and wireguard_service_before is defined
            and wireguard_service_before | length > 0
          failed_when: false

        - name: OPERATION_STEP wireguard:failure
          shell: |
            printf 'OPERATION_STEP={"name":"wireguard:failure","status":"failed","metadata":{"display_name":"WireGuard overlay failed"}}\n'
          args:
            executable: /bin/sh

        - name: Fail WireGuard overlay ensure
          fail:
            msg: "WireGuard overlay ensure failed"
      always:
        - name: Remove WireGuard transaction scratch
          file:
            path: "{{ wireguard_transaction_scratch.path }}"
            state: absent
          when: wireguard_transaction_scratch is defined
          no_log: true
