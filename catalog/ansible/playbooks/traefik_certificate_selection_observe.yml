---
- name: Observe one subject's installed selection
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Read native certificate facts without mutation
      ansible.builtin.include_tasks: ../tasks/traefik_custom_certificate_observation.yml
      vars:
        certificate_probe_hosts: false

    - name: Emit plain certificate facts
      ansible.builtin.debug:
        msg: >-
          TEMPLATE_OUTPUT_JSON={{ {'certificate_observation': certificate_observation} |
            combine({'procedure_error': certificate_procedure_error} if certificate_procedure_error is not none else {}) | to_json }}

    - name: Refuse unavailable or unverified native facts
      ansible.builtin.fail:
        msg: Requested certificate serving could not be verified. Review the observed selection and connectivity.
      when: certificate_observation.outcome != 'succeeded'
