---
- name: Install the authorized subject's custom certificate
  hosts: all
  gather_facts: false
  become: true
  vars:
    certificate_source_dir: /var/run/opsctl/file-secret
    traefik_certificate_dir: /etc/traefik/certificates/opsctl
    traefik_dynamic_dir: /etc/traefik/dynamic/opsctl
  pre_tasks:
    - name: End simulation without a consumed result
      ansible.builtin.meta: end_play
      when: simulate | default(false)
  tasks:
    - name: Initialize safe custom action failure
      ansible.builtin.set_fact:
        certificate_selection_succeeded: false
        custom_certificate_error: {phase: validate, code: routing_input_invalid}

    - name: Validate and perform the admitted custom action
      block:
        - name: Validate admitted custom material identity
          ansible.builtin.assert:
            that:
              - certificate_subject.type == 'deployment'
              - material_id is match('^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$')
              - revision_id is match('^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$')
              - leaf_fingerprint_sha256 is match('^[0-9a-f]{64}$')
            fail_msg: Routing procedure inputs are invalid. Refresh the review.
          no_log: true

        - name: Select material validation failure before protected input reads
          ansible.builtin.set_fact:
            custom_certificate_error: {phase: stage, code: certificate_material_invalid}

        - name: Validate protected mounted file-secret content before delivery
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import hashlib
                import sys
                from pathlib import Path
                digest = hashlib.sha256(b'opsctl-file-secret:1\0')
                for name in ('tls.crt', 'tls.key'):
                    path = Path(sys.argv[1]) / name
                    with path.open('rb') as stream:
                        value = stream.read(262145)
                    if not value or len(value) > 262144:
                        raise SystemExit(2)
                    encoded = name.encode('ascii')
                    digest.update(len(encoded).to_bytes(2, 'big'))
                    digest.update(encoded)
                    digest.update(len(value).to_bytes(8, 'big'))
                    digest.update(value)
                if digest.hexdigest() != sys.argv[2]:
                    raise SystemExit(2)
              - "{{ certificate_source_dir }}"
              - "{{ content_digest }}"
          delegate_to: localhost
          become: false
          changed_when: false
          no_log: true

        - name: Stage validate activate and probe
          ansible.builtin.include_tasks: ../tasks/traefik_certificate_selection.yml
          vars:
            certificate_source: custom
            certificate_selection_action: publish
            certificate_chain_source: "{{ certificate_source_dir }}/tls.crt"
            certificate_key_source: "{{ certificate_source_dir }}/tls.key"
      rescue:
        - name: Observe retained selection after failed custom preparation
          ansible.builtin.include_tasks: ../tasks/traefik_custom_certificate_observation.yml
          vars:
            certificate_probe_hosts: false

        - name: Preserve original custom refusal with available facts
          ansible.builtin.set_fact:
            certificate_selection_succeeded: false
            certificate_procedure_error: "{{ custom_certificate_error }}"
            certificate_observation: "{{ certificate_observation | combine({'outcome': 'failed'}) }}"
      no_log: true

    - name: Emit actual certificate facts and any closed procedure failure
      ansible.builtin.debug:
        msg: >-
          TEMPLATE_OUTPUT_JSON={{ {'certificate_observation': certificate_observation} |
            combine({'procedure_error': certificate_procedure_error} if certificate_procedure_error is not none else {}) | to_json }}

    - name: Fail after preserving actual selection and restoration facts
      ansible.builtin.fail:
        msg: Requested certificate serving could not be verified. Review the observed selection and connectivity.
      when: not certificate_selection_succeeded or certificate_observation.outcome != 'succeeded'
