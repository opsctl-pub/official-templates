---
- name: Enroll the registered Server public SSH host key locally
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Observe the recorded SSH endpoint without a login or private key
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - "{{ lookup('ansible.builtin.file', '../../scripts/server_ssh_host_key_enroll.py', lstrip=false, rstrip=false) }}"
          - "{{ ssh_host_key_request | to_json }}"
      register: enrollment
      changed_when: false
    - name: Publish only the public observation
      ansible.builtin.debug:
        msg: "TEMPLATE_OUTPUT_JSON={{ enrollment.stdout }}"
