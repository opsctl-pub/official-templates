---
- name: Converge one same-server Traefik deployment route
  hosts: all
  gather_facts: false
  become: true
  vars:
    traefik_container_name: "traefik"
    traefik_dynamic_dir: "/etc/traefik/dynamic/opsctl"
    route_file_path: "{{ traefik_dynamic_dir }}/deployment-{{ deployment_id }}.yml"
    route_key: "deployment-{{ deployment_id }}"
    resolved_route_state: "{{ route_state }}"
    resolved_route_hosts: "{{ route_hosts }}"
    resolved_route_middlewares: "{{ route_middlewares | default([], true) }}"
    resolved_traefik_backends: "{{ traefik_backends }}"
  pre_tasks:
    - name: Skip Traefik route converge in simulate mode
      meta: end_play
      when: simulate | default(false)

    - name: Validate route configuration before mutation
      assert:
        that:
          - org_id is defined
          - org_id is string
          - (org_id | trim | length) > 0
          - deployment_id is defined
          - deployment_id is string
          - deployment_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
          - route_port is defined
          - route_port is integer
          - route_port > 0
          - route_port <= 65535
          - route_https is boolean
          - redirect_http_to_https is defined
          - redirect_http_to_https is boolean
          - (not redirect_http_to_https) or route_https
          - resolved_route_state in ['present', 'absent']
          - (route_tls_cert_resolver is not defined) or (route_tls_cert_resolver == '')
          - resolved_route_hosts is sequence
          - resolved_route_hosts is not string
          - (resolved_route_state == 'absent') or ((resolved_route_hosts | length) > 0)
          - (resolved_route_state == 'present') or ((resolved_route_hosts | length) == 0)
          - (resolved_route_hosts | length) <= 100
          - (resolved_route_hosts | unique | list | length) == (resolved_route_hosts | length)
          - resolved_route_middlewares is sequence
          - resolved_route_middlewares is not string
          - (resolved_route_middlewares | length) <= 50
          - (resolved_route_middlewares | unique | list | length) == (resolved_route_middlewares | length)
          - resolved_traefik_backends is sequence
          - resolved_traefik_backends is not string
          - (resolved_traefik_backends | length) <= 64
          - (resolved_route_state == 'absent') or ((resolved_traefik_backends | length) > 0)
          - (resolved_route_state == 'present') or ((resolved_traefik_backends | length) == 0)
          - (resolved_traefik_backends | map(attribute='url') | list | unique | list | length) == (resolved_traefik_backends | length)
        fail_msg: "Traefik route identity is missing or malformed"

    - name: Require plain route comparison snapshot
      assert:
        that:
          - expected_route is mapping
          - expected_route.keys() | sort == ['backends', 'hosts', 'https', 'middlewares', 'presence', 'redirect_http_to_https', 'route_port', 'router_name']
          - expected_route.presence in ['present', 'absent']
        fail_msg: "Traefik route comparison evidence is invalid"
      no_log: true

    - name: Validate normalized route hostnames before mutation
      assert:
        that:
          - item is string
          - item == (item | trim | lower)
          - (item | length) <= 253
          - item is match('^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)*[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')
        fail_msg: "Traefik route hosts must be normalized DNS hostnames"
      loop: "{{ resolved_route_hosts }}"
      loop_control:
        label: "route host"
      when: resolved_route_state == 'present'

    - name: Validate route middleware references before mutation
      assert:
        that:
          - item is string
          - item == (item | trim)
          - (item | length) > 0
          - (item | length) <= 255
          - item is match('^[A-Za-z0-9_.@-]+$')
        fail_msg: "Traefik middleware names are invalid"
      loop: "{{ resolved_route_middlewares }}"
      loop_control:
        label: "middleware"
      when: resolved_route_state == 'present'

    - name: Validate private Traefik backends before mutation
      assert:
        that:
          - item is mapping
          - item.keys() | list == ['url']
          - item.url is string
          - item.url is match('^http://(?:[0-9.]+|\[[0-9a-f:]+\]):[1-9][0-9]{0,4}$')
          - item.url | urlsplit('port') is integer
          - item.url | urlsplit('port') == route_port
        fail_msg: "Traefik backend identity is invalid"
      loop: "{{ resolved_traefik_backends }}"
      loop_control:
        label: "backend"
      when: resolved_route_state == 'present'

  tasks:
    - name: Read normalized deployment route before mutation
      include_tasks: "{{ playbook_dir }}/../tasks/traefik_route_observation.yml"

    - name: Reject changed deployment route before mutation
      assert:
        that:
          - route_observation_base == expected_route or (resolved_route_state == 'absent' and route_observation.presence == 'absent')
        fail_msg: "Managed Traefik route changed before configuration"
      no_log: true

    - name: OPERATION_STEP traefik-route:start
      shell: |
        printf 'OPERATION_STEP={"name":"traefik-route:start","status":"running","metadata":{"display_name":"Configure Traefik route","deployment_id":"%s","host_count":%s,"route_port":%s,"https":%s}}\n' \
          "{{ deployment_id }}" \
          "{{ resolved_route_hosts | length if resolved_route_state == 'present' else 0 }}" \
          "{{ route_port }}" \
          "{{ 'true' if route_https else 'false' }}"
      args:
        executable: /bin/sh

    - name: Converge managed Traefik route
      block:
        - name: Retain exact prior route bytes for restoration
          set_fact:
            prior_route_content: "{{ route_content.content if route_file.stat.exists else none }}"
            route_activation_attempted: false
          no_log: true

        - name: Verify watched dynamic directory exists
          stat:
            path: "{{ traefik_dynamic_dir }}"
          register: traefik_dynamic_dir_stat
          no_log: true

        - name: Reject missing watched dynamic directory
          assert:
            that:
              - traefik_dynamic_dir_stat.stat.exists
              - traefik_dynamic_dir_stat.stat.isdir
            fail_msg: "Managed Traefik route directory is unavailable"
          no_log: true

        - name: Record subject activation boundary
          set_fact:
            route_activation_attempted: true
          no_log: true

        - name: Remove exact deployment route
          file:
            path: "{{ route_file_path }}"
            state: absent
          when: resolved_route_state == 'absent'
          no_log: true

        - name: Create unique staged route file
          tempfile:
            state: file
            path: "{{ traefik_dynamic_dir }}"
            prefix: ".deployment-{{ deployment_id }}."
            suffix: ".yml"
          register: staged_route_file
          when: resolved_route_state == 'present'
          no_log: true

        - name: Stage deterministic deployment route content
          template:
            src: "{{ playbook_dir }}/../templates/traefik_deployment_route.yml.j2"
            dest: "{{ staged_route_file.path }}"
            owner: root
            group: root
            mode: "0644"
          when: resolved_route_state == 'present'
          no_log: true

        - name: Read staged deployment route
          slurp:
            path: "{{ staged_route_file.path }}"
          register: staged_route_content
          when: resolved_route_state == 'present'
          no_log: true

        - name: Parse staged deployment route
          set_fact:
            staged_route_config: "{{ staged_route_content.content | b64decode | from_yaml }}"
          when: resolved_route_state == 'present'
          no_log: true

        - name: Validate staged deployment route structure
          assert:
            that:
              - staged_route_config is mapping
              - staged_route_config.keys() | list == ['http']
              - staged_route_config.http is mapping
              - staged_route_config.http.routers is mapping
              - staged_route_config.http.services is mapping
              - ('deployment-' ~ deployment_id) in staged_route_config.http.routers
              - ('deployment-' ~ deployment_id) in staged_route_config.http.services
              - staged_route_config.http.routers['deployment-' ~ deployment_id].service == ('deployment-' ~ deployment_id)
              - staged_route_config.http.services['deployment-' ~ deployment_id].loadBalancer.servers | length == (resolved_traefik_backends | length)
              - (staged_route_config.http.services['deployment-' ~ deployment_id].loadBalancer.servers | map(attribute='url') | list) == (resolved_traefik_backends | map(attribute='url') | list)
              - (not route_https) or staged_route_config.http.routers['deployment-' ~ deployment_id].tls == {}
              - route_https or ('tls' not in staged_route_config.http.routers['deployment-' ~ deployment_id])
              - (not redirect_http_to_https) or (staged_route_config.http.keys() | sort == ['middlewares', 'routers', 'services'])
              - redirect_http_to_https or (staged_route_config.http.keys() | sort == ['routers', 'services'])
              - (not redirect_http_to_https) or (staged_route_config.http.routers.keys() | sort == [('deployment-' ~ deployment_id), ('deployment-' ~ deployment_id ~ '-http-redirect')] | sort)
              - redirect_http_to_https or (staged_route_config.http.routers.keys() | list == [('deployment-' ~ deployment_id)])
              - (not redirect_http_to_https) or (staged_route_config.http.middlewares.keys() | list == [('deployment-' ~ deployment_id ~ '-https-redirect')])
              - (not redirect_http_to_https) or (staged_route_config.http.routers['deployment-' ~ deployment_id ~ '-http-redirect'].keys() | sort == ['entryPoints', 'middlewares', 'priority', 'rule', 'service'])
              - (not redirect_http_to_https) or (staged_route_config.http.routers['deployment-' ~ deployment_id ~ '-http-redirect'].rule == staged_route_config.http.routers['deployment-' ~ deployment_id].rule)
              - (not redirect_http_to_https) or (staged_route_config.http.routers['deployment-' ~ deployment_id ~ '-http-redirect'].entryPoints == ['web'])
              - (not redirect_http_to_https) or (staged_route_config.http.routers['deployment-' ~ deployment_id ~ '-http-redirect'].priority == 1000)
              - (not redirect_http_to_https) or (staged_route_config.http.routers['deployment-' ~ deployment_id ~ '-http-redirect'].service == 'noop@internal')
              - (not redirect_http_to_https) or (staged_route_config.http.routers['deployment-' ~ deployment_id ~ '-http-redirect'].middlewares == [('deployment-' ~ deployment_id ~ '-https-redirect')])
              - "(not redirect_http_to_https) or (staged_route_config.http.middlewares['deployment-' ~ deployment_id ~ '-https-redirect'] == {'redirectScheme': {'scheme': 'https', 'permanent': true}})"
            fail_msg: "Rendered Traefik route is malformed"
          when: resolved_route_state == 'present'
          no_log: true

        - name: Atomically activate deployment route
          command:
            argv:
              - mv
              - --
              - "{{ staged_route_file.path }}"
              - "{{ route_file_path }}"
          when: resolved_route_state == 'present'
          no_log: true

        - name: Observe activated subject route
          include_tasks: "{{ playbook_dir }}/../tasks/traefik_route_observation.yml"

        - name: Require actual desired native route
          assert:
            that:
              - route_observation.outcome == 'succeeded'
              - route_observation.presence == resolved_route_state
              - route_observation.hosts == (resolved_route_hosts | sort)
              - route_observation.backends == (resolved_traefik_backends | map(attribute='url') | list)
              - resolved_route_state == 'absent' or route_observation.route_port == route_port
              - resolved_route_state == 'absent' or route_observation.https == route_https
              - resolved_route_state == 'absent' or route_observation.redirect_http_to_https == redirect_http_to_https
              - resolved_route_state == 'absent' or route_observation.middlewares == resolved_route_middlewares
            fail_msg: "Activated route could not be verified"
          no_log: true

        - name: Emit actual activated route facts
          debug:
            msg: "TEMPLATE_OUTPUT_JSON={{ {'deployment_route_observation': route_observation} | to_json }}"

        - name: OPERATION_STEP traefik-route:complete
          shell: |
            printf 'OPERATION_STEP={"name":"traefik-route:complete","status":"completed","metadata":{"display_name":"Traefik route ready","deployment_id":"%s","host_count":%s,"route_port":%s,"https":%s}}\n' \
              "{{ deployment_id }}" \
              "{{ resolved_route_hosts | length if resolved_route_state == 'present' else 0 }}" \
              "{{ route_port }}" \
              "{{ 'true' if route_https else 'false' }}"
          args:
            executable: /bin/sh
      rescue:
        - name: Restore exact previous route selection
          block:
            - name: Restore prior route atomically
              copy:
                content: "{{ prior_route_content | b64decode }}"
                dest: "{{ route_file_path }}"
                owner: root
                group: root
                mode: "0644"
              when: prior_route_content is not none
              no_log: true

            - name: Restore prior route absence
              file:
                path: "{{ route_file_path }}"
                state: absent
              when: prior_route_content is none
              no_log: true

            - name: Observe restored route
              include_tasks: "{{ playbook_dir }}/../tasks/traefik_route_observation.yml"

            - name: Require exact restored snapshot
              assert:
                that:
                  - route_observation_base == expected_route
                fail_msg: "Previous route could not be restored"
              no_log: true

            - name: Emit restored facts with safe failure
              debug:
                msg: "TEMPLATE_OUTPUT_JSON={{ {'deployment_route_observation': route_observation, 'procedure_error': {'phase': 'apply', 'code': 'route_apply_failed'}} | to_json }}"
          rescue:
            - name: Emit incomplete restoration
              debug:
                msg: "TEMPLATE_OUTPUT_JSON={{ {'procedure_error': {'phase': 'restore', 'code': 'restoration_failed'}} | to_json }}"
          when: route_activation_attempted | default(false)

        - name: Remove incomplete staged route
          file:
            path: "{{ staged_route_file.path }}"
            state: absent
          when:
            - staged_route_file is defined
            - staged_route_file.path is defined
          no_log: true

        - name: OPERATION_STEP traefik-route:failure
          shell: |
            printf 'OPERATION_STEP={"name":"traefik-route:failure","status":"failed","metadata":{"display_name":"Traefik route failed","deployment_id":"%s"}}\n' "{{ deployment_id }}"
          args:
            executable: /bin/sh

        - name: Fail Traefik route converge
          fail:
            msg: "Traefik route converge failed"
