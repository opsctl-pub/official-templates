---
- name: Synchronize managed DNS records through Cloudflare
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    dns_changes: "{{ dns_changes | default([]) }}"
    cloudflare_api_base: "https://api.cloudflare.com/client/v4"
  pre_tasks:
    - name: Skip DNS sync when running in simulate mode
      meta: end_play
      when: simulate | default(false)

  tasks:
    - name: Apply managed DNS record changes
      block:
        - name: Report DNS synchronization started
          shell: |
            printf 'OPERATION_STEP={"name":"dns_sync:start","status":"running","metadata":{"display_name":"Sync DNS records","provider":"%s","zone_name":"%s","change_count":%s}}\n' "{{ provider }}" "{{ zone_name }}" "{{ dns_changes | length }}"
          args:
            executable: /bin/sh

        - name: Check Cloudflare credentials and zone
          assert:
            that:
              - provider == "cloudflare"
              - (lookup('env', 'CLOUDFLARE_API_TOKEN') | length) > 0
              - provider_zone_id is defined
              - (provider_zone_id | string | length) > 0
            fail_msg: "dns_records_sync requires Cloudflare credentials and provider_zone_id"

        - name: Validate managed A record changeset shape
          assert:
            that:
              - (item.action | string) in ["create", "update", "delete", "adopt"]
              - >-
                item.action != 'delete'
                or (item.tracked_record_id | default(none)) is none
                or (compare_before_apply | default(false)) is sameas true
              - (item.record_type | string | upper) == "A"
              - item.proxied is boolean
              - not item.proxied or item.ttl == 1
            fail_msg: "Managed Cloudflare A records require explicit proxy intent and automatic TTL when proxied"
          loop: "{{ dns_changes }}"
          loop_control:
            label: "{{ item.hostname }}:{{ item.action }}"

        - name: Validate exact DNS adoption identity shape
          assert:
            that:
              - >-
                (item.action | string) != 'adopt'
                or (
                  item.provider_record_id is defined
                  and (item.provider_record_id | string | length) > 0
                  and item.deployment_id is defined
                  and (item.deployment_id | string | length) > 0
                  and item.tracked_record_id is defined
                  and item.tracked_record_id is none
                  and (item.record_type | string | upper) == 'A'
                  and not (item.proxied | default(false) | bool)
                )
            fail_msg: "DNS adoption plan identity is invalid"
          loop: "{{ dns_changes }}"
          loop_control:
            label: "{{ item.hostname }}:{{ item.action }}"

        - name: Validate tracked DNS delete scope before looping
          assert:
            that:
              - dns_delete_scope in ['retirement_tracked_delete', 'tenant_tracked_delete']
              - compare_before_apply | default(false) is sameas true
              - >-
                dns_delete_scope != 'tenant_tracked_delete'
                or (dns_changes is sequence and dns_changes is not mapping and dns_changes is not string
                    and (dns_changes | length) > 0)
            fail_msg: "Tracked DNS delete scope or changeset is invalid"
          when: dns_delete_scope is defined

        - name: Validate confirmed DNS delete shape
          assert:
            that:
              - (compare_before_apply | default(false)) is boolean
              - >-
                dns_delete_scope is not defined
                or (dns_delete_scope in ['retirement_tracked_delete', 'tenant_tracked_delete']
                    and compare_before_apply is sameas true)
              - >-
                not (compare_before_apply | default(false) | bool)
                or (
                  (item.action | string) == 'delete'
                  and (item.record_type | string | upper) == 'A'
                  and (item.provider_record_id is defined)
                  and ((item.provider_record_id | string | length) > 0)
                  and (
                    (dns_delete_scope is not defined
                     and (item.tracked_record_id is not defined or item.tracked_record_id is none)
                     and item.proxied is sameas false)
                    or
                    (dns_delete_scope | default('') in ['retirement_tracked_delete', 'tenant_tracked_delete']
                     and item.tracked_record_id is string
                     and item.tracked_record_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
                     and item.deployment_id is string
                     and item.deployment_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
                     and item.ttl is integer and item.ttl > 0)
                  )
                )
              - >-
                dns_delete_scope | default('') != 'tenant_tracked_delete'
                or (
                  item.tracked_record_id == (item.tracked_record_id | trim)
                  and item.deployment_id == (item.deployment_id | trim)
                  and item.provider_record_id is string
                  and item.provider_record_id == (item.provider_record_id | trim)
                  and item.provider_record_id is match('^[A-Za-z0-9_-]+$')
                  and item.hostname is string and item.hostname == (item.hostname | trim)
                  and item.hostname is match('^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$')
                  and item.value is string and item.value == (item.value | trim)
                  and item.value is match('^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$')
                )
            fail_msg: "Confirmed DNS delete plan is invalid"
          loop: "{{ dns_changes }}"
          loop_control:
            label: "{{ item.hostname }}:{{ item.action }}"
          when: compare_before_apply | default(false) | bool or dns_delete_scope is defined

        - name: Initialize applied changes accumulator
          set_fact:
            dns_sync_applied_changes: []
            dns_sync_authorization_denied: false

        - name: Apply and record Cloudflare managed DNS changes in order
          include_tasks: ../../tasks/dns_records_sync_change.yml
          loop: "{{ dns_changes }}"
          loop_control:
            loop_var: dns_change
            label: "{{ dns_change.hostname }}:{{ dns_change.action }}"

        - name: Emit final structured DNS sync outputs
          debug:
            msg: >-
              TEMPLATE_OUTPUT_JSON={{ {'applied_changes': dns_sync_applied_changes} | to_json }}

        - name: Report DNS synchronization completed
          shell: |
            printf 'OPERATION_STEP={"name":"dns_sync:complete","status":"completed","metadata":{"display_name":"DNS records synced","provider":"%s","zone_name":"%s","applied_count":%s}}\n' "{{ provider }}" "{{ zone_name }}" "{{ dns_sync_applied_changes | length }}"
          args:
            executable: /bin/sh
      rescue:
        - name: Emit partial structured DNS sync outputs after failure
          debug:
            msg: >-
              TEMPLATE_OUTPUT_JSON={{ ({'applied_changes': dns_sync_applied_changes | default([])} | combine({'authorization_denied': true} if dns_sync_authorization_denied | default(false) | bool else {})) | to_json }}

        - name: Report DNS synchronization failed
          shell: |
            printf 'OPERATION_STEP={"name":"dns_sync:failure","status":"failed","metadata":{"display_name":"DNS sync failed","provider":"%s","zone_name":"%s","applied_count":%s}}\n' "{{ provider }}" "{{ zone_name }}" "{{ (dns_sync_applied_changes | default([])) | length }}"
          args:
            executable: /bin/sh

        - name: Fail DNS sync operation
          fail:
            msg: "Managed DNS sync failed"
