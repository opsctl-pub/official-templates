---
- name: Deploy container to target server
  hosts: all
  gather_facts: false
  become: true
  vars:
    container_name: "{{ app_container_name | default('app') }}"
    router_name: "{{ app_router_name | default(app_container_name | default('app')) }}"
    health_path: "{{ app_health_path | default('/health') }}"
    host_health_port: "{{ app_health_port | default((app_ports | default([]) | first) | default(none)) }}"
    managed_image_resources: "{{ app_previous_container_id is defined or (app_mounts | default([]) | length > 0) or (app_networks | default([]) | length > 0) or (app_observe_volumes | default([]) | length > 0) or (app_observe_networks | default([]) | length > 0) }}"
    exposure_mode: "{{ backend_exposure_mode | default('host') }}"
    loopback_backend_enabled: "{{ exposure_mode == 'loopback' }}"
    source_dual_backend_enabled: "{{ exposure_mode == 'loopback_wireguard' }}"
    traefik_enabled: "{{ (app_traefik_enabled | default(false) | bool) and not loopback_backend_enabled }}"
    traefik_hosts: "{{ app_traefik_hosts | default(([app_traefik_host] if (app_traefik_host is defined and (app_traefik_host | string | length) > 0) else []), true) }}"
    traefik_rule: >-
      {{ traefik_hosts | map('regex_replace', '^(.*)$', 'Host(`\1`)') | join(' || ') }}
    wireguard_backend_enabled: "{{ exposure_mode == 'wireguard' }}"
    backend_wireguard_ip: "{{ wireguard_ip | default('') }}"
    backend_route_port: "{{ route_port | default(None, true) }}"
    backend_container_port: "{{ container_port | default(None, true) }}"
    effective_backend_container_port: "{{ backend_container_port if backend_container_port is not none else ((app_container_ports[0]) if (app_container_ports is defined and (app_container_ports | length > 0)) else backend_route_port) }}"
    # IMPORTANT: Variables used in task conditionals MUST use single-line Jinja2 expressions.
    # NEVER use YAML folding (>-) with if/elif/else blocks for variables used in when: conditions.
    # Reason: YAML folding injects whitespace that breaks string comparisons (e.g., " host " != "host").
    # Fixed 2025-10-29: effective_health_mode and health_check_target converted to single-line ternaries.
    health_mode: "{{ app_health_mode | default('auto') }}"
    effective_health_mode: "{{ 'container' if (traefik_enabled and health_mode == 'auto') else ('traefik' if (health_mode == 'traefik' and traefik_enabled) else health_mode) }}"
    container_health_port: "{{ app_health_container_port | default(None, true) }}"
    health_container_path: "{{ app_health_container_path | default(health_path) }}"
    health_url_local: "http://127.0.0.1:{{ host_health_port }}{{ health_path }}"
    health_check_target: "{{ ('http://127.0.0.1:' ~ host_health_port ~ health_path) if effective_health_mode == 'host' else (('container://' ~ container_name ~ health_container_path) if effective_health_mode in ['container', 'traefik'] else '') }}"
    published_ports: []
    host_port_preflight_enabled: "{{ not managed_image_resources and ((not wireguard_backend_enabled and not traefik_enabled) or source_dual_backend_enabled) }}"
    traefik_middlewares: "{{ app_traefik_middlewares | default([]) }}"
    traefik_label_map: {}
    opsctl_label_map:
      "com.opsctl.managed": "true"
      "com.opsctl.org_id": "{{ app_org_id }}"
      "com.opsctl.project_id": "{{ app_project_id | default('', true) }}"
      "com.opsctl.app": "{{ app_slug | default(container_name) }}"
      "com.opsctl.deployment_id": "{{ app_deployment_id }}"
    final_label_map: "{{ opsctl_label_map }}"
    deploy_host_ports: []
    health_strategy: "running"
    source_replacement_removed: false
    source_replacement_recheck_complete: false
    source_replacement_recheck_failed: false
    source_replacement_original: {}
    source_replacement_restore_script: |
      python3 - <<'PY'
      import json
      import subprocess
      import base64
      import sys

      original = json.loads(r'''{{ source_replacement_original | to_json }}''')
      expected = json.loads(r'''{{ source_replacement | to_json }}''')
      name = original["name"]
      config = original.get("config") or {}
      host_config = original.get("host_config") or {}

      subprocess.run(["docker", "rm", "-f", name], capture_output=True, text=True)

      create = ["docker", "create", "--name", name]
      restart_policy = host_config.get("RestartPolicy") or {}
      restart_name = restart_policy.get("Name")
      if restart_name and restart_name != "no":
          create.extend(["--restart", restart_name])
      network_mode = host_config.get("NetworkMode")
      if network_mode and network_mode != "default":
          create.extend(["--network", network_mode])
      working_dir = config.get("WorkingDir")
      if working_dir:
          create.extend(["--workdir", working_dir])
      user = config.get("User")
      if user:
          create.extend(["--user", user])
      entrypoint = config.get("Entrypoint") or []
      if entrypoint:
          create.extend(["--entrypoint", entrypoint[0]])
      for env_value in config.get("Env") or []:
          if isinstance(env_value, str):
              create.extend(["--env", env_value])
      for label_key, label_value in sorted((config.get("Labels") or {}).items()):
          create.extend(["--label", f"{label_key}={label_value}"])
      for bind in host_config.get("Binds") or []:
          if isinstance(bind, str):
              create.extend(["--volume", bind])
      for container_key, bindings in (host_config.get("PortBindings") or {}).items():
          if not isinstance(bindings, list):
              continue
          container_port, protocol = container_key.split("/", 1)
          for binding in bindings:
              if not isinstance(binding, dict):
                  continue
              host_ip = str(binding.get("HostIp") or "")
              host_port = str(binding.get("HostPort") or "")
              if ":" in host_ip and not host_ip.startswith("["):
                  host_ip = f"[{host_ip}]"
              published = f"{host_ip}:{host_port}:{container_port}/{protocol}" if host_ip else f"{host_port}:{container_port}/{protocol}"
              create.extend(["--publish", published])

      image = config.get("Image")
      if not isinstance(image, str) or not image:
          raise SystemExit("source_replacement_restore_image_invalid")
      create.append(image)
      command = config.get("Cmd")
      if isinstance(command, list):
          create.extend(str(item) for item in command)
      elif isinstance(command, str) and command:
          create.append(command)
      subprocess.run(create, check=True, capture_output=True, text=True)
      subprocess.run(["docker", "start", name], check=True, capture_output=True, text=True)

      inspected = subprocess.run(
          ["docker", "inspect", name], check=True, capture_output=True, text=True
      )
      current = json.loads(inspected.stdout)[0]
      current_config = current.get("Config") or {}
      current_host_config = current.get("HostConfig") or {}
      for key in ("Image", "Cmd", "Entrypoint", "Env", "WorkingDir", "User", "Labels", "ExposedPorts", "Volumes"):
          if current_config.get(key) != config.get(key):
              raise SystemExit("source_replacement_restore_config_mismatch")
      if (current_host_config.get("PortBindings") or {}) != (host_config.get("PortBindings") or {}):
          raise SystemExit("source_replacement_restore_bindings_mismatch")
      if (current_host_config.get("Binds") or []) != (host_config.get("Binds") or []):
          raise SystemExit("source_replacement_restore_mounts_mismatch")
      if not (current.get("State") or {}).get("Running"):
          raise SystemExit("source_replacement_restore_not_running")

      health_path = {{ app_health_container_path | default('/health') | to_json }}
      health_port = expected.get("container_port")
      health = subprocess.run(
          [
              sys.executable, "-c",
              base64.b64decode({{ lookup('file', playbook_dir + '/../scripts/container_http_health.py') | b64encode | to_json }}).decode(),
              "--container", name,
              "--organization", str((config.get("Labels") or {}).get("com.opsctl.org_id") or ""),
              "--deployment", str((config.get("Labels") or {}).get("com.opsctl.deployment_id") or ""),
              "--revision", str((config.get("Labels") or {}).get("com.opsctl.revision_id") or ""),
              "--port", str(health_port), "--path", health_path,
          ],
          stdout=subprocess.DEVNULL,
          stderr=subprocess.DEVNULL,
          timeout=35,
      )
      if health.returncode != 0:
          raise SystemExit("source_replacement_restore_health_failed")
      PY
  pre_tasks:
    - name: Validate managed runtime identity before mutation
      assert:
        that:
          - app_managed is defined
          - app_managed is boolean
          - app_managed
          - app_org_id is defined
          - app_org_id is string
          - app_org_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
          - app_deployment_id is defined
          - app_deployment_id is string
          - app_deployment_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
        fail_msg: "Managed deployment requires canonical organization and Deployment identity"

    - name: Validate backend exposure mode before mutation
      assert:
        that:
          - exposure_mode in ['host', 'wireguard', 'loopback', 'loopback_wireguard']
        fail_msg: "backend_exposure_mode must be host, wireguard, loopback, or loopback_wireguard"

    - name: Validate loopback backend mapping before mutation
      assert:
        that:
          - backend_route_port is not none
          - backend_container_port is not none
          - (backend_route_port | int) > 0
          - (backend_route_port | int) <= 65535
          - (backend_container_port | int) > 0
          - (backend_container_port | int) <= 65535
        fail_msg: "route_port and container_port are required for backend_exposure_mode=loopback"
      when: loopback_backend_enabled or source_dual_backend_enabled

    - name: Validate native managed image inputs without legacy replacement
      ansible.builtin.assert:
        that:
          - source_replacement is not defined
          - not (replace_conflicts | default(false) | bool)
          - app_previous_container_id | default(none) is none or app_previous_container_id is match('^[0-9a-f]{64}$')
          - app_memory_bytes | default(none) is none or (app_memory_bytes is integer and app_memory_bytes > 0)
          - app_health_exec | default(none) is none or (app_health_exec is sequence and app_health_exec is not string and app_health_exec | length > 0 and app_health_exec | length <= 128)
          - app_mounts | default([]) | length <= 128
          - app_networks | default([]) | length <= 64
        fail_msg: Native managed image inputs are invalid.
      when: managed_image_resources
      no_log: true
  tasks:
    - name: Ensure container health port derived when missing
      set_fact:
        container_health_port: "{{ app_container_ports[0] }}"
      when:
        - container_health_port is none
        - app_container_ports is defined
        - (app_container_ports | length) > 0

    - name: Validate WireGuard backend exposure inputs
      assert:
        that:
          - backend_wireguard_ip | string | length > 0
          - backend_route_port is not none
          - effective_backend_container_port is not none
        fail_msg: "wireguard_ip, route_port, and container_port are required for backend_exposure_mode=wireguard"
      when: wireguard_backend_enabled

    - name: Validate combined source backend exposure inputs
      assert:
        that:
          - source_dual_backend_enabled
          - backend_wireguard_ip | string | length > 0
          - backend_route_port is not none
          - effective_backend_container_port is not none
        fail_msg: "loopback_wireguard exposure requires WireGuard IP, route port, and container port"
      when: source_dual_backend_enabled

    - name: Derive published ports for combined source backend exposure
      set_fact:
        published_ports:
          - "127.0.0.1:{{ backend_route_port }}:{{ backend_container_port }}"
          - "{{ backend_wireguard_ip }}:{{ backend_route_port }}:{{ effective_backend_container_port }}"
      when: source_dual_backend_enabled

    - name: Derive published ports for WireGuard backend exposure
      set_fact:
        published_ports:
          - "{{ backend_wireguard_ip }}:{{ backend_route_port }}:{{ effective_backend_container_port }}"
      when:
        - wireguard_backend_enabled
        - not source_dual_backend_enabled

    - name: Derive published port for loopback backend exposure
      set_fact:
        published_ports:
          - "127.0.0.1:{{ backend_route_port }}:{{ backend_container_port }}"
      when: loopback_backend_enabled

    - name: Derive published ports for Traefik-routed deploy
      set_fact:
        published_ports: []
      when:
        - not wireguard_backend_enabled
        - not loopback_backend_enabled
        - not source_dual_backend_enabled
        - traefik_enabled

    - name: Derive published ports for direct host exposure
      set_fact:
        published_ports: >-
          {{
            (app_ports | zip(app_container_ports) | map('join', ':') | list)
            if (app_container_ports is defined and (app_container_ports | length > 0))
            else (app_ports | zip(app_ports) | map('join', ':') | list)
          }}
      when:
        - not wireguard_backend_enabled
        - not loopback_backend_enabled
        - not source_dual_backend_enabled
        - not traefik_enabled

    - name: OPERATION_STEP start
      shell: |
        printf 'OPERATION_STEP={"name":"deploy:start","status":"running","metadata":{"display_name":"Deploy container","phase":"init"}}\n'
      args:
        executable: /bin/sh

    - name: OPERATION_STEP docker:install
      shell: |
        printf 'OPERATION_STEP={"name":"docker:install","status":"running","metadata":{"display_name":"Install Docker"}}\n'
      args:
        executable: /bin/sh

    - name: Install Docker packages (docker.io)
      apt:
        name:
          - docker.io
        state: present
        update_cache: true

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: true

    - name: OPERATION_STEP docker:ready
      shell: |
        printf 'OPERATION_STEP={"name":"docker:install","status":"completed","metadata":{"display_name":"Install Docker"}}\n'
      args:
        executable: /bin/sh

    - name: Capture host ports for baseline preflight
      set_fact:
        deploy_host_ports: >-
          {{
            [backend_route_port]
            if (loopback_backend_enabled or source_dual_backend_enabled)
            else (published_ports | map('regex_search', '^[^:]+') | list)
          }}
      when:
        - host_port_preflight_enabled
        - (published_ports | length) > 0

    - name: Observe existing managed image backing before replacement
      ansible.builtin.include_tasks:
        file: ../tasks/container_observe.yml
        apply:
          no_log: true
      vars:
        image_runtime_action: inspect
      when: managed_image_resources

    - name: Require exact predecessor or complete missing-runtime qualification
      ansible.builtin.assert:
        that:
          - image_runtime.observation_complete
          - >-
            (image_runtime.container is none and
             (app_previous_container_id | default(none) is none or image_runtime.previous_container_absent)) or
            (image_runtime.container is not none and app_previous_container_id | default(none) is not none and
             image_runtime.container.id == app_previous_container_id)
          - image_runtime.volumes | rejectattr('presence', 'equalto', 'present') | list | length == 0
          - image_runtime.networks | rejectattr('presence', 'equalto', 'present') | list | length == 0
        fail_msg: Managed runtime or native backing changed. Refresh its observation before deployment.
      when: managed_image_resources
      no_log: true

    - name: Require every mount to name an observed native volume
      ansible.builtin.assert:
        that:
          - managed_mount.source in (image_runtime.volumes | map(attribute='name') | list)
          - managed_mount.target is string and managed_mount.target.startswith('/')
          - managed_mount.read_only is boolean
          - >-
            managed_mount.read_only or
            (image_runtime.volumes | selectattr('name', 'equalto', managed_mount.source) | first).users |
            rejectattr('id', 'equalto', app_previous_container_id | default('')) |
            selectattr('state', 'equalto', 'running') | selectattr('read_only', 'equalto', false) | list | length == 0
        fail_msg: Managed volume is unavailable or has another running writer.
      loop: "{{ app_mounts | default([]) }}"
      loop_control:
        loop_var: managed_mount
        label: managed mount
      when: managed_image_resources
      no_log: true

    - name: Require every requested network to match an observed native identity
      ansible.builtin.assert:
        that:
          - >-
            image_runtime.networks | selectattr('id', 'equalto', managed_network.id) |
            selectattr('name', 'equalto', managed_network.name) | list | length == 1
          - managed_network.aliases | default([]) is sequence and managed_network.aliases | default([]) is not string
          - managed_network.aliases | default([]) | length <= 128
        fail_msg: Managed network is unavailable or changed.
      loop: "{{ app_networks | default([]) }}"
      loop_control:
        loop_var: managed_network
        label: managed network
      when: managed_image_resources
      no_log: true

    - name: Map only qualified native mounts and networks
      ansible.builtin.set_fact:
        image_native_mounts: >-
          {% set mounts = namespace(values=[]) %}
          {% for mount in app_mounts | default([]) %}
          {% set mounts.values = mounts.values + [{'type': 'volume', 'source': mount.source,
            'target': mount.target, 'read_only': mount.read_only}] %}
          {% endfor %}
          {{ mounts.values }}
        image_native_networks: >-
          {% set networks = namespace(values=[]) %}
          {% for network in app_networks | default([]) %}
          {% set networks.values = networks.values + [{'name': network.name, 'aliases': network.aliases | default([])}] %}
          {% endfor %}
          {{ networks.values }}
      no_log: true

    - name: OPERATION_STEP preflight:ports start
      shell: |
        printf 'OPERATION_STEP={"name":"preflight:ports","status":"running","metadata":{"display_name":"Check ports","ports":%s}}\n' '{{ deploy_host_ports | default([]) | to_json }}'
      args:
        executable: /bin/sh
      when:
        - host_port_preflight_enabled
        - (deploy_host_ports | length) > 0

    - name: Detect host port conflicts
      shell: |
        python3 - <<'PY'
        import json, subprocess, sys

        ports = json.loads('''{{ deploy_host_ports | default([]) | to_json }}''')
        target_container = {{ container_name | to_json }}
        target_org = {{ app_org_id | default('') | to_json }}
        target_project = {{ app_project_id | default('') | to_json }}
        target_app = {{ app_slug | default(container_name) | to_json }}
        source_replacement = json.loads('''{{ source_replacement | default(None) | to_json }}''')
        require_project = bool(target_project)
        if not ports:
            print("[]")
            sys.exit(0)

        result = subprocess.run(
            ["docker", "ps", "--format", "{{ '{{json .}}' }}"],
            capture_output=True,
            text=True,
        )
        if result.returncode != 0:
            sys.stderr.write(result.stderr)
            sys.exit(result.returncode)

        seen = {}
        for line in result.stdout.splitlines():
            line = line.strip()
            if not line:
                continue
            try:
                data = json.loads(line)
            except json.JSONDecodeError:
                continue
            ports_field = data.get("Ports") or ""
            matches = sorted({port for port in ports if f":{port}->" in ports_field})
            if not matches:
                continue
            name = data.get("Names") or data.get("ID")
            if not name:
                continue
            if name == target_container and not source_replacement:
                inspect_result = subprocess.run(
                    ["docker", "inspect", target_container],
                    capture_output=True,
                    text=True,
                )
                if inspect_result.returncode == 0:
                    try:
                        inspect_payload = json.loads(inspect_result.stdout)
                    except json.JSONDecodeError:
                        inspect_payload = []
                    inspect_item = inspect_payload[0] if inspect_payload else {}
                    labels = ((inspect_item.get("Config") or {}).get("Labels") or {})
                    owned = (
                        labels.get("com.opsctl.managed") == "true"
                        and labels.get("com.opsctl.org_id") == target_org
                        and labels.get("com.opsctl.app") == target_app
                        and ((not require_project) or labels.get("com.opsctl.project_id") == target_project)
                    )
                    if owned:
                        continue
            seen.setdefault(name, set()).update(matches)

        conflicts = [
            {"name": name, "ports": sorted(list(values))}
            for name, values in seen.items()
        ]
        print(json.dumps(conflicts))
        PY
      args:
        executable: /bin/bash
      register: port_conflicts_result
      changed_when: false
      failed_when: port_conflicts_result.rc != 0
      when:
        - host_port_preflight_enabled
        - (deploy_host_ports | length) > 0

    - name: Parse port conflict results
      set_fact:
        port_conflict_entries: "{{ port_conflicts_result.stdout | default('[]') | from_json }}"
      when:
        - host_port_preflight_enabled
        - (deploy_host_ports | length) > 0

    - name: Initialize post-conflict list
      set_fact:
        port_conflict_entries_post: "{{ [] if (source_replacement is defined) else (port_conflict_entries | default([])) }}"
      when:
        - host_port_preflight_enabled
        - (deploy_host_ports | length) > 0

    - name: Record conflicting container names
      set_fact:
        port_conflict_names: "{{ port_conflict_entries | map(attribute='name') | list }}"
      when:
        - host_port_preflight_enabled
        - (deploy_host_ports | length) > 0

    - name: Fail on port conflicts without override
      block:
        - name: OPERATION_STEP preflight:ports failed
          shell: |
            printf 'OPERATION_STEP={"name":"preflight:ports","status":"failed","metadata":{"display_name":"Check ports","ports":%s,"conflicts":%s}}\n' '{{ deploy_host_ports | default([]) | to_json }}' '{{ port_conflict_names | default([]) | to_json }}'
          args:
            executable: /bin/sh
        - name: Abort due to port conflict
          fail:
            msg: "port_conflict"
      when:
        - host_port_preflight_enabled
        - (port_conflict_entries | length) > 0
        - (
            source_replacement is not defined
            or not (replace_conflicts | default(false) | bool)
          )
        - (
            loopback_backend_enabled
            or source_dual_backend_enabled
            or not (replace_conflicts | default(false) | bool)
          )

    - name: Determine removable conflict containers
      shell: |
        python3 - <<'PY'
        import json, subprocess, sys

        conflicts = json.loads('''{{ port_conflict_entries | default([]) | to_json }}''')
        target_org = {{ app_org_id | default('') | to_json }}
        project_id = {{ app_project_id | default('') | to_json }}
        require_project = bool(project_id)

        names = [item.get("name") for item in conflicts if item.get("name")]
        if not names:
            print("[]")
            sys.exit(0)

        result = subprocess.run(["docker", "inspect"] + names, capture_output=True, text=True)
        if result.returncode != 0:
            sys.stderr.write(result.stderr)
            sys.exit(result.returncode)

        try:
            data = json.loads(result.stdout)
        except json.JSONDecodeError:
            print("[]")
            sys.exit(0)

        removable = []
        for item in data:
            labels = item.get("Config", {}).get("Labels") or {}
            if labels.get("com.opsctl.managed") != "true":
                continue
            if labels.get("com.opsctl.org_id") != target_org:
                continue
            if require_project and labels.get("com.opsctl.project_id") != project_id:
                continue
            name = item.get("Name", "").lstrip("/")
            if name:
                removable.append(name)

        print(json.dumps(sorted(removable)))
        PY
      args:
        executable: /bin/bash
      register: removable_conflicts
      changed_when: false
      failed_when: removable_conflicts.rc != 0
      when:
        - host_port_preflight_enabled
        - (port_conflict_entries | length) > 0
        - replace_conflicts | default(false) | bool
        - source_replacement is not defined

    - name: Parse removable container list
      set_fact:
        removable_containers: "{{ removable_conflicts.stdout | default('[]') | from_json }}"
      when:
        - host_port_preflight_enabled
        - (port_conflict_entries | length) > 0
        - replace_conflicts | default(false) | bool
        - source_replacement is not defined

    - name: Validate exact source replacement container
      shell: |
        python3 - <<'PY'
        import json, subprocess, sys
        from uuid import UUID

        conflicts = json.loads('''{{ port_conflict_entries | default([]) | to_json }}''')
        expected = json.loads('''{{ source_replacement | default(None) | to_json }}''')
        required = {
            "intent", "container_name", "app_slug", "org_id", "project_id",
            "deployment_id", "image", "current_exposure_modes", "exposure_mode", "wireguard_ip",
            "route_port", "container_port", "replace_conflicts",
        }
        if not isinstance(expected, dict) or set(expected) != required:
            raise SystemExit("source_replacement_identity_invalid")
        if expected["intent"] != "replace_exact_source_container":
            raise SystemExit("source_replacement_intent_invalid")
        if expected["replace_conflicts"] is not True:
            raise SystemExit("source_replacement_flag_invalid")
        for key in ("org_id", "deployment_id"):
            try:
                if str(UUID(str(expected[key]))) != expected[key]:
                    raise ValueError
            except (TypeError, ValueError):
                raise SystemExit("source_replacement_identity_invalid")
        project_id = expected["project_id"]
        if project_id is not None:
            try:
                if str(UUID(str(project_id))) != project_id:
                    raise ValueError
            except (TypeError, ValueError):
                raise SystemExit("source_replacement_identity_invalid")
        if len(conflicts) != 1 or conflicts[0].get("name") != expected["container_name"]:
            raise SystemExit("source_replacement_conflict_set_invalid")
        name = expected["container_name"]
        result = subprocess.run(["docker", "inspect", name], capture_output=True, text=True)
        if result.returncode != 0:
            sys.stderr.write(result.stderr)
            sys.exit(result.returncode)
        try:
            data = json.loads(result.stdout)
            item = data[0]
        except (json.JSONDecodeError, IndexError, TypeError):
            raise SystemExit("source_replacement_inspect_invalid")
        config = item.get("Config") or {}
        labels = config.get("Labels") or {}
        if labels.get("com.opsctl.managed") != "true":
            raise SystemExit("source_replacement_not_opsctl_owned")
        deployment_label = labels.get("com.opsctl.deployment_id")
        if deployment_label in (None, ""):
            deployment_label = None
        if deployment_label is not None and deployment_label != expected["deployment_id"]:
            raise SystemExit("source_replacement_deployment_mismatch")
        for key, expected_value in {
            "com.opsctl.org_id": expected["org_id"],
            "com.opsctl.app": expected["app_slug"],
        }.items():
            if labels.get(key) != expected_value:
                raise SystemExit("source_replacement_identity_mismatch")
        if deployment_label != expected["deployment_id"]:
            actual_project = labels.get("com.opsctl.project_id")
            if actual_project in (None, ""):
                actual_project = None
            if actual_project != expected["project_id"]:
                raise SystemExit("source_replacement_identity_mismatch")
        if config.get("Image") != expected["image"]:
            raise SystemExit("source_replacement_image_mismatch")
        if expected["current_exposure_modes"] != ["loopback", "loopback_wireguard"]:
            raise SystemExit("source_replacement_current_exposure_modes_invalid")
        if expected["exposure_mode"] != "loopback_wireguard":
            raise SystemExit("source_replacement_exposure_invalid")
        route_port = expected["route_port"]
        container_port = expected["container_port"]
        loopback_binding = f"127.0.0.1:{route_port}:{container_port}"
        wireguard_binding = f"{expected['wireguard_ip']}:{route_port}:{container_port}"
        expected_binding_sets = {
            frozenset({loopback_binding}),
            frozenset({loopback_binding, wireguard_binding}),
        }
        actual_bindings = set()
        ports = ((item.get("NetworkSettings") or {}).get("Ports") or {})
        if not isinstance(ports, dict):
            raise SystemExit("source_replacement_bindings_invalid")
        for container_key, bindings in ports.items():
            if container_key != f"{container_port}/tcp":
                raise SystemExit("source_replacement_bindings_invalid")
            if not isinstance(bindings, list):
                raise SystemExit("source_replacement_bindings_invalid")
            for binding in bindings:
                if not isinstance(binding, dict):
                    raise SystemExit("source_replacement_bindings_invalid")
                host_ip = binding.get("HostIp")
                host_port = binding.get("HostPort")
                if not isinstance(host_ip, str) or not host_ip.strip():
                    raise SystemExit("source_replacement_bindings_invalid")
                try:
                    host_port = int(str(host_port))
                except (TypeError, ValueError):
                    raise SystemExit("source_replacement_bindings_invalid")
                if not 1 <= host_port <= 65535:
                    raise SystemExit("source_replacement_bindings_invalid")
                actual_bindings.add(
                    f"{host_ip}:{host_port}:{container_port}"
                )
        if frozenset(actual_bindings) not in expected_binding_sets:
            raise SystemExit("source_replacement_bindings_mismatch")
        print(json.dumps({
            "containers": [name],
            "original": {
                "name": name,
                "config": config,
                "host_config": item.get("HostConfig") or {},
            },
        }))
        PY
      args:
        executable: /bin/bash
      register: source_replacement_validation
      changed_when: false
      failed_when: source_replacement_validation.rc != 0
      no_log: true
      when:
        - host_port_preflight_enabled
        - (port_conflict_entries | length) > 0
        - replace_conflicts | default(false) | bool
        - source_replacement is defined

    - name: Parse exact source replacement container list
      set_fact:
        removable_containers: "{{ (source_replacement_validation.stdout | default('{}') | from_json).containers }}"
        source_replacement_original: "{{ (source_replacement_validation.stdout | default('{}') | from_json).original }}"
        source_replacement_verified: true
      no_log: true
      when:
        - host_port_preflight_enabled
        - (port_conflict_entries | length) > 0
        - replace_conflicts | default(false) | bool
        - source_replacement is defined

    - name: Prepare image through the shared authentication and platform boundary
      ansible.builtin.include_tasks: ../tasks/container_image_prepare.yml

    - name: Mark source replacement transaction active
      set_fact:
        source_replacement_removed: true
      when:
        - source_replacement_verified | default(false) | bool

    - name: Remove conflicting container "{{ item }}"
      command: docker rm -f {{ item }}
      loop: "{{ removable_containers | default([]) }}"
      when:
        - host_port_preflight_enabled
        - replace_conflicts | default(false) | bool
        - (removable_containers | default([]) | length) > 0

    - name: OPERATION_STEP replace:complete
      shell: |
        printf 'OPERATION_STEP={"name":"replace:complete","status":"completed","metadata":{"display_name":"Remove conflicting containers","removed":%s}}\n' '{{ removable_containers | default([]) | to_json }}'
      args:
        executable: /bin/sh
      when:
        - host_port_preflight_enabled
        - replace_conflicts | default(false) | bool
        - (removable_containers | default([]) | length) > 0

    - name: Re-check host port conflicts after removal
      shell: |
        python3 - <<'PY'
        import json, subprocess, sys

        ports = json.loads('''{{ deploy_host_ports | default([]) | to_json }}''')
        target_container = {{ container_name | to_json }}
        target_org = {{ app_org_id | default('') | to_json }}
        target_project = {{ app_project_id | default('') | to_json }}
        target_app = {{ app_slug | default(container_name) | to_json }}
        require_project = bool(target_project)
        if not ports:
            print("[]")
            sys.exit(0)

        result = subprocess.run(
            ["docker", "ps", "--format", "{{ '{{json .}}' }}"],
            capture_output=True,
            text=True,
        )
        if result.returncode != 0:
            sys.stderr.write(result.stderr)
            sys.exit(result.returncode)

        seen = {}
        for line in result.stdout.splitlines():
            line = line.strip()
            if not line:
                continue
            try:
                data = json.loads(line)
            except json.JSONDecodeError:
                continue
            ports_field = data.get("Ports") or ""
            matches = sorted({port for port in ports if f":{port}->" in ports_field})
            if not matches:
                continue
            name = data.get("Names") or data.get("ID")
            if not name:
                continue
            if name == target_container:
                inspect_result = subprocess.run(
                    ["docker", "inspect", target_container],
                    capture_output=True,
                    text=True,
                )
                if inspect_result.returncode == 0:
                    try:
                        inspect_payload = json.loads(inspect_result.stdout)
                    except json.JSONDecodeError:
                        inspect_payload = []
                    inspect_item = inspect_payload[0] if inspect_payload else {}
                    labels = ((inspect_item.get("Config") or {}).get("Labels") or {})
                    owned = (
                        labels.get("com.opsctl.managed") == "true"
                        and labels.get("com.opsctl.org_id") == target_org
                        and labels.get("com.opsctl.app") == target_app
                        and ((not require_project) or labels.get("com.opsctl.project_id") == target_project)
                    )
                    if owned:
                        continue
            seen.setdefault(name, set()).update(matches)

        conflicts = [
            {"name": name, "ports": sorted(list(values))}
            for name, values in seen.items()
        ]
        print(json.dumps(conflicts))
        PY
      args:
        executable: /bin/bash
      register: port_conflicts_retry_result
      changed_when: false
      failed_when:
        - port_conflicts_retry_result.rc != 0
        - not (source_replacement_verified | default(false) | bool)
      when:
        - host_port_preflight_enabled
        - replace_conflicts | default(false) | bool
        - (port_conflict_entries | length) > 0

    - name: Parse post-removal conflicts
      set_fact:
        port_conflict_entries_post: >-
          {{
            (port_conflicts_retry_result.stdout | default('[]') | from_json)
            if (port_conflicts_retry_result.rc | default(1) | int) == 0
            else []
          }}
        source_replacement_recheck_complete: true
        source_replacement_recheck_failed: "{{ (port_conflicts_retry_result.rc | default(1) | int) != 0 }}"
      when:
        - host_port_preflight_enabled
        - replace_conflicts | default(false) | bool
        - (port_conflict_entries | default([]) | length) > 0
        - (
            source_replacement_verified | default(false) | bool
            or (
              not traefik_enabled
              and not wireguard_backend_enabled
              and not source_dual_backend_enabled
            )
          )

    - name: Fail when post-removal conflict recheck fails
      block:
        - name: Abort after post-removal conflict recheck failure
          fail:
            msg: "post_removal_conflict_recheck_failed"
      rescue:
        - name: Restore source container after conflict recheck failure
          shell: "{{ source_replacement_restore_script }}"
          args:
            executable: /bin/bash
          no_log: true
          failed_when: source_replacement_restore_result.rc != 0
          register: source_replacement_restore_result
        - name: Abort after source restoration
          fail:
            msg: "Source replacement transaction failed and was restored."
      when:
        - source_replacement_verified | default(false) | bool
        - source_replacement_removed | default(false) | bool
        - source_replacement_recheck_failed | default(false) | bool

    - name: Fail when conflicts remain after override
      block:
        - name: OPERATION_STEP preflight:ports failed after override
          shell: |
            printf 'OPERATION_STEP={"name":"preflight:ports","status":"failed","metadata":{"display_name":"Check ports","ports":%s,"conflicts_remaining":%s}}\n' '{{ deploy_host_ports | default([]) | to_json }}' '{{ port_conflict_entries_post | map(attribute="name") | list | to_json }}'
          args:
            executable: /bin/sh
        - name: Abort due to remaining port conflicts
          fail:
            msg: "port_conflict"
      rescue:
        - name: Restore source container after post-removal conflict failure
          shell: "{{ source_replacement_restore_script }}"
          args:
            executable: /bin/bash
          no_log: true
          failed_when: source_replacement_restore_result.rc != 0
          register: source_replacement_restore_result
        - name: Abort after source restoration
          fail:
            msg: "Source replacement transaction failed and was restored."
      when:
        - host_port_preflight_enabled
        - replace_conflicts | default(false) | bool
        - (port_conflict_entries_post | default([]) | length) > 0

    - name: Require source replacement post-removal recheck
      block:
        - name: Abort when source replacement recheck was not completed
          fail:
            msg: "post_removal_conflict_recheck_missing"
      rescue:
        - name: Restore source container after missing conflict recheck
          shell: "{{ source_replacement_restore_script }}"
          args:
            executable: /bin/bash
          no_log: true
          failed_when: source_replacement_restore_result.rc != 0
          register: source_replacement_restore_result
        - name: Abort after source restoration
          fail:
            msg: "Source replacement transaction failed and was restored."
      when:
        - source_replacement_verified | default(false) | bool
        - source_replacement_removed | default(false) | bool
        - not (source_replacement_recheck_complete | default(false) | bool)

    - name: OPERATION_STEP preflight:ports complete
      shell: |
        printf 'OPERATION_STEP={"name":"preflight:ports","status":"completed","metadata":{"display_name":"Check ports","ports":%s}}\n' '{{ deploy_host_ports | default([]) | to_json }}'
      args:
        executable: /bin/sh
      when:
        - host_port_preflight_enabled
        - (deploy_host_ports | length) > 0
        - (
            (port_conflict_entries | length == 0)
            or
            (
              replace_conflicts | default(false) | bool
              and (
                (
                  source_replacement_verified | default(false) | bool
                  and source_replacement_recheck_complete | default(false) | bool
                  and (port_conflict_entries_post | default([]) | length) == 0
                )
                or (
                  not (source_replacement_verified | default(false) | bool)
                  and (port_conflict_entries_post | default([]) | length) == 0
                )
              )
            )
          )

    - name: Build Traefik labels for router "{{ router_name }}"
      set_fact:
        traefik_label_map: >-
          {{
            {
              'traefik.enable': 'true',
              ('traefik.http.routers.' ~ router_name ~ '.rule'): traefik_rule,
              ('traefik.http.routers.' ~ router_name ~ '.entrypoints'): 'websecure'
            }
            | combine(
                (app_traefik_https | default(true))
                | ternary(
                    {('traefik.http.routers.' ~ router_name ~ '.tls'): 'true'},
                    {}
                )
            )
            | combine(
                (traefik_middlewares | length > 0)
                | ternary(
                    {('traefik.http.routers.' ~ router_name ~ '.middlewares'): (traefik_middlewares | join(','))},
                    {}
                )
            )
          }}
      when: traefik_enabled

    - name: Merge OpsControl and Traefik labels
      set_fact:
        final_label_map: "{{ opsctl_label_map | combine({'com.opsctl.revision_id': app_revision_id} if app_revision_id is defined else {}) | combine(traefik_label_map) }}"
      when: traefik_enabled

    - name: Apply baseline OpsControl labels
      set_fact:
        final_label_map: "{{ opsctl_label_map | combine({'com.opsctl.revision_id': app_revision_id} if app_revision_id is defined else {}) }}"
      when: not traefik_enabled

    - name: OPERATION_STEP container:prepare
      shell: |
        printf 'OPERATION_STEP={"name":"container:prepare","status":"running","metadata":{"display_name":"Prepare container","container_name":"%s","router_name":"%s","traefik_enabled":%s}}\n' "{{ container_name }}" "{{ router_name }}" "{{ 'true' if traefik_enabled else 'false' }}"
      args:
        executable: /bin/sh

    - name: Discover legacy OpsCtl-managed containers for deployment identity
      shell: |
        python3 - <<'PY'
        import json, subprocess, sys

        target_container = {{ container_name | to_json }}
        target_org = {{ app_org_id | default('') | to_json }}
        target_project = {{ app_project_id | default('') | to_json }}
        target_app = {{ app_slug | default(container_name) | to_json }}
        require_project = bool(target_project)

        ps = subprocess.run(
            ["docker", "ps", "-a", "--format", "{{ '{{json .}}' }}"],
            capture_output=True,
            text=True,
        )
        if ps.returncode != 0:
            sys.stderr.write(ps.stderr)
            sys.exit(ps.returncode)

        names = []
        for line in ps.stdout.splitlines():
            line = line.strip()
            if not line:
                continue
            try:
                row = json.loads(line)
            except json.JSONDecodeError:
                continue
            name = row.get("Names")
            if name:
                names.append(name)

        if not names:
            print("[]")
            sys.exit(0)

        inspect = subprocess.run(["docker", "inspect"] + names, capture_output=True, text=True)
        if inspect.returncode != 0:
            sys.stderr.write(inspect.stderr)
            sys.exit(inspect.returncode)

        try:
            payload = json.loads(inspect.stdout)
        except json.JSONDecodeError:
            print("[]")
            sys.exit(0)

        legacy = []
        for item in payload:
            labels = (item.get("Config") or {}).get("Labels") or {}
            if labels.get("com.opsctl.managed") != "true":
                continue
            if labels.get("com.opsctl.org_id") != target_org:
                continue
            if labels.get("com.opsctl.app") != target_app:
                continue
            if require_project and labels.get("com.opsctl.project_id") != target_project:
                continue
            name = (item.get("Name") or "").lstrip("/")
            if not name or name == target_container:
                continue
            legacy.append(name)

        print(json.dumps(sorted(set(legacy))))
        PY
      args:
        executable: /bin/bash
      register: legacy_opsctl_containers_result
      changed_when: false
      failed_when: legacy_opsctl_containers_result.rc != 0
      when: not managed_image_resources

    - name: Parse legacy OpsCtl containers list
      set_fact:
        legacy_opsctl_containers: "{{ legacy_opsctl_containers_result.stdout | default('[]') | from_json }}"
      when: not managed_image_resources

    - name: Remove legacy OpsCtl-managed container "{{ item }}"
      command: docker rm -f "{{ item }}"
      loop: "{{ legacy_opsctl_containers | default([]) }}"
      when: not managed_image_resources and (legacy_opsctl_containers | default([]) | length) > 0

    - name: OPERATION_STEP replace:legacy_cleanup complete
      shell: |
        printf 'OPERATION_STEP={"name":"replace:legacy_cleanup","status":"completed","metadata":{"display_name":"Remove legacy containers","removed":%s}}\n' '{{ legacy_opsctl_containers | default([]) | to_json }}'
      args:
        executable: /bin/sh
      when: not managed_image_resources and (legacy_opsctl_containers | default([]) | length) > 0

    - name: Start target container
      block:
        - name: Start container "{{ container_name }}"
          community.docker.docker_container:
            name: "{{ container_name }}"
            image: "{{ app_image }}"
            command: "{{ app_run_command | default(omit) }}"
            state: started
            recreate: true
            restart_policy: unless-stopped
            detach: true
            pull: false
            published_ports: "{{ published_ports }}"
            env: "{{ app_env | default({}) }}"
            labels: "{{ final_label_map }}"
            mounts: "{{ image_native_mounts }}"
            networks: "{{ image_native_networks }}"
            networks_cli_compatible: true
            network_mode: "{{ 'bridge' if image_native_networks | length == 0 else omit }}"
            memory: "{{ app_memory_bytes | default(omit, true) }}"
            healthcheck: >-
              {{ {'test': ['CMD'] + app_health_exec, 'interval': '5s', 'timeout': '5s', 'retries': 20}
                if app_health_exec | default(none) is not none else omit }}
          no_log: true
      rescue:
        - name: Preserve startup restoration and publish available failed-attempt facts
          block:
            - name: Restore source container after container startup failure
              shell: "{{ source_replacement_restore_script }}"
              args:
                executable: /bin/bash
              no_log: true
              failed_when: source_replacement_restore_result.rc != 0
              register: source_replacement_restore_result
              when:
                - source_replacement_verified | default(false) | bool
                - source_replacement_removed | default(false) | bool

            - name: Collect container startup diagnostics
              include_tasks: ../tasks/container_failure_diagnostics.yml

            - name: OPERATION_STEP container:prepare failed
              shell: |
                printf 'OPERATION_STEP={"name":"container:prepare","status":"failed","metadata":{"display_name":"Prepare container","reason_code":"container_start_failed"}}\n'
              args:
                executable: /bin/sh
          always:
            - name: Observe the actual runtime after startup failure or restoration
              ansible.builtin.include_tasks:
                file: ../tasks/container_observe.yml
                apply:
                  no_log: true
              vars:
                image_runtime_action: deploy

            - name: Publish startup-failure runtime facts without changing failure outcome
              ansible.builtin.debug:
                msg: "TEMPLATE_OUTPUT_JSON={{ {'image_runtime': image_runtime} | to_json }}"

        - name: Abort after container startup failure
          fail:
            msg: "Container startup failed."

    - name: OPERATION_STEP container:prepare complete
      shell: |
        printf 'OPERATION_STEP={"name":"container:prepare","status":"completed","metadata":{"display_name":"Prepare container","container_name":"%s","router_name":"%s","traefik_enabled":%s}}\n' "{{ container_name }}" "{{ router_name }}" "{{ 'true' if traefik_enabled else 'false' }}"
      args:
        executable: /bin/sh

    - name: Probe Docker HEALTHCHECK capability for "{{ container_name }}"
      shell: |
        docker inspect --format '{% raw %}{{if .Config.Healthcheck}}yes{{else}}no{{end}}{% endraw %}' "{{ container_name }}"
      args:
        executable: /bin/sh
      register: docker_health_support
      changed_when: false
      failed_when: false
      when:
        - health_mode == 'auto' or effective_health_mode in ['container', 'traefik']

    - name: Determine health verification strategy
      set_fact:
        health_strategy: "{{ 'healthcheck' if ((docker_health_support.stdout | default('') | trim) == 'yes') else ('http' if effective_health_mode in ['host', 'container', 'traefik'] else 'running') }}"

    - name: OPERATION_STEP health:check
      shell: |
        printf 'OPERATION_STEP={"name":"health:check","status":"running","metadata":{"display_name":"Check container health","mode":"%s","target":"%s","strategy":"%s"}}\n' "{{ effective_health_mode }}" "{{ health_check_target }}" "{{ health_strategy }}"
      args:
        executable: /bin/sh

    - name: Verify target container health
      block:
        - name: Verify health endpoint at {{ health_url_local }}
          uri:
            url: "{{ health_url_local }}"
            method: GET
            status_code: 200
            timeout: 20
          register: health_result_host
          retries: 10
          delay: 3
          until: health_result_host.status == 200
          when: effective_health_mode == 'host'

        - name: Wait for Docker HEALTHCHECK status on "{{ container_name }}"
          shell: |
            docker inspect --format '{% raw %}{{if .State.Health}}{{.State.Health.Status}}{{end}}{% endraw %}' "{{ container_name }}"
          args:
            executable: /bin/sh
          register: docker_health_status
          retries: 20
          delay: 3
          until: docker_health_status.stdout.strip() == "healthy"
          when:
            - health_mode == 'auto' or effective_health_mode in ['container', 'traefik']
            - (docker_health_support.stdout | default('') | trim) == "yes"

        - name: Wait for container HTTP health on "{{ container_name }}:{{ container_health_port }}{{ health_container_path }}"
          ansible.builtin.script:
            cmd: >-
              {{ (playbook_dir + '/../scripts/container_http_health.py') | quote }}
              --container {{ container_name | quote }}
              --organization {{ app_org_id | quote }}
              --deployment {{ app_deployment_id | quote }}
              --revision {{ app_revision_id | default('', true) | quote }}
              --port {{ container_health_port | string | quote }}
              --path {{ health_container_path | quote }}
            executable: python3
          register: container_health_exec
          changed_when: false
          retries: 20
          delay: 3
          until: container_health_exec.rc == 0
          when:
            - effective_health_mode in ['container', 'traefik']
            - (docker_health_support.stdout | default('') | trim) != "yes"

        - name: OPERATION_STEP health:check complete
          shell: |
            printf 'OPERATION_STEP={"name":"health:check","status":"completed","metadata":{"display_name":"Check container health","mode":"%s","target":"%s","strategy":"%s"}}\n' "{{ effective_health_mode }}" "{{ health_check_target }}" "{{ health_strategy }}"
          args:
            executable: /bin/sh
      rescue:
        - name: Preserve health restoration and publish available failed-attempt facts
          block:
            - name: Restore source container after health validation failure
              shell: "{{ source_replacement_restore_script }}"
              args:
                executable: /bin/bash
              no_log: true
              failed_when: source_replacement_restore_result.rc != 0
              register: source_replacement_restore_result
              when:
                - source_replacement_verified | default(false) | bool
                - source_replacement_removed | default(false) | bool

            - name: Collect container health diagnostics
              include_tasks: ../tasks/container_failure_diagnostics.yml

            - name: OPERATION_STEP health:check failed
              shell: |
                printf 'OPERATION_STEP={"name":"health:check","status":"failed","metadata":{"display_name":"Check container health","reason_code":"container_health_failed"}}\n'
              args:
                executable: /bin/sh
          always:
            - name: Observe the actual runtime after health failure or restoration
              ansible.builtin.include_tasks:
                file: ../tasks/container_observe.yml
                apply:
                  no_log: true
              vars:
                image_runtime_action: deploy

            - name: Publish health-failure runtime facts without changing failure outcome
              ansible.builtin.debug:
                msg: "TEMPLATE_OUTPUT_JSON={{ {'image_runtime': image_runtime} | to_json }}"

        - name: Abort after container health failure
          fail:
            msg: "Container health verification failed."

    - name: OPERATION_STEP deploy:start complete
      shell: |
        printf 'OPERATION_STEP={"name":"deploy:start","status":"completed","metadata":{"display_name":"Deploy container","container":"{{ container_name }}"}}\n'
      args:
        executable: /bin/sh

    - name: Observe every ordinary image runtime and any retained resources
      ansible.builtin.include_tasks:
        file: ../tasks/container_observe.yml
        apply:
          no_log: true
      vars:
        image_runtime_action: deploy

    - name: Publish plain image-runtime observation
      ansible.builtin.debug:
        msg: "TEMPLATE_OUTPUT_JSON={{ {'image_runtime': image_runtime} | to_json }}"

    - name: Require complete image runtime observation
      ansible.builtin.assert:
        that:
          - image_runtime.observation_complete
          - image_runtime.ready
        fail_msg: Image runtime observation is incomplete or not ready.
