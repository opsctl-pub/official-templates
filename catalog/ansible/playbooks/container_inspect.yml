---
- name: Inspect OpsCtl-managed deployment container
  hosts: all
  gather_facts: false
  become: true
  vars:
    container_name: "{{ app_container_name | default('app') }}"
    expected_org_id: "{{ app_org_id | default('') }}"
    expected_project_id: "{{ app_project_id | default('') }}"
    expected_app_slug: "{{ app_slug | default(container_name) }}"
  pre_tasks:
    - name: Observe only the exact captured Compose group revision
      ansible.builtin.shell: |
        python3 - <<'PY'
        import ipaddress
        import json
        import os
        import re
        import subprocess
        import tempfile
        import time

        request = json.loads({{ app_compose_inspect | default({}) | to_json | to_json }})
        deadline = time.monotonic() + 60

        def run(arguments):
            remaining = deadline - time.monotonic()
            if remaining <= 0:
                raise ValueError
            with tempfile.TemporaryFile() as output:
                child = subprocess.Popen(arguments, stdout=output, stderr=subprocess.DEVNULL)
                try:
                    while child.poll() is None:
                        if time.monotonic() >= deadline or os.fstat(output.fileno()).st_size > 1048576:
                            raise ValueError
                        time.sleep(0.05)
                    if child.returncode != 0:
                        raise ValueError
                    output.seek(0)
                    value = output.read(1048577)
                    if len(value) > 1048576:
                        raise ValueError
                    return value
                finally:
                    if child.poll() is None:
                        child.kill()
                    child.wait()

        def inspect(identity):
            value = json.loads(run(['docker', 'container', 'inspect', '--', identity]))
            if not isinstance(value, list) or len(value) != 1 or not isinstance(value[0], dict):
                raise ValueError
            return value[0]

        try:
            if request['protocol'] != 'opsctl-compose-inspection/1':
                raise ValueError
            services = request['services']
            if not isinstance(services, dict) or not 1 <= len(services) <= 8:
                raise ValueError
            if set(services) != set(request['containers']):
                raise ValueError
            listing_format = {{ '{{.ID}} {{.Names}}' | to_json }}
            listing = run(['docker', 'ps', '-a', '--no-trunc', '--format', listing_format]).decode().splitlines()
            if len(listing) > 1024:
                raise ValueError
            native_names = {}
            for line in listing:
                identity, name = line.split(' ', 1)
                if not re.fullmatch('[a-f0-9]{64}', identity) or name in native_names:
                    raise ValueError
                native_names[name] = identity
            ids = set(native_names.values())
            if len(ids) != len(native_names):
                raise ValueError
            project_ids = run(['docker', 'ps', '-aq', '--no-trunc', '--filter',
                               'label=com.docker.compose.project=' + request['project_name']]).decode().splitlines()
            if len(set(project_ids)) != len(project_ids) or set(project_ids) - set(request['containers'].values()):
                raise ValueError
            observed = {}
            for name, expected in services.items():
                identity = request['containers'][name]
                row = inspect(identity) if identity in ids else None
                named = native_names.get(expected['container_name'])
                if row is None:
                    if named:
                        raise ValueError
                    observed[name] = {'container_id': None, 'image': None, 'state': 'missing', 'ports': []}
                    continue
                labels = (row.get('Config') or {}).get('Labels') or {}
                required = {
                    'com.opsctl.managed': 'true', 'com.opsctl.org_id': request['organization_id'],
                    'com.opsctl.deployment_id': request['deployment_id'],
                    'com.opsctl.server_id': request['server_id'], 'com.opsctl.revision_id': request['revision_id'],
                    'com.docker.compose.project': request['project_name'], 'com.docker.compose.service': name,
                }
                state = row.get('State')
                image = (row.get('Config') or {}).get('Image')
                if (row.get('Id') != identity or row.get('Name') != '/' + expected['container_name']
                        or named != identity or identity not in project_ids
                        or any(labels.get(key) != value for key, value in required.items())
                        or not isinstance(state, dict) or type(state.get('Running')) is not bool
                        or not isinstance(image, str) or not re.fullmatch(r'[^\s@]+@sha256:[a-f0-9]{64}', image)):
                    raise ValueError
                health = (state.get('Health') or {}).get('Status')
                if health not in (None, 'healthy', 'unhealthy', 'starting'):
                    raise ValueError
                status = 'stopped' if not state['Running'] else health or 'started'
                bindings = (row.get('NetworkSettings') or {}).get('Ports') or {}
                if not isinstance(bindings, dict):
                    raise ValueError
                ports = set()
                for container_port, published in bindings.items():
                    if not re.fullmatch(r'[0-9]+/tcp', container_port):
                        if published:
                            raise ValueError
                        continue
                    if published is None:
                        continue
                    if not isinstance(published, list):
                        raise ValueError
                    for item in published:
                        host = ipaddress.ip_address(item['HostIp']).compressed
                        host_port, target = int(item['HostPort']), int(container_port.split('/')[0])
                        if not 1 <= host_port <= 65535 or not 1 <= target <= 65535:
                            raise ValueError
                        ports.add((host, host_port, target))
                observed[name] = {
                    'container_id': identity, 'image': image, 'state': status,
                    'ports': [{'host_ip': host, 'host_port': port, 'container_port': target}
                              for host, port, target in sorted(ports)],
                }
            proof = {key: request[key] for key in (
                'protocol', 'organization_id', 'deployment_id', 'server_id', 'operation_id',
                'revision_id', 'project_name', 'effective_digest',
            )}
            proof['services'] = observed
            print('OPERATION_STEP=' + json.dumps({
                'name': 'inspect:result', 'status': 'completed',
                'metadata': {'display_name': 'Compose inspection complete', 'compose_inspection': proof},
            }, sort_keys=True))
        except Exception:
            print('Compose inspection could not establish exact observation.', file=__import__('sys').stderr)
            raise SystemExit(1)
        PY
      args:
        executable: /bin/sh
      register: compose_inspection
      no_log: true
      changed_when: false
      when: app_compose_inspect is defined

    - name: Publish safe named-service inspection
      ansible.builtin.debug:
        msg: "{{ compose_inspection.stdout }}"
      when: app_compose_inspect is defined

    - name: Finish the group observation without singular inspection
      ansible.builtin.meta: end_play
      when: app_compose_inspect is defined
  tasks:
    - name: Attest an explicitly bound private backend revision
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/private_http_verification.yml"
      when: private_verification is defined

    - name: OPERATION_STEP inspect:start
      shell: |
        printf 'OPERATION_STEP={"name":"inspect:start","status":"running","metadata":{"display_name":"Inspect container","container_name":{{ container_name | to_json }}}}\n'
      args:
        executable: /bin/sh

    - name: Collect deployment inspection metadata
      shell: |
        python3 - <<'PY'
        import ipaddress
        import json
        import subprocess
        import time

        target_container = {{ container_name | to_json }}
        target_org = {{ expected_org_id | to_json }}
        target_project = {{ expected_project_id | to_json }}
        target_app = {{ expected_app_slug | to_json }}
        require_project = bool(target_project)

        inspect_started = time.monotonic()

        def run_cmd(args):
            return subprocess.run(args, capture_output=True, text=True)

        def parse_inspect_payload(stdout):
            try:
                payload = json.loads(stdout or "[]")
            except json.JSONDecodeError:
                return None
            if not isinstance(payload, list) or not payload:
                return None
            if not isinstance(payload[0], dict):
                return None
            return payload[0]

        def labels_for(container_payload):
            return ((container_payload.get("Config") or {}).get("Labels") or {})

        def is_owned(labels):
            if labels.get("com.opsctl.managed") != "true":
                return False
            if labels.get("com.opsctl.org_id") != target_org:
                return False
            if labels.get("com.opsctl.app") != target_app:
                return False
            if require_project and labels.get("com.opsctl.project_id") != target_project:
                return False
            return True

        def image_digest_for(container_payload):
            digest = None
            repo_digests = container_payload.get("RepoDigests") or []
            if isinstance(repo_digests, list):
                for entry in repo_digests:
                    if not isinstance(entry, str):
                        continue
                    if "@sha256:" not in entry:
                        continue
                    digest = entry.split("@", 1)[1].strip()
                    break
            if not digest:
                image_id = container_payload.get("Image")
                if isinstance(image_id, str) and image_id.startswith("sha256:"):
                    digest = image_id
            if isinstance(digest, str) and digest.startswith("sha256:"):
                return digest
            return None

        def ports_for(container_payload):
            ports = []
            raw_ports = ((container_payload.get("NetworkSettings") or {}).get("Ports") or {})
            if not isinstance(raw_ports, dict):
                return ports

            for container_binding, host_bindings in raw_ports.items():
                if not isinstance(container_binding, str):
                    continue
                container_token = container_binding.split("/", 1)[0]
                try:
                    container_port = int(container_token)
                except (TypeError, ValueError):
                    continue
                if not isinstance(host_bindings, list):
                    continue
                for binding in host_bindings:
                    if not isinstance(binding, dict):
                        continue
                    host_value = binding.get("HostPort")
                    try:
                        host_port = int(str(host_value))
                    except (TypeError, ValueError):
                        continue
                    if not (1 <= host_port <= 65535 and 1 <= container_port <= 65535):
                        continue
                    ports.append({"host": host_port, "container": container_port})

            unique = {}
            for entry in ports:
                unique[(entry["host"], entry["container"])] = entry
            return [unique[key] for key in sorted(unique.keys())]

        def port_bindings_for(container_payload):
            network_settings = container_payload.get("NetworkSettings") or {}
            if not isinstance(network_settings, dict):
                raise ValueError("NetworkSettings must be an object")
            raw_ports = network_settings.get("Ports") or {}
            if not isinstance(raw_ports, dict):
                raise ValueError("NetworkSettings.Ports must be an object")

            bindings = set()
            for container_binding, host_bindings in raw_ports.items():
                if not isinstance(container_binding, str):
                    raise ValueError("container binding key must be a string")
                parts = container_binding.split("/")
                if len(parts) != 2 or parts[1] not in {"tcp", "udp", "sctp"}:
                    raise ValueError("container binding key is invalid")
                try:
                    container_port = int(parts[0])
                except (TypeError, ValueError) as exc:
                    raise ValueError("container port is invalid") from exc
                if not 1 <= container_port <= 65535:
                    raise ValueError("container port is invalid")
                if host_bindings is None:
                    continue
                if not isinstance(host_bindings, list):
                    raise ValueError("host bindings must be a list or null")
                for binding in host_bindings:
                    if not isinstance(binding, dict):
                        raise ValueError("host binding must be an object")
                    host_ip = binding.get("HostIp")
                    host_port = binding.get("HostPort")
                    if not isinstance(host_ip, str) or not host_ip.strip():
                        raise ValueError("host IP is invalid")
                    try:
                        normalized_host_ip = ipaddress.ip_address(host_ip.strip()).compressed
                        normalized_host_port = int(str(host_port))
                    except (TypeError, ValueError) as exc:
                        raise ValueError("host binding is invalid") from exc
                    if not 1 <= normalized_host_port <= 65535:
                        raise ValueError("host port is invalid")
                    bindings.add((
                        parts[1],
                        container_port,
                        normalized_host_ip,
                        normalized_host_port,
                    ))

            return [
                {
                    "protocol": protocol,
                    "container_port": container_port,
                    "host_ip": host_ip,
                    "host_port": host_port,
                }
                for protocol, container_port, host_ip, host_port in sorted(bindings)
            ]

        def health_status_for(container_payload):
            state = container_payload.get("State") or {}
            health = state.get("Health") or {}
            status = health.get("Status")
            if status == "healthy":
                return "healthy"
            if status == "unhealthy":
                return "unhealthy"
            return "none"

        def running_for(container_payload):
            state = container_payload.get("State") or {}
            return bool(state.get("Running"))

        def identity_labels_for(container_payload):
            labels = labels_for(container_payload) if container_payload is not None else {}
            return {
                "com.opsctl.managed": labels.get("com.opsctl.managed"),
                "com.opsctl.org_id": labels.get("com.opsctl.org_id"),
                "com.opsctl.project_id": labels.get("com.opsctl.project_id"),
                "com.opsctl.app": labels.get("com.opsctl.app"),
                "com.opsctl.deployment_id": labels.get("com.opsctl.deployment_id"),
            }

        def observed_from_payload(container_payload):
            image_ref = ((container_payload.get("Config") or {}).get("Image"))
            if not isinstance(image_ref, str) or not image_ref.strip():
                image_ref = None
            container_id = container_payload.get("Id")
            if not isinstance(container_id, str) or not container_id:
                container_id = None

            return {
                "container_id": container_id,
                "image_ref": image_ref,
                "image_digest": image_digest_for(container_payload),
                "ports": ports_for(container_payload),
                "port_bindings": port_bindings_for(container_payload),
                "health_status": health_status_for(container_payload),
                "running": running_for(container_payload),
                "identity_labels": identity_labels_for(container_payload),
            }

        identity_match = "missing"
        selected_payload = None

        stable_inspect = run_cmd(["docker", "inspect", target_container])
        if stable_inspect.returncode == 0:
            stable_payload = parse_inspect_payload(stable_inspect.stdout)
            if stable_payload is not None:
                selected_payload = stable_payload
                if is_owned(labels_for(stable_payload)):
                    identity_match = "stable_name"
                else:
                    identity_match = "label_mismatch"
        else:
            ps_command = [
                "docker",
                "ps",
                "-a",
                "-q",
                "--filter",
                "label=com.opsctl.managed=true",
                "--filter",
                f"label=com.opsctl.org_id={target_org}",
                "--filter",
                f"label=com.opsctl.app={target_app}",
            ]
            if require_project:
                ps_command.extend([
                    "--filter",
                    f"label=com.opsctl.project_id={target_project}",
                ])

            filtered_ps = run_cmd(ps_command)
            candidate_names = []
            if filtered_ps.returncode == 0:
                for line in (filtered_ps.stdout or "").splitlines():
                    line = line.strip()
                    if not line:
                        continue
                    candidate_names.append(line)

            ordered_candidates = list(dict.fromkeys(candidate_names))
            if len(ordered_candidates) == 1:
                fallback_inspect = run_cmd(["docker", "inspect", ordered_candidates[0]])
                if fallback_inspect.returncode == 0:
                    fallback_payload = parse_inspect_payload(fallback_inspect.stdout)
                    if fallback_payload is not None:
                        selected_payload = fallback_payload
                        identity_match = "labels_only"
            elif len(ordered_candidates) > 1:
                identity_match = "multiple_candidates"

        duration_ms = max(0, int((time.monotonic() - inspect_started) * 1000))
        result = {
            "container_id": None,
            "image_ref": None,
            "image_digest": None,
            "ports": [],
            "port_bindings": [],
            "health_status": "none",
            "running": False,
            "identity_match": identity_match,
            "inspect_duration_ms": duration_ms,
            "identity_labels": identity_labels_for(None),
        }
        if selected_payload is not None:
            result.update(observed_from_payload(selected_payload))
            result["identity_match"] = identity_match
            result["inspect_duration_ms"] = duration_ms

        print(json.dumps(result))
        PY
      args:
        executable: /bin/bash
      register: inspect_result_raw
      changed_when: false
      failed_when: inspect_result_raw.rc != 0

    - name: Parse inspect metadata payload
      set_fact:
        inspect_result: "{{ inspect_result_raw.stdout | from_json }}"

    - name: OPERATION_STEP inspect:result
      shell: |
        printf 'OPERATION_STEP={"name":"inspect:result","status":"completed","metadata":%s}\n' '{{ inspect_result | combine({"display_name": "Inspection complete"}) | to_json }}'
      args:
        executable: /bin/sh
