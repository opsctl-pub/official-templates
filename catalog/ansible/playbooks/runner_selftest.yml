---
- name: Runner self-test (official)
  hosts: all
  gather_facts: false
  tasks:
    - name: Echo OPERATION_STEP running
      shell: |
        printf 'OPERATION_STEP={"name":"Ansible playbook","status":"running","metadata":{"display_name":"Run runner self-test","playbook":"runner_selftest.yml"}}\n'

    - name: No-op
      debug:
        msg: "Runner and inventory wiring OK"

    - name: Echo OPERATION_STEP completed
      shell: |
        printf 'OPERATION_STEP={"name":"Ansible playbook","status":"completed","metadata":{"display_name":"Runner self-test complete","duration_ms":1}}\n'
