---
- name: Converge canonical managed Caddy proxy
  hosts: all
  gather_facts: false
  become: true
  vars:
    caddy_proxy_state_dir: "/etc/opsctl"
    caddy_proxy_state_file: "/etc/opsctl/caddy-proxy.json"
    nginx_proxy_state_file: "/etc/opsctl/nginx-proxy.json"
    caddy_route_dir: "/etc/caddy/opsctl-routes"
    caddy_certificate_dir: "/etc/caddy/opsctl-certificates"
    caddy_config_file: "/etc/caddy/Caddyfile"
    caddy_acme_staging_url: "https://acme-staging-v02.api.letsencrypt.org/directory"
  pre_tasks:
    - name: Skip Caddy proxy when running in simulate mode
      meta: end_play
      when: simulate | default(false)
  tasks:
    - name: OPERATION_STEP caddy:start
      shell: |
        printf 'OPERATION_STEP={"name":"caddy:start","status":"running","metadata":{"display_name":"Configure Caddy proxy"}}\n'
      args:
        executable: /bin/sh

    - name: Converge managed Caddy proxy
      block:
        - name: Validate required organization context
          assert:
            that:
              - org_id is defined
              - (org_id | string | length) > 0
              - caddy_acme_email is defined
              - (caddy_acme_email | string | length) > 0
            fail_msg: "org_id and caddy_acme_email are required to manage the Caddy proxy"

        - name: Ensure managed proxy state directory exists
          file:
            path: "{{ caddy_proxy_state_dir }}"
            state: directory
            mode: "0755"

        - name: Check for existing managed Caddy proxy state
          stat:
            path: "{{ caddy_proxy_state_file }}"
          register: caddy_proxy_state_stat

        - name: Load existing managed Caddy proxy state
          slurp:
            path: "{{ caddy_proxy_state_file }}"
          register: caddy_proxy_state_raw
          when: caddy_proxy_state_stat.stat.exists

        - name: Decode existing managed Caddy proxy state
          set_fact:
            caddy_proxy_state: "{{ (caddy_proxy_state_raw.content | b64decode | from_json) if caddy_proxy_state_stat.stat.exists else {} }}"

        - name: Reject non-Caddy managed proxy state
          fail:
            msg: "Existing managed proxy state does not belong to caddy; refusing to switch engines"
          when:
            - caddy_proxy_state_stat.stat.exists
            - (caddy_proxy_state.engine | default('')) != 'caddy'

        - name: Check for existing managed Nginx proxy state
          stat:
            path: "{{ nginx_proxy_state_file }}"
          register: nginx_proxy_state_stat

        - name: Reject managed Nginx engine switching
          fail:
            msg: "Server is already managed by Nginx; switching to caddy is not supported in Slice C"
          when:
            - not caddy_proxy_state_stat.stat.exists
            - nginx_proxy_state_stat.stat.exists

        - name: Inspect existing Traefik container state
          shell: |
            python3 - <<'PY'
            import json
            import subprocess

            inspect = subprocess.run(
                ["docker", "inspect", "traefik"],
                capture_output=True,
                text=True,
            )
            if inspect.returncode != 0:
                print(json.dumps({"exists": False, "managed_traefik": False}))
                raise SystemExit(0)

            try:
                payload = json.loads(inspect.stdout)
            except json.JSONDecodeError:
                print(json.dumps({"exists": True, "managed_traefik": False}))
                raise SystemExit(0)

            container = payload[0] if payload else {}
            labels = ((container.get("Config") or {}).get("Labels") or {})
            managed = (
                labels.get("com.opsctl.managed") == "true"
                and labels.get("com.opsctl.component") == "traefik_gateway"
            )
            print(json.dumps({"exists": True, "managed_traefik": managed}))
            PY
          args:
            executable: /bin/bash
          register: traefik_proxy_state
          changed_when: false

        - name: Parse existing Traefik container state
          set_fact:
            traefik_proxy_state_json: "{{ traefik_proxy_state.stdout | from_json }}"

        - name: Reject managed Traefik engine switching
          fail:
            msg: "Server is already managed by Traefik; switching to caddy is not supported in Slice C"
          when:
            - traefik_proxy_state_json.managed_traefik | default(false)

        - name: Detect existing listeners on ports 80 and 443
          shell: |
            ss -H -ltn '( sport = :80 or sport = :443 )' || true
          args:
            executable: /bin/sh
          register: caddy_listener_check
          changed_when: false

        - name: Reject unmanaged listeners on ports 80 and 443
          fail:
            msg: "Detected existing unmanaged listener on port 80 or 443; refusing to replace it"
          when:
            - not caddy_proxy_state_stat.stat.exists
            - (caddy_listener_check.stdout | trim | length) > 0

        - name: OPERATION_STEP caddy:packages
          shell: |
            printf 'OPERATION_STEP={"name":"caddy:packages","status":"running","metadata":{"display_name":"Install Caddy packages"}}\n'
          args:
            executable: /bin/sh

        - name: Ensure official Caddy repository prerequisites
          apt:
            name:
              - apt-transport-https
              - ca-certificates
              - debian-archive-keyring
              - debian-keyring
              - gnupg
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Fetch official stable Caddy signing key
          get_url:
            url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
            dest: /usr/share/keyrings/caddy-stable-archive-keyring.asc
            owner: root
            group: root
            mode: "0644"
          register: caddy_stable_key_fetch

        - name: Inspect official stable Caddy keyring
          stat:
            path: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          register: caddy_stable_keyring_stat

        - name: Install official stable Caddy keyring
          command:
            argv:
              - gpg
              - --batch
              - --yes
              - --dearmor
              - --output
              - /usr/share/keyrings/caddy-stable-archive-keyring.gpg
              - /usr/share/keyrings/caddy-stable-archive-keyring.asc
          when: caddy_stable_key_fetch.changed or not caddy_stable_keyring_stat.stat.exists
          register: caddy_stable_keyring_install

        - name: Keep official stable Caddy keyring readable by APT
          file:
            path: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
            state: file
            owner: root
            group: root
            mode: "0644"

        - name: Fetch official stable Caddy APT source
          get_url:
            url: https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt
            dest: /etc/apt/sources.list.d/caddy-stable.list
            owner: root
            group: root
            mode: "0644"
          register: caddy_stable_source_fetch

        - name: Read official stable Caddy APT source
          slurp:
            path: /etc/apt/sources.list.d/caddy-stable.list
          register: caddy_stable_source_raw

        - name: Require signed official stable Caddy APT source
          assert:
            that:
              - >-
                ((caddy_stable_source_raw.content | b64decode).splitlines()
                | select('match', '^deb(?:-src)? ') | list) == [
                  'deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main',
                  'deb-src [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main'
                ]
            fail_msg: "Official stable Caddy APT source is invalid"

        - name: Refresh APT metadata for official stable Caddy source
          apt:
            update_cache: true
            cache_valid_time: "{{ 0 if (caddy_stable_source_fetch.changed or caddy_stable_keyring_install.changed) else 3600 }}"

        - name: Inspect selected Caddy package candidate
          command: apt-cache policy caddy
          register: caddy_stable_policy
          changed_when: false

        - name: Require a selected Caddy package candidate
          assert:
            that:
              - caddy_stable_policy.stdout is search('(?m)^\s*Candidate:\s*\S+')
              - caddy_stable_policy.stdout is not search('(?m)^\s*Candidate:\s*\(none\)')
            fail_msg: "Official stable Caddy package candidate is unavailable"

        - name: Bind selected Caddy package candidate
          set_fact:
            caddy_stable_candidate: "{{ caddy_stable_policy.stdout | regex_findall('(?m)^\\s*Candidate:\\s*(\\S+)') | first }}"

        - name: Require selected candidate from signed official stable source
          assert:
            that:
              - >-
                caddy_stable_policy.stdout is search(
                  '(?m)^\s+(?:\*\*\*\s+)?'
                  ~ (caddy_stable_candidate | regex_escape)
                  ~ '\s+\d+\n\s+\d+ https://dl\.cloudsmith\.io/public/caddy/stable/deb/debian\s+'
                )
            fail_msg: "Selected Caddy package is not from the official stable source"

        - name: Require a valid Caddy package candidate version
          assert:
            that:
              - caddy_stable_candidate is match('^[0-9]+\.[0-9]+\.[0-9]+$')
            fail_msg: "Official stable Caddy candidate version is invalid"

        - name: Bind Caddy package candidate version
          set_fact:
            caddy_stable_candidate_semver: "{{ caddy_stable_candidate.split('.') | map('int') | list }}"

        - name: Require supported Caddy package candidate
          assert:
            that:
              - caddy_stable_candidate_semver[0] == 2
              - caddy_stable_candidate_semver >= [2, 11, 1]
            fail_msg: "Official stable Caddy candidate must be version 2.11.1 or later in the 2.x series"

        - name: Ensure Caddy package present
          apt:
            name: caddy
            state: latest
            policy_rc_d: 101

        - name: Read installed Caddy version
          command: caddy version
          register: caddy_installed_version
          changed_when: false

        - name: Require a valid installed Caddy semantic version
          assert:
            that:
              - caddy_installed_version.stdout is match('^v?[0-9]+\.[0-9]+\.[0-9]+(?:\s|$)')
            fail_msg: "Installed Caddy version is invalid"

        - name: Bind installed Caddy semantic version
          set_fact:
            caddy_installed_semver: >-
              {{ (caddy_installed_version.stdout
                  | regex_search('^v?[0-9]+\.[0-9]+\.[0-9]+')
                  | regex_replace('^v', '')).split('.') | map('int') | list }}

        - name: Require supported Caddy version
          assert:
            that:
              - caddy_installed_semver[0] == 2
              - caddy_installed_semver >= [2, 11, 1]
            fail_msg: "Installed Caddy version must be 2.11.1 or later in the 2.x series"

        - name: Resolve canonical Caddy service group
          command: systemctl show --property=Group --value caddy.service
          register: caddy_service_group_result
          changed_when: false

        - name: Validate canonical Caddy service group
          assert:
            that:
              - (caddy_service_group_result.stdout | trim | length) > 0
            fail_msg: "Caddy service group is unavailable"

        - name: Resolve canonical Caddy service group account
          getent:
            database: group
            key: "{{ caddy_service_group_result.stdout | trim }}"

        - name: Ensure Caddy route directory exists
          file:
            path: "{{ caddy_route_dir }}"
            state: directory
            mode: "0755"

        - name: Ensure private Caddy certificate directory exists
          file:
            path: "{{ caddy_certificate_dir }}"
            state: directory
            owner: root
            group: "{{ caddy_service_group_result.stdout | trim }}"
            mode: "0710"

        - name: Verify private Caddy certificate directory contract
          stat:
            path: "{{ caddy_certificate_dir }}"
          register: caddy_certificate_dir_stat

        - name: Require private Caddy certificate directory contract
          assert:
            that:
              - caddy_certificate_dir_stat.stat.isdir
              - not caddy_certificate_dir_stat.stat.islnk
              - caddy_certificate_dir_stat.stat.pw_name == 'root'
              - caddy_certificate_dir_stat.stat.gr_name == (caddy_service_group_result.stdout | trim)
              - caddy_certificate_dir_stat.stat.mode == '0710'
            fail_msg: "Caddy certificate directory contract is invalid"

        - name: Write canonical Caddy configuration
          copy:
            dest: "{{ caddy_config_file }}"
            mode: "0644"
            content: |
              {
                email {{ caddy_acme_email }}
              {% if (caddy_acme_server | default('staging')) == 'staging' %}
                acme_ca {{ caddy_acme_staging_url }}
              {% endif %}
              }

              import {{ caddy_route_dir }}/*.caddy

        - name: Persist managed Caddy proxy state
          copy:
            dest: "{{ caddy_proxy_state_file }}"
            mode: "0644"
            content: |
              {
                "engine": "caddy",
                "managed": true,
                "org_id": "{{ org_id }}",
                "email": "{{ caddy_acme_email }}",
                "acme_server": "{{ caddy_acme_server | default('staging') }}"
              }

        - name: Validate Caddy configuration
          command: caddy validate --config "{{ caddy_config_file }}" --adapter caddyfile
          changed_when: false

        - name: Restart Caddy after validated config/state update
          service:
            name: caddy
            state: restarted
            enabled: true

        - name: OPERATION_STEP caddy:packages complete
          shell: |
            printf 'OPERATION_STEP={"name":"caddy:packages","status":"completed","metadata":{"display_name":"Install Caddy packages"}}\n'
          args:
            executable: /bin/sh

        - name: OPERATION_STEP caddy:ready
          shell: |
            printf 'OPERATION_STEP={"name":"caddy:ready","status":"completed","metadata":{"display_name":"Verify Caddy proxy"}}\n'
          args:
            executable: /bin/sh

        - name: OPERATION_STEP caddy:complete
          shell: |
            printf 'OPERATION_STEP={"name":"caddy:complete","status":"completed","metadata":{"display_name":"Caddy proxy ready"}}\n'
          args:
            executable: /bin/sh
      rescue:
        - name: OPERATION_STEP caddy:failure
          shell: |
            printf 'OPERATION_STEP={"name":"caddy:failure","status":"failed","metadata":{"display_name":"Caddy proxy failed"}}\n'
          args:
            executable: /bin/sh

        - name: Fail Caddy proxy converge
          fail:
            msg: "Caddy proxy converge failed"
