---
- name: Prepare and observe one admitted user-owned Ansible controller
  hosts: all
  gather_facts: false
  become: true
  module_defaults:
    group/community.docker.docker:
      docker_host: unix:///var/run/docker.sock
      api_version: auto
      tls: false
      validate_certs: false
      timeout: 10
  vars:
    controller_uuid_pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    controller_control_characters: "[\\x00-\\x1f\\x7f]"
  tasks:
    - name: Initialize safe execution and closure facts
      ansible.builtin.set_fact:
        controller_outcome: refused
        controller_reason: invalid_inputs
        controller_original_reason: null
        controller_container_id: null
        controller_exit_code: null
        controller_timed_out: false
        controller_process_closed: false
        controller_material_cleanup: not_allocated
        controller_network_cleanup: not_allocated
        controller_deadline_cleanup: not_allocated
        controller_logs: ''
        controller_logs_truncated: false
        controller_safe_operation_id: null
        controller_safe_server_id: null
        controller_route_qualified: false
        controller_writer_closed: false
        controller_execution_known: false

    - name: Publish controller preparation progress
      ansible.builtin.debug:
        msg: 'OPERATION_STEP={"name":"template:controller","status":"running","metadata":{"display_name":"Prepare user Ansible controller"}}'

    - name: Qualify one carrier and the existing root management session before allocation
      block:
        - name: Require one authorized inventory host and exactly one invocation alternative
          ansible.builtin.assert:
            that:
              - ansible_play_hosts_all | length == 1
              - (template_execution is defined) != (template_execution_recovery is defined)

        - name: Select root management refusal before any target change
          ansible.builtin.set_fact:
            controller_reason: unsupported_profile

        - name: Read the authorized SSH context UID without escalation
          ansible.builtin.command:
            argv: [id, -u]
            expand_argument_vars: false
          become: false
          changed_when: false
          register: controller_management_uid

        - name: Require native management root rather than privilege escalation
          ansible.builtin.assert:
            that: controller_management_uid.stdout == '0'

        - name: Retain the qualified routing boundary
          ansible.builtin.set_fact:
            controller_route_qualified: true
      rescue:
        - name: Retain safe preallocation refusal
          ansible.builtin.set_fact:
            controller_original_reason: "{{ controller_reason }}"
      no_log: true

    - name: Prepare run and observe the frozen invocation
      block:
        - name: Require exactly the frozen internal carrier fields
          ansible.builtin.assert:
            that:
              - ansible_play_hosts_all | length == 1
              - template_execution is mapping
              - template_execution.keys() | list | sort(case_sensitive=true) == ['controller_server_id', 'entrypoint', 'gid', 'image', 'input_digest', 'limits', 'operation_id', 'source_digest', 'staging_directory', 'supplied_files', 'targets', 'uid']
              - template_execution.operation_id is string
              - template_execution.operation_id is regex(controller_uuid_pattern, match_type='fullmatch')
              - template_execution.controller_server_id is string
              - template_execution.controller_server_id is regex(controller_uuid_pattern, match_type='fullmatch')
              - template_execution.source_digest is string
              - template_execution.source_digest is regex('[0-9a-f]{64}', match_type='fullmatch')
              - template_execution.input_digest is string
              - template_execution.input_digest is regex('[0-9a-f]{64}', match_type='fullmatch')
              - template_execution.image is string
              - template_execution.image is regex('[a-zA-Z0-9][a-zA-Z0-9._:/-]*@sha256:[0-9a-f]{64}', match_type='fullmatch')
              - template_execution.uid is integer and template_execution.uid is not boolean
              - template_execution.uid > 0 and template_execution.uid <= 2147483647
              - template_execution.gid is integer and template_execution.gid is not boolean
              - template_execution.gid > 0 and template_execution.gid <= 2147483647
              - template_execution.limits is mapping
              - template_execution.limits.keys() | list | sort(case_sensitive=true) == ['cpu_millicores', 'log_bytes', 'memory_mib', 'pids', 'timeout_seconds', 'tmpfs_mib']
              - template_execution.targets | type_debug == 'list'
              - template_execution.targets | length >= 1 and template_execution.targets | length <= 32

        - name: Require strict bounded numeric limits
          ansible.builtin.assert:
            that:
              - template_execution.limits[item.key] is integer
              - template_execution.limits[item.key] is not boolean
              - template_execution.limits[item.key] >= item.minimum
              - template_execution.limits[item.key] <= item.maximum
          loop:
            - {key: timeout_seconds, minimum: 1, maximum: 900}
            - {key: cpu_millicores, minimum: 100, maximum: 1000}
            - {key: memory_mib, minimum: 64, maximum: 512}
            - {key: tmpfs_mib, minimum: 1, maximum: 64}
            - {key: pids, minimum: 1, maximum: 128}
            - {key: log_bytes, minimum: 1, maximum: 65536}

        - name: Require exact safe target facts from central preparation
          ansible.builtin.assert:
            that:
              - item is mapping
              - item.keys() | list | sort(case_sensitive=true) == ['address', 'credential_file', 'credential_secret_id', 'credential_version', 'host_public_key', 'port', 'server_id', 'ssh_access_key_id', 'username']
              - item.server_id is string and item.server_id is regex(controller_uuid_pattern, match_type='fullmatch')
              - item.server_id != template_execution.controller_server_id
              - item.ssh_access_key_id is string and item.ssh_access_key_id is regex(controller_uuid_pattern, match_type='fullmatch')
              - item.credential_secret_id is string and item.credential_secret_id is regex(controller_uuid_pattern, match_type='fullmatch')
              - item.credential_version is integer and item.credential_version is not boolean and item.credential_version > 0
              - item.port is integer and item.port is not boolean and item.port == 22
              - item.address is string and item.address is regex('([0-9]{1,3}\\.){3}[0-9]{1,3}', match_type='fullmatch')
              - item.address.split('.') | map('int') | max <= 255
              - item.address.split('.') | map('int') | join('.') == item.address
              - item.address.split('.')[0] | int > 0 and item.address.split('.')[0] | int < 224
              - item.address.split('.')[0] != '127'
              - item.username is string and item.username is regex('[a-z_][a-z0-9_-]{0,31}', match_type='fullmatch')
              - item.host_public_key is string and item.host_public_key is regex('(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)) [A-Za-z0-9+/]+={0,2}', match_type='fullmatch')
              - item.credential_file is string and item.credential_file is regex('[A-Za-z0-9][A-Za-z0-9_.-]{0,127}', match_type='fullmatch')
              - item.credential_file not in ['inventory.json', 'known_hosts', 'ansible.cfg', 'template-inputs.json', 'inputs.json']
          loop: "{{ template_execution.targets }}"
          no_log: true

        - name: Refuse duplicate target identities or endpoints
          ansible.builtin.assert:
            that:
              - template_execution.targets | map(attribute='server_id') | unique(case_sensitive=true) | length == template_execution.targets | length
              - template_execution.targets | map(attribute='address') | unique(case_sensitive=true) | length == template_execution.targets | length

        - name: Retain only validated public identity
          ansible.builtin.set_fact:
            controller_safe_operation_id: "{{ template_execution.operation_id }}"
            controller_safe_server_id: "{{ template_execution.controller_server_id }}"

        - name: Prepare the native controller and frozen material
          ansible.builtin.include_tasks: ../tasks/user_ansible_controller_prepare.yml

        - name: Observe the exact detached invocation until terminal or its host deadline
          community.docker.docker_container_info:
            name: "{{ controller_container_id }}"
          register: controller_terminal
          until: >-
            controller_terminal.exists and
            controller_terminal.container.Id == controller_container_id and
            not controller_terminal.container.State.Running and
            controller_terminal.container.State.Pid == 0
          retries: "{{ template_execution.limits.timeout_seconds + 35 }}"
          delay: 1
          no_log: true

        - name: Observe serialized original closure before classifying terminal execution
          ansible.builtin.command:
            argv: [/bin/sh, "{{ controller_record }}/close.sh", "{{ controller_record }}", "{{ controller_cleanup_operation }}", normal]
            expand_argument_vars: false
          register: controller_original_closure
          no_log: true

        - name: Require the exact helper closure decision rather than timer activation
          ansible.builtin.assert:
            that:
              - controller_original_closure.rc == 0
              - controller_original_closure.stdout is regex('process_closed:(normal|deadline|exited|absent):(stopped|absent)', match_type='fullmatch')

        - name: Retain actual exit status independently of logs
          ansible.builtin.set_fact:
            controller_exit_code: "{{ controller_terminal.container.State.ExitCode }}"
            controller_process_closed: true
            controller_timed_out: "{{ controller_original_closure.stdout.split(':')[1] == 'deadline' }}"
            controller_reason: >-
              {{ 'deadline_expired' if controller_original_closure.stdout.split(':')[1] == 'deadline'
              else ('exited' if controller_terminal.container.State.ExitCode == 0 else 'execution_failed') }}
            controller_outcome: >-
              {{ 'timed_out' if controller_original_closure.stdout.split(':')[1] == 'deadline'
              else ('succeeded' if controller_terminal.container.State.ExitCode == 0 else 'failed') }}
            controller_execution_known: true

        - name: Retain journal generation before ordinary outcome persistence
          ansible.builtin.set_fact:
            controller_original_journal_expected: "{{ controller_journal | to_json | hash('sha256') }}"

        - name: Freeze the observed ordinary outcome before settlement
          ansible.builtin.set_fact:
            controller_journal: >-
              {{ controller_journal | combine({'outcome': controller_outcome,
              'reason': controller_reason, 'exit_code': controller_exit_code,
              'timed_out': controller_timed_out}) }}

        - name: Persist known original execution without overwriting concurrent settlement
          ansible.builtin.shell: |
            exec timeout -k 2 15 /bin/sh <<'OPSCTL_OUTCOME'
            set -eu
            umask 077
            test -d "$RECORD" && test ! -L "$RECORD"
            test "$(stat -c '%u:%a:%d:%i' "$RECORD")" = "0:700:$DEVICE:$INODE"
            test ! -L "$RECORD/lock"
            exec 8>"$RECORD/lock"
            flock -x -w 5 8
            test -f "$RECORD/writer-closed" && test ! -L "$RECORD/writer-closed"
            test "$(stat -c '%u:%a' "$RECORD/writer-closed")" = 0:600
            test -f "$RECORD/journal.json" && test ! -L "$RECORD/journal.json"
            test "$(stat -c '%u:%a' "$RECORD/journal.json")" = 0:600
            actual=$(sha256sum "$RECORD/journal.json")
            test "${actual%% *}" = "$EXPECTED"
            pending=$(mktemp "$RECORD/journal.XXXXXXXX")
            trap 'rm -f -- "$pending"' EXIT HUP INT TERM
            printf '%s' "$JOURNAL" >"$pending"
            mv -- "$pending" "$RECORD/journal.json"
            OPSCTL_OUTCOME
          args:
            executable: /bin/sh
          environment:
            PATH: /usr/sbin:/usr/bin:/sbin:/bin
            RECORD: "{{ controller_record }}"
            DEVICE: "{{ controller_record_identity.stat.dev | string }}"
            INODE: "{{ controller_record_identity.stat.inode | string }}"
            EXPECTED: "{{ controller_original_journal_expected }}"
            JOURNAL: "{{ controller_journal | to_json }}"
          diff: false
      rescue:
        - name: Preserve the original finite reason without raw exception output
          ansible.builtin.set_fact:
            controller_original_reason: "{{ controller_reason }}"
            controller_outcome: "{{ controller_outcome if controller_execution_known else ('unknown' if controller_reason == 'execution_unknown' else 'refused') }}"
      always:
        - name: Settle only this invocation's native liabilities
          ansible.builtin.include_tasks: ../tasks/user_ansible_controller_cleanup.yml
      no_log: true
      when:
        - controller_route_qualified
        - template_execution is defined

    - name: Observe or settle only the exact original recorded invocation
      ansible.builtin.include_tasks: ../tasks/user_ansible_controller_recover.yml
      when:
        - controller_route_qualified
        - template_execution_recovery is defined

    - name: Publish safe terminal progress
      ansible.builtin.debug:
        msg: >-
          OPERATION_STEP={{ {'name': 'template:controller', 'status':
          'completed' if controller_outcome == 'succeeded' else 'failed',
          'metadata': {'display_name': 'User Ansible controller', 'reason': controller_reason}} | to_json }}

    - name: Publish one documented execution result
      ansible.builtin.debug:
        msg: >-
          TEMPLATE_OUTPUT_JSON={{ {'template_execution_result': {
          'operation_id': controller_safe_operation_id,
          'controller_server_id': controller_safe_server_id,
          'outcome': controller_outcome, 'reason': controller_reason,
          'original_reason': controller_original_reason, 'container_id': controller_container_id,
          'exit_code': controller_exit_code, 'timed_out': controller_timed_out,
          'process_closed': controller_process_closed,
          'material_cleanup': controller_material_cleanup, 'network_cleanup': controller_network_cleanup,
          'deadline_cleanup': controller_deadline_cleanup, 'logs': controller_logs,
          'logs_truncated': controller_logs_truncated}} | to_json }}

    - name: Fail without echoing private native diagnostics
      ansible.builtin.fail:
        msg: "User Ansible controller did not succeed: {{ controller_reason }}"
      when: >-
        controller_outcome != 'succeeded' or controller_reason in ['cleanup_failed', 'log_collection_failed'] or
        'retained' in [controller_material_cleanup, controller_network_cleanup, controller_deadline_cleanup]
