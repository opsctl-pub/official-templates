- name: Attach deployment backends through managed Traefik
  hosts: all
  gather_facts: false
  become: true
  vars:
    traefik_dynamic_dir: "/etc/traefik/dynamic/opsctl"
    short_deployment_id: "{{ (deployment_id | string | regex_replace('-', ''))[:8] }}"
    wireguard_interface_name: "wg-{{ short_deployment_id }}"
    wireguard_private_key_path: "/etc/wireguard/{{ wireguard_interface_name }}.key"
    wireguard_config_path: "/etc/wireguard/{{ wireguard_interface_name }}.conf"
    wireguard_service_name: "wg-quick@{{ wireguard_interface_name }}"
    route_file_path: "{{ traefik_dynamic_dir }}/deployment-{{ deployment_id }}.yml"
    gateway_wireguard_address: "{{ gateway_wireguard_ip if ('/' in (gateway_wireguard_ip | string)) else (gateway_wireguard_ip ~ '/' ~ (overlay_cidr | regex_replace('^.*/', ''))) }}"
    effective_route_hosts: "{{ route_hosts | default(([route_host] if (route_host is defined and (route_host | string | length) > 0) else []), true) }}"
  pre_tasks:
    - name: Validate exact attach contract before any host access
      assert:
        that:
          - deployment_id is defined
          - deployment_id is string
          - deployment_id is match('^[0-9a-fA-F-]{36}$')
          - server_id is defined
          - server_id is string
          - server_id is match('^[0-9a-fA-F-]{36}$')
          - overlay_cidr is defined
          - overlay_cidr is string
          - overlay_cidr is match('^[0-9a-fA-F:.]+/[0-9]+$')
          - gateway_wireguard_ip is defined
          - gateway_wireguard_ip is string
          - gateway_wireguard_ip is match('^[0-9a-fA-F:.]+$')
          - wireguard_peers is defined
          - wireguard_peers is sequence
          - wireguard_peers is not string
          - route_port is defined
          - route_port is number
          - route_port | int >= 1
          - route_port | int <= 65535
          - effective_route_hosts is sequence
          - effective_route_hosts is not string
          - effective_route_hosts | length > 0
          - route_https is defined
          - route_https is boolean
          - route_middlewares is defined
          - route_middlewares is sequence
          - route_middlewares is not string
          - traefik_backends is defined
          - traefik_backends is sequence
          - traefik_backends is not string
          - traefik_backends | length > 0
        fail_msg: "Traefik attach contract is incomplete or malformed"
    - name: Validate exact attach route hosts
      assert:
        that:
          - item is string
          - item | length > 0
        fail_msg: "Traefik attach route host is invalid"
      loop: "{{ effective_route_hosts }}"
    - name: Validate exact attach WireGuard peers
      assert:
        that:
          - item is mapping
          - item.public_key is defined
          - item.public_key is string
          - item.public_key | length > 0
          - item.allowed_ips is defined
          - item.allowed_ips is string
          - item.allowed_ips | length > 0
          - item.endpoint is defined
          - item.endpoint is string
          - item.endpoint | length > 0
          - item.persistent_keepalive is defined
          - item.persistent_keepalive is number
        fail_msg: "Traefik attach WireGuard peer is invalid"
      loop: "{{ wireguard_peers }}"
    - name: Validate exact attach backends
      assert:
        that:
          - item is mapping
          - item.url is defined
          - item.url is string
          - item.url is match('^http://[^:/?#]+:[0-9]+/?$')
        fail_msg: "Traefik attach backend is invalid"
      loop: "{{ traefik_backends }}"
    - name: Skip attach when running in simulate mode
      meta: end_play
      when: simulate | default(false)

  tasks:
    - name: Attach deployment backends
      block:
        - name: OPERATION_STEP attach:start
          shell: |
            printf 'OPERATION_STEP={"name":"attach:start","status":"running","metadata":{"display_name":"Attach load balancer backends","deployment_id":"%s","route_hosts":%s}}\n' "{{ deployment_id }}" '{{ effective_route_hosts | to_json }}'
          args:
            executable: /bin/sh

        - name: Ensure Traefik dynamic directory exists
          file:
            path: "{{ traefik_dynamic_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Read gateway private key
          command: "cat {{ wireguard_private_key_path }}"
          register: gateway_private_key_result
          changed_when: false
          no_log: true

        - name: Update gateway WireGuard config
          copy:
            dest: "{{ wireguard_config_path }}"
            owner: root
            group: root
            mode: "0600"
            content: |
              [Interface]
              Address = {{ gateway_wireguard_address }}
              ListenPort = 51820
              PrivateKey = {{ gateway_private_key_result.stdout | trim }}
              PostUp = iptables -C INPUT -p udp --dport 51820 -j ACCEPT || iptables -I INPUT -p udp --dport 51820 -j ACCEPT
              PostDown = iptables -D INPUT -p udp --dport 51820 -j ACCEPT || true
              {% for peer in wireguard_peers | default([]) %}

              [Peer]
              PublicKey = {{ peer.public_key }}
              AllowedIPs = {{ peer.allowed_ips }}
              {% if peer.endpoint is defined and peer.endpoint %}
              Endpoint = {{ peer.endpoint }}
              {% endif %}
              {% if peer.persistent_keepalive is defined and peer.persistent_keepalive %}
              PersistentKeepalive = {{ peer.persistent_keepalive }}
              {% endif %}
              {% endfor %}
          no_log: true
          register: gateway_wireguard_config_write

        - name: Restart gateway WireGuard service when peers changed
          systemd:
            name: "{{ wireguard_service_name }}"
            enabled: true
            state: restarted
          when: gateway_wireguard_config_write.changed

        - name: Render deterministic deployment route file
          template:
            src: "{{ playbook_dir }}/../templates/traefik_deployment_route.yml.j2"
            dest: "{{ route_file_path }}"
            owner: root
            group: root
            mode: "0644"

        - name: Verify route file exists
          stat:
            path: "{{ route_file_path }}"
          register: route_file_stat

        - name: Assert route file rendered
          assert:
            that:
              - route_file_stat.stat.exists
            fail_msg: "Traefik route file was not written"

        - name: OPERATION_STEP attach:ready
          shell: |
            printf 'OPERATION_STEP={"name":"attach:ready","status":"completed","metadata":{"display_name":"Verify backend attachment","deployment_id":"%s","backend_count":%s}}\n' "{{ deployment_id }}" "{{ traefik_backends | length }}"
          args:
            executable: /bin/sh

        - name: OPERATION_STEP attach:complete
          shell: |
            printf 'OPERATION_STEP={"name":"attach:complete","status":"completed","metadata":{"display_name":"Backends attached","deployment_id":"%s","backend_count":%s}}\n' "{{ deployment_id }}" "{{ traefik_backends | length }}"
          args:
            executable: /bin/sh
      rescue:
        - name: OPERATION_STEP attach:failure
          shell: |
            printf 'OPERATION_STEP={"name":"attach:failure","status":"failed","metadata":{"display_name":"Backend attachment failed","deployment_id":"%s"}}\n' "{{ deployment_id }}"
          args:
            executable: /bin/sh

        - name: Fail attach operation
          fail:
            msg: "Traefik backend attach failed"
