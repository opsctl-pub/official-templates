---
- name: Apply one Cloudflare managed DNS change
  block:
    - name: Read the exact provider record before confirmed external delete
      uri:
        url: "{{ cloudflare_api_base }}/zones/{{ provider_zone_id }}/dns_records/{{ dns_change.provider_record_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
          Content-Type: "application/json"
        status_code: 200
        return_content: true
      register: dns_sync_compare_result
      no_log: true
      when:
        - dns_change.action == 'delete'
        - compare_before_apply | default(false) | bool

    - name: Assert the exact provider record still matches the confirmed plan
      assert:
        that:
          - dns_sync_compare_result.json.success | default(false)
          - dns_sync_compare_result.json.result is defined
          - dns_sync_compare_result.json.result.id == dns_change.provider_record_id
          - dns_sync_compare_result.json.result.name == dns_change.hostname
          - (dns_sync_compare_result.json.result.type | string | upper) == (dns_change.record_type | string | upper)
          - dns_sync_compare_result.json.result.content == dns_change.value
          - (dns_sync_compare_result.json.result.ttl | int) == (dns_change.ttl | int)
          - (dns_sync_compare_result.json.result.proxied | bool) == (dns_change.proxied | bool)
        fail_msg: "Confirmed external DNS record changed or is missing"
      when:
        - dns_change.action == 'delete'
        - compare_before_apply | default(false) | bool

    - name: Read the exact provider record before adoption
      uri:
        url: "{{ cloudflare_api_base }}/zones/{{ provider_zone_id }}/dns_records/{{ dns_change.provider_record_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
          Content-Type: "application/json"
        status_code: 200
        return_content: true
      register: dns_sync_adopt_result
      no_log: true
      when: dns_change.action == 'adopt'

    - name: Assert the exact provider record still matches the adoption plan
      assert:
        that:
          - dns_sync_adopt_result.json.success | default(false)
          - dns_sync_adopt_result.json.result is defined
          - dns_sync_adopt_result.json.result.id == dns_change.provider_record_id
          - dns_sync_adopt_result.json.result.name == dns_change.hostname
          - (dns_sync_adopt_result.json.result.type | string | upper) == (dns_change.record_type | string | upper)
          - dns_sync_adopt_result.json.result.content == dns_change.value
          - (dns_sync_adopt_result.json.result.ttl | int) == (dns_change.ttl | int)
          - (dns_sync_adopt_result.json.result.proxied | bool) == (dns_change.proxied | bool)
        fail_msg: "Adopted external DNS record changed or is missing"
      when: dns_change.action == 'adopt'

    - name: Accumulate the adopted managed DNS change
      set_fact:
        dns_sync_applied_changes: >-
          {{
            dns_sync_applied_changes + [
              {
                "change_id": dns_change.change_id,
                "action": dns_change.action,
                "hostname": dns_change.hostname,
                "record_type": dns_change.record_type,
                "value": dns_change.value,
                "ttl": dns_change.ttl,
                "proxied": false,
                "provider_record_id": dns_change.provider_record_id,
                "deployment_id": dns_change.deployment_id,
                "tracked_record_id": dns_change.tracked_record_id | default(None)
              }
            ]
          }}
      when: dns_change.action == 'adopt'

    - name: Apply one Cloudflare managed DNS change
      uri:
        url: >-
          {{
            cloudflare_api_base ~ '/zones/' ~ provider_zone_id ~ '/dns_records'
            if dns_change.action == 'create'
            else cloudflare_api_base ~ '/zones/' ~ provider_zone_id ~ '/dns_records/' ~ dns_change.provider_record_id
          }}
        method: "{{ {'create': 'POST', 'update': 'PUT', 'delete': 'DELETE'}[dns_change.action] }}"
        headers:
          Authorization: "Bearer {{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
          Content-Type: "application/json"
        body_format: json
        body: >-
          {{
            omit
            if dns_change.action == 'delete'
            else {
              'type': 'A',
              'name': dns_change.hostname,
              'content': dns_change.value,
              'ttl': dns_change.ttl,
              'proxied': dns_change.proxied
            }
          }}
        status_code: 200
        return_content: true
      register: dns_sync_apply_result
      no_log: true
      when: dns_change.action != 'adopt'

    - name: Assert the Cloudflare change succeeded
      assert:
        that:
          - dns_sync_apply_result.json.success | default(false)
        fail_msg: >-
          {{
            (
              dns_sync_apply_result.json.errors[0].message
              if (
                dns_sync_apply_result.json.errors is defined and
                (dns_sync_apply_result.json.errors | length) > 0 and
                dns_sync_apply_result.json.errors[0].message is defined
              )
              else 'Cloudflare request failed'
            )
          }}
      when: dns_change.action != 'adopt'

    - name: Verify the provider returned the planned record
      assert:
        that:
          - dns_sync_apply_result.json.result is mapping
          - dns_sync_apply_result.json.result.name == dns_change.hostname
          - dns_sync_apply_result.json.result.type == dns_change.record_type
          - dns_sync_apply_result.json.result.content == dns_change.value
          - dns_sync_apply_result.json.result.ttl == dns_change.ttl
          - dns_sync_apply_result.json.result.proxied is boolean
          - dns_sync_apply_result.json.result.proxied == dns_change.proxied
          - dns_change.action == 'create' or dns_sync_apply_result.json.result.id == dns_change.provider_record_id
        fail_msg: "Cloudflare record does not match the managed DNS plan"
      when: dns_change.action in ['create', 'update']

    - name: Accumulate the applied managed DNS change
      set_fact:
        dns_sync_applied_changes: >-
          {{
            dns_sync_applied_changes + [
              {
                "change_id": dns_change.change_id,
                "action": dns_change.action,
                "hostname": dns_change.hostname,
                "record_type": dns_change.record_type,
                "value": dns_change.value,
                "ttl": dns_change.ttl,
                "proxied": dns_change.proxied,
                "provider_record_id": (
                  dns_sync_apply_result.json.result.id
                  if (
                    dns_sync_apply_result.json.result is defined and
                    dns_sync_apply_result.json.result.id is defined
                  )
                  else dns_change.provider_record_id
                ),
                "deployment_id": dns_change.deployment_id | default(None),
                "tracked_record_id": dns_change.tracked_record_id | default(None)
              }
            ]
          }}
      when: dns_change.action != 'adopt'

    - name: Emit cumulative structured DNS sync outputs
      debug:
        msg: >-
          TEMPLATE_OUTPUT_JSON={{ {'applied_changes': dns_sync_applied_changes} | to_json }}
