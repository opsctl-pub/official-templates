---
- name: Converge canonical managed Traefik reverse proxy
  hosts: all
  gather_facts: false
  become: true
  vars:
    traefik_container_name: "traefik"
    traefik_dashboard_router: "traefik-dashboard"
    traefik_image: "traefik:2.11"
    traefik_dynamic_dir: "/etc/traefik/dynamic/opsctl"
    traefik_acme_dir: "/var/lib/traefik"
    acme_staging_url: "https://acme-staging-v02.api.letsencrypt.org/directory"
  pre_tasks:
    - name: Skip Traefik proxy when running in simulate mode
      meta: end_play
      when: simulate | default(false)
  tasks:
    - name: OPERATION_STEP traefik:start
      shell: |
        printf 'OPERATION_STEP={"name":"traefik:start","status":"running","metadata":{"display_name":"Configure Traefik proxy"}}\n'
      args:
        executable: /bin/sh
    - name: Converge managed Traefik proxy
      block:
        - name: Validate required organization context
          assert:
            that:
              - org_id is defined
              - (org_id | string | length) > 0
            fail_msg: "org_id is required to manage the Traefik proxy"

        - name: Ensure Docker packages present
          apt:
            name:
              - docker.io
            state: present
            update_cache: true

        - name: Ensure Docker service running
          service:
            name: docker
            state: started
            enabled: true

        - name: Ensure Traefik dynamic config directory exists
          file:
            path: "{{ traefik_dynamic_dir }}"
            state: directory
            mode: "0755"

        - name: Ensure Traefik storage directory exists
          file:
            path: "{{ traefik_acme_dir }}"
            state: directory
            mode: "0755"

        - name: Ensure Traefik ACME file exists
          file:
            path: "{{ traefik_acme_dir }}/acme.json"
            state: touch
            mode: "0600"

        - name: Inspect existing Traefik container
          community.docker.docker_container_info:
            name: "{{ traefik_container_name }}"
          register: traefik_container_info

        - name: Extract existing Traefik container details
          set_fact:
            existing_traefik: >-
              {{
                (traefik_container_info.get('containers', []) | first)
                if ((traefik_container_info.get('containers', []) | length) > 0)
                else (traefik_container_info.get('container', None))
              }}

        - name: Derive existing Traefik management state
          set_fact:
            existing_traefik_labels: "{{ existing_traefik.Config.Labels | default({}) if existing_traefik else {} }}"
            managed_traefik_present: >-
              {{
                existing_traefik is not none
                and existing_traefik_labels.get('com.opsctl.managed') == 'true'
                and existing_traefik_labels.get('com.opsctl.component') == 'traefik_gateway'
              }}

        - name: Fail on unmanaged Traefik container conflict
          fail:
            msg: "Existing traefik container is not OpsCtl-managed; refusing to mutate unknown state"
          when:
            - existing_traefik is not none
            - not managed_traefik_present

        - name: Detect existing listeners on ports 80 and 443
          shell: |
            ss -H -ltn '( sport = :80 or sport = :443 )' || true
          args:
            executable: /bin/sh
          register: traefik_listener_check
          changed_when: false

        - name: Fail on unmanaged port listeners
          fail:
            msg: "Detected existing unmanaged listener on port 80 or 443; refusing to replace it"
          when:
            - not managed_traefik_present
            - (traefik_listener_check.stdout | trim | length) > 0

        - name: Build Traefik command arguments
          set_fact:
            traefik_command_args: >-
              {{
                [
                  '--providers.docker=true',
                  '--providers.docker.exposedbydefault=false',
                  '--providers.file.directory=/etc/traefik/dynamic/opsctl',
                  '--providers.file.watch=true',
                  '--entrypoints.web.address=:80',
                  '--entrypoints.websecure.address=:443',
                  '--entrypoints.web.http.redirections.entrypoint.to=websecure',
                  '--entrypoints.web.http.redirections.entrypoint.scheme=https',
                  '--entrypoints.web.http.redirections.entrypoint.permanent=true'
                ]
                + (
                  [
                    '--certificatesresolvers.letsencrypt.acme.email=' ~ (traefik_email | string),
                    '--certificatesresolvers.letsencrypt.acme.storage=/var/lib/traefik/acme.json',
                    '--certificatesresolvers.letsencrypt.acme.httpchallenge=true',
                    '--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web'
                  ]
                  if (traefik_email is defined) and ((traefik_email | string | length) > 0)
                  else []
                )
                + (
                  ['--certificatesresolvers.letsencrypt.acme.caserver=' ~ acme_staging_url]
                  if (
                    (traefik_email is defined)
                    and ((traefik_email | string | length) > 0)
                    and ((traefik_acme_server | default('staging')) == 'staging')
                  )
                  else []
                )
                + (
                  ['--api.dashboard=true']
                  if (traefik_dashboard_enabled | default(false))
                  else []
                )
              }}

        - name: Build Traefik labels
          set_fact:
            traefik_labels: >-
              {{
                {
                  'com.opsctl.managed': 'true',
                  'com.opsctl.component': 'traefik_gateway',
                  'com.opsctl.org_id': (org_id | string)
                }
                | combine(
                    (
                      (traefik_dashboard_enabled | default(false))
                      and ((traefik_dashboard_host | default('')) | length > 0)
                      and (traefik_email is defined)
                      and ((traefik_email | string | length) > 0)
                    )
                    | ternary(
                        {
                          'traefik.enable': 'true',
                          'traefik.http.routers.' + traefik_dashboard_router + '.rule': 'Host("' ~ traefik_dashboard_host ~ '")',
                          'traefik.http.routers.' + traefik_dashboard_router + '.entrypoints': 'websecure',
                          'traefik.http.routers.' + traefik_dashboard_router + '.tls.certresolver': 'letsencrypt'
                        },
                        {}
                      )
                  )
                | combine(
                    (
                      (traefik_dashboard_enabled | default(false))
                      and (traefik_dashboard_auth is defined)
                      and ((traefik_dashboard_auth | string | length) > 0)
                    )
                    | ternary(
                        {
                          'traefik.http.routers.' + traefik_dashboard_router + '.middlewares': 'traefik-dashboard-auth',
                          'traefik.http.middlewares.traefik-dashboard-auth.basicauth.users': traefik_dashboard_auth
                        },
                        {}
                      )
                  )
              }}
          no_log: "{{ (traefik_dashboard_enabled | default(false)) and (traefik_dashboard_auth | default('') | length > 0) }}"

        - name: Ensure canonical managed Traefik container is running
          community.docker.docker_container:
            name: "{{ traefik_container_name }}"
            image: "{{ traefik_image }}"
            state: started
            recreate: true
            restart_policy: always
            detach: true
            network_mode: host
            volumes:
              - "/var/run/docker.sock:/var/run/docker.sock:ro"
              - "{{ traefik_dynamic_dir }}:/etc/traefik/dynamic/opsctl"
              - "{{ traefik_acme_dir }}:/var/lib/traefik"
            command: "{{ traefik_command_args }}"
            labels: "{{ traefik_labels }}"
            pull: false
          no_log: "{{ (traefik_dashboard_enabled | default(false)) and (traefik_dashboard_auth | default('') | length > 0) }}"

        - name: Re-inspect Traefik container
          community.docker.docker_container_info:
            name: "{{ traefik_container_name }}"
          register: traefik_container_ready

        - name: Extract converged Traefik container details
          set_fact:
            traefik_container_details: >-
              {{
                (traefik_container_ready.get('containers', []) | first)
                if ((traefik_container_ready.get('containers', []) | length) > 0)
                else (traefik_container_ready.get('container', None))
              }}

        - name: Verify canonical Traefik runtime
          assert:
            that:
              - traefik_container_details is not none
              - traefik_container_details.State.Status == "running"
              - traefik_container_details.HostConfig.NetworkMode == "host"
              - traefik_container_details.Config.Labels.get('com.opsctl.managed') == 'true'
              - traefik_container_details.Config.Labels.get('com.opsctl.component') == 'traefik_gateway'
              - traefik_container_details.Config.Labels.get('com.opsctl.org_id') == (org_id | string)
            fail_msg: "Traefik proxy did not converge to the canonical managed layout"

        - name: OPERATION_STEP traefik:ready
          shell: |
            printf 'OPERATION_STEP={"name":"traefik:ready","status":"completed","metadata":{"display_name":"Verify Traefik proxy"}}\n'
          args:
            executable: /bin/sh

        - name: OPERATION_STEP traefik:complete
          shell: |
            printf 'OPERATION_STEP={"name":"traefik:complete","status":"completed","metadata":{"display_name":"Traefik proxy ready"}}\n'
          args:
            executable: /bin/sh
      rescue:
        - name: OPERATION_STEP traefik:failure
          shell: |
            printf 'OPERATION_STEP={"name":"traefik:failure","status":"failed","metadata":{"display_name":"Traefik proxy failed"}}\n'
          args:
            executable: /bin/sh

        - name: Fail Traefik proxy converge
          fail:
            msg: "Traefik proxy converge failed"
