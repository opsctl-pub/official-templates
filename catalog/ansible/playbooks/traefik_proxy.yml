---
- name: Converge canonical managed Traefik reverse proxy
  hosts: all
  gather_facts: false
  become: true
  vars:
    traefik_container_name: "traefik"
    traefik_dashboard_router: "traefik-dashboard"
    traefik_image: "traefik@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0"
    traefik_dynamic_dir: "/etc/traefik/dynamic/opsctl"
    traefik_acme_dir: "/var/lib/traefik"
    dns_challenge_token_source_file: "/var/run/opsctl/file-secret/dns-challenge-token"
    dns_challenge_token_file: "{{ traefik_acme_dir }}/broker-secrets/token-{{ dns_challenge_token_revision_id | default('unavailable') }}"
    traefik_certificate_dir: "/etc/traefik/certificates/opsctl"
    acme_staging_url: "https://acme-staging-v02.api.letsencrypt.org/directory"
    traefik_gateway_target_major: 3
    traefik_gateway_target_version: "3.7.13"
  pre_tasks:
    - name: Skip Traefik proxy when running in simulate mode
      meta: end_play
      when: simulate | default(false)
  tasks:
    - name: OPERATION_STEP traefik:start
      shell: |
        printf 'OPERATION_STEP={"name":"traefik:start","status":"running","metadata":{"display_name":"Configure Traefik proxy"}}\n'
      args:
        executable: /bin/sh

    - name: Converge managed Traefik proxy
      block:
        - name: Install broker credential for explicit DNS-01 profile
          ansible.builtin.include_tasks: ../tasks/traefik_gateway_dns_challenge_secret.yml
          when: traefik_acme_challenge_profile | default('http01') == 'dns01_broker'

        - name: Build Traefik command arguments
          include_tasks: ../tasks/traefik_gateway_command.yml
          vars:
            traefik_gateway_acme_enabled: >-
              {{
                (traefik_email is defined)
                and ((traefik_email | string | trim | length) > 0)
              }}
            traefik_gateway_acme_environment: "{{ traefik_acme_server | default('staging') }}"
            traefik_gateway_acme_challenge_profile: "{{ traefik_acme_challenge_profile | default('http01') }}"
            traefik_gateway_acme_staging_url: "{{ acme_staging_url }}"
            traefik_gateway_dashboard_enabled: "{{ traefik_dashboard_enabled | default(false) }}"

        - name: Build Traefik dashboard labels
          set_fact:
            traefik_gateway_policy_labels: >-
              {{
                (
                  (
                    (traefik_dashboard_enabled | default(false))
                    and ((traefik_dashboard_host | default('')) | length > 0)
                    and (traefik_email is defined)
                    and ((traefik_email | string | length) > 0)
                  )
                  | ternary(
                      {
                        'traefik.enable': 'true',
                        'traefik.http.routers.' + traefik_dashboard_router + '.rule': 'Host(`' ~ traefik_dashboard_host ~ '`)',
                        'traefik.http.routers.' + traefik_dashboard_router + '.entrypoints': 'websecure',
                        'traefik.http.routers.' + traefik_dashboard_router + '.tls.certresolver': 'letsencrypt'
                      },
                      {}
                    )
                )
                | combine(
                    (
                      (traefik_dashboard_enabled | default(false))
                      and (traefik_dashboard_auth is defined)
                      and ((traefik_dashboard_auth | string | length) > 0)
                    )
                    | ternary(
                        {
                          'traefik.http.routers.' + traefik_dashboard_router + '.middlewares': 'traefik-dashboard-auth',
                          'traefik.http.middlewares.traefik-dashboard-auth.basicauth.users': traefik_dashboard_auth
                        },
                        {}
                      )
                  )
              }}
          no_log: >-
            {{
              (traefik_dashboard_enabled | default(false))
              and (traefik_dashboard_auth | default('') | length > 0)
            }}

        - name: Converge canonical Traefik runtime layout
          include_tasks: ../tasks/traefik_gateway_runtime_layout.yml
          vars:
            traefik_gateway_force_recreate: false
            traefik_gateway_sensitive: >-
              {{
                ((traefik_dashboard_enabled | default(false))
                and (traefik_dashboard_auth | default('') | length > 0))
                or (traefik_acme_challenge_profile | default('http01')) == 'dns01_broker'
              }}
            traefik_dns01_enabled: "{{ (traefik_acme_challenge_profile | default('http01')) == 'dns01_broker' }}"
            traefik_dns01_broker_url: "{{ dns_challenge_broker_url | default('') }}"
            traefik_dns01_token_file: "{{ dns_challenge_token_file }}"

        - name: OPERATION_STEP traefik:ready
          shell: |
            printf 'OPERATION_STEP={"name":"traefik:ready","status":"completed","metadata":{"display_name":"Verify Traefik proxy"}}\n'
          args:
            executable: /bin/sh

        - name: OPERATION_STEP traefik:complete
          shell: |
            printf 'OPERATION_STEP={"name":"traefik:complete","status":"completed","metadata":{"display_name":"Traefik proxy ready"}}\n'
          args:
            executable: /bin/sh
      rescue:
        - name: OPERATION_STEP traefik:failure
          shell: |
            printf 'OPERATION_STEP={"name":"traefik:failure","status":"failed","metadata":{"display_name":"Traefik proxy failed"}}\n'
          args:
            executable: /bin/sh

        - name: Clean unreferenced broker credential after failure
          ansible.builtin.include_tasks: ../tasks/traefik_gateway_dns_challenge_cleanup.yml
          when: traefik_acme_challenge_profile | default('http01') == 'dns01_broker'

        - name: Fail Traefik proxy converge
          fail:
            msg: "Traefik proxy converge failed"
