---
- name: Execute managed gateway-local automatic certificate action
  hosts: all
  gather_facts: false
  become: true
  vars:
    traefik_dynamic_dir: /etc/traefik/dynamic/opsctl
    traefik_certificate_dir: /etc/traefik/certificates/opsctl
    traefik_acme_state_dir: /var/lib/opsctl/automatic-certificates
    traefik_acme_dir: /var/lib/traefik
    dns_challenge_broker_url: "{{ automatic_certificate_profile.broker_url | default('') }}"
    dns_challenge_token_source_file: /var/run/opsctl/file-secret/dns-challenge-token
    dns_challenge_token_file: "{{ traefik_acme_dir }}/broker-secrets/token-{{ dns_challenge_token_revision_id | default('') }}"
  pre_tasks:
    - name: Skip automatic certificate mutation in simulation
      ansible.builtin.meta: end_play
      when: simulate | default(false)
  tasks:
    - name: Execute shared automatic certificate tasks
      ansible.builtin.include_tasks: ../tasks/traefik_automatic_certificate.yml
