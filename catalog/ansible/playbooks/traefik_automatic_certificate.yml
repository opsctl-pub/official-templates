---
- name: Execute managed gateway-local automatic certificate action
  hosts: all
  gather_facts: false
  become: true
  pre_tasks:
    - name: Skip automatic certificate mutation in simulation
      ansible.builtin.meta: end_play
      when: simulate | default(false)
  tasks:
    - name: Validate automatic certificate execution input
      ansible.builtin.assert:
        that:
          - automatic_certificate_request is mapping
          - automatic_certificate_profile is mapping
          - traefik_certificate_dir is defined
          - traefik_dynamic_dir is defined
          - traefik_acme_state_dir is defined
        fail_msg: Automatic certificate execution input is invalid

    - name: Check gateway certificate tooling
      ansible.builtin.command:
        argv: [python3, -c, 'import cryptography, yaml']
      register: automatic_tooling
      changed_when: false
      failed_when: false

    - name: Install missing gateway certificate tooling
      ansible.builtin.apt:
        name: [python3-cryptography, python3-yaml]
        state: present
        update_cache: false
      when: automatic_tooling.rc != 0

    - name: Ensure private automatic certificate state
      ansible.builtin.file:
        path: "{{ traefik_acme_state_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Allocate automatic certificate helper directory
      ansible.builtin.tempfile:
        state: directory
        prefix: opsctl-automatic-certificate-
      register: automatic_helper_dir

    - name: Run automatic certificate action
      block:
        - name: Deliver exact official automatic certificate helpers
          ansible.builtin.copy:
            src: "../scripts/{{ item }}"
            dest: "{{ automatic_helper_dir.path }}/{{ item }}"
            owner: root
            group: root
            mode: '0600'
          loop: [traefik_automatic_certificate.py, traefik_certificate_selection.py]

        - name: Execute local issuer and selected-file activation
          ansible.builtin.command:
            argv: [python3, "{{ automatic_helper_dir.path }}/traefik_automatic_certificate.py"]
            stdin: >-
              {{ {'profile': automatic_certificate_profile,
                  'request': automatic_certificate_request} | to_json }}
          environment:
            OPSCTL_CERTIFICATE_DIR: "{{ traefik_certificate_dir }}"
            OPSCTL_DYNAMIC_DIR: "{{ traefik_dynamic_dir }}"
            OPSCTL_ACME_STATE_DIR: "{{ traefik_acme_state_dir }}"
          register: automatic_action
          failed_when: false
          no_log: true

        - name: Report bounded automatic certificate failure
          ansible.builtin.assert:
            that: automatic_action.rc == 0
            fail_msg: "{{ automatic_action.stderr | default('Automatic certificate action failed') }}"

        - name: Emit sanitized automatic certificate receipt
          ansible.builtin.debug:
            msg: "{{ automatic_action.stdout }}"
      always:
        - name: Remove transient automatic certificate helpers
          ansible.builtin.file:
            path: "{{ automatic_helper_dir.path }}"
            state: absent
