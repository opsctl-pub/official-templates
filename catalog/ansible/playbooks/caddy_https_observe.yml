---
- name: Observe automatic certificates on managed Caddy
  hosts: all
  gather_facts: false
  become: true
  pre_tasks:
    - name: Validate Caddy automatic certificate observation identity
      ansible.builtin.assert:
        that:
          - adapter_key == 'caddy_acme_http01'
          - certificate_mode == 'automatic'
          - challenge_type == 'http-01'
          - deployment_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
          - route_hosts is sequence
          - route_hosts is not string
          - route_hosts == (route_hosts | unique | sort | list)
          - (route_hosts | length) > 0
          - renewal_due_days is integer
        fail_msg: "Caddy automatic certificate observation identity is invalid"
  tasks:
    - name: Run canonical Caddy automatic certificate observer
      ansible.builtin.script: "{{ playbook_dir }}/../scripts/caddy_route_contract.py observe-automatic"
      environment:
        OPSCTL_DEPLOYMENT_ID: "{{ deployment_id }}"
        OPSCTL_ADAPTER_KEY: "{{ adapter_key }}"
        OPSCTL_CERTIFICATE_MODE: "{{ certificate_mode }}"
        OPSCTL_GATEWAY_ID: "{{ gateway_id }}"
        OPSCTL_ORGANIZATION_ID: "{{ org_id }}"
        OPSCTL_PROXY_ENGINE: "caddy"
        OPSCTL_RENEWAL_DUE_DAYS: "{{ renewal_due_days | string }}"
        OPSCTL_ROUTE_HOSTS: "{{ route_hosts | to_json }}"
        OPSCTL_SERVER_ID: "{{ server_id }}"
        OPSCTL_TARGET_SERVER: "{{ target_server }}"
      changed_when: false
