---
- name: Validate DNS challenge credential identity
  ansible.builtin.assert:
    that:
      - dns_challenge_broker_url is match('^https://[^/?#@]+/api/v1/dns-challenge$')
      - dns_challenge_token_revision_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
      - dns_challenge_token_content_digest is match('^[0-9a-f]{64}$')
    fail_msg: "DNS challenge credential identity is invalid"
  no_log: true

- name: Inspect mounted DNS challenge credential
  ansible.builtin.stat:
    path: "{{ dns_challenge_token_source_file }}"
    follow: true
  delegate_to: localhost
  become: false
  register: dns_challenge_token_source
  no_log: true

- name: Require mounted DNS challenge credential
  ansible.builtin.assert:
    that:
      - dns_challenge_token_source.stat.isreg | default(false)
      - dns_challenge_token_source.stat.size | int > 32
      - dns_challenge_token_source.stat.size | int < 256
    fail_msg: "DNS challenge credential is unavailable"
  no_log: true

- name: Verify mounted DNS challenge credential digest
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import hashlib
        import sys

        value = open(sys.argv[1], 'rb').read()
        name = b'dns-challenge-token'
        digest = hashlib.sha256()
        digest.update(b'opsctl-file-secret:1\0')
        digest.update(len(name).to_bytes(2, 'big'))
        digest.update(name)
        digest.update(len(value).to_bytes(8, 'big'))
        digest.update(value)
        if digest.hexdigest() != sys.argv[2]:
            raise SystemExit(2)
      - "{{ dns_challenge_token_source_file }}"
      - "{{ dns_challenge_token_content_digest }}"
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Ensure Traefik credential directory exists
  ansible.builtin.file:
    path: "{{ traefik_acme_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  no_log: true

- name: Ensure Traefik broker credential directory exists
  ansible.builtin.file:
    path: "{{ traefik_acme_dir }}/broker-secrets"
    state: directory
    owner: root
    group: root
    mode: "0700"
  no_log: true

- name: Inspect installed DNS challenge credential
  ansible.builtin.stat:
    path: "{{ dns_challenge_token_file }}"
  register: dns_challenge_token_installed
  no_log: true

- name: Reject unsafe installed DNS challenge credential
  ansible.builtin.assert:
    that:
      - not dns_challenge_token_installed.stat.exists or dns_challenge_token_installed.stat.isreg | default(false)
      - not dns_challenge_token_installed.stat.exists or dns_challenge_token_installed.stat.mode == '0600'
      - not dns_challenge_token_installed.stat.exists or dns_challenge_token_installed.stat.pw_name == 'root'
    fail_msg: "Installed DNS challenge credential is unsafe"
  no_log: true

- name: Install immutable DNS challenge credential
  ansible.builtin.copy:
    src: "{{ dns_challenge_token_source_file }}"
    dest: "{{ dns_challenge_token_file }}"
    owner: root
    group: root
    mode: "0600"
  when: not dns_challenge_token_installed.stat.exists
  no_log: true

- name: Verify installed DNS challenge credential digest
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import hashlib
        import sys

        value = open(sys.argv[1], 'rb').read()
        name = b'dns-challenge-token'
        digest = hashlib.sha256()
        digest.update(b'opsctl-file-secret:1\0')
        digest.update(len(name).to_bytes(2, 'big'))
        digest.update(name)
        digest.update(len(value).to_bytes(8, 'big'))
        digest.update(value)
        if digest.hexdigest() != sys.argv[2]:
            raise SystemExit(2)
      - "{{ dns_challenge_token_file }}"
      - "{{ dns_challenge_token_content_digest }}"
  changed_when: false
  no_log: true
