---
- name: Collect bounded exact-candidate failure diagnostics before restoration
  block:
    - name: Require well-formed existing predecessor observations
      ansible.builtin.assert:
        that:
          - image_runtime is not defined or image_runtime is mapping
          - source_replacement_runtime is not defined or source_replacement_runtime is mapping
          - legacy_container_payload | default([]) is sequence
          - legacy_container_payload | default([]) is not string
          - legacy_container_payload | default([]) is not mapping
          - final_label_map is mapping

    - name: Require the actual pre-start branch to have complete inventory
      ansible.builtin.assert:
        that: >-
          (image_runtime is defined and image_runtime.observation_complete is sameas true
            and 'container' in image_runtime
            and (image_runtime.container is none or image_runtime.container is mapping))
          if managed_image_resources else
          (legacy_container_inventory_complete | default(false) is sameas true)

    - name: Require typed legacy identities before selecting the target
      ansible.builtin.assert:
        that:
          - item is mapping
          - item.get('Name') is string
      loop: "{{ legacy_container_payload | default([]) }}"
      loop_control:
        label: predecessor observation

    - name: Require unambiguous pre-start target observations
      ansible.builtin.assert:
        that:
          - image_runtime is not defined or 'container' in image_runtime
          - image_runtime is not defined or image_runtime.get('container') is none or image_runtime.get('container') is mapping
          - legacy_targets | length <= 1
      vars:
        legacy_targets: >-
          {{ legacy_container_payload | default([]) |
             selectattr('Name', 'in', [container_name, '/' ~ container_name]) | list }}

    - name: Retain only the existing pre-start predecessor IDs and managed label scope
      ansible.builtin.set_fact:
        container_failure_previous_ids: >-
          {{ ([app_previous_container_id] if app_previous_container_id | default(none) is not none else [])
             + ([image_runtime.container.id] if image_runtime is defined and image_runtime.get('container') is not none else [])
             + ([source_replacement_runtime.Id] if source_replacement_runtime is defined else [])
             + (legacy_targets | map(attribute='Id') | list) }}
        container_failure_labels: >-
          {{ final_label_map | dict2items | selectattr('key', 'in', diagnostic_label_keys) | items2dict }}
      vars:
        legacy_targets: >-
          {{ legacy_container_payload | default([]) |
             selectattr('Name', 'in', [container_name, '/' ~ container_name]) | list }}
        diagnostic_label_keys:
          - com.opsctl.managed
          - com.opsctl.org_id
          - com.opsctl.deployment_id
          - com.opsctl.app
          - com.opsctl.project_id
          - com.opsctl.revision_id
          - com.opsctl.secret_files

    - name: Require full predecessor IDs before deduplication
      ansible.builtin.assert:
        that: item is string and item is match('^[0-9a-f]{64}$')
      loop: "{{ container_failure_previous_ids }}"
      loop_control:
        label: predecessor ID

    - name: Form the bounded image diagnostic request
      ansible.builtin.set_fact:
        container_failure_request:
          container_name: "{{ container_name }}"
          operational_path: "{{ container_operational_path }}"
          previous_ids: "{{ container_failure_previous_ids | unique(case_sensitive=true) | list }}"
          labels: "{{ container_failure_labels }}"

    - name: Privately collect the candidate with the public bounded native reader
      ansible.builtin.script:
        cmd: >-
          {{ (playbook_dir + '/../../scripts/container_failure_logs.py') | quote }}
          {{ container_failure_request | to_json | quote }}
        executable: python3
      environment:
        PATH: "{{ container_operational_path }}"
      register: container_failure_diagnostic_read
      changed_when: false

    - name: Retain the private diagnostic projection
      ansible.builtin.set_fact:
        container_failure_diagnostic: "{{ container_failure_diagnostic_read.stdout | from_json }}"
  rescue:
    - name: Retain only unavailable diagnostics after collection failure
      ansible.builtin.set_fact:
        container_failure_diagnostic:
          status: unavailable
          members: []
          omitted: 0
  no_log: true

- name: Publish bounded container failure diagnostics independently of the original failure
  ansible.builtin.debug:
    msg: >-
      Container failure diagnostics:
      {%- if container_failure_diagnostic.status == 'unavailable' %}
      unavailable
      {%- endif %}
      {%- for member in container_failure_diagnostic.members %}
      Container: {{ member.id }}
      State: {{ member.state | to_json }}
      {%- if member.status == 'available' %}
      stdout:
      {{ member.stdout }}
      stderr:
      {{ member.stderr }}
      {%- else %}
      logs unavailable
      {%- endif %}
      {%- endfor %}
  no_log: false
