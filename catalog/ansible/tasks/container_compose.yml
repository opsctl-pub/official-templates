---
- name: Require the managed Compose deployment prerequisite
  ansible.builtin.command: docker compose version --short
  register: compose_version
  changed_when: false
  failed_when: compose_version.rc != 0 or not (compose_version.stdout | trim is match('^v?2\.[0-9]+\.[0-9]+$'))

- name: Allocate a private operation-scoped Compose directory
  ansible.builtin.tempfile:
    state: directory
    prefix: opsctl-compose-
  register: compose_directory

- name: Run the exact shared Compose transition
  block:
    - name: Render reviewed desired Compose configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/container_compose.yml.j2"
        dest: "{{ compose_directory.path }}/compose.yml"
        mode: '0600'
      no_log: true
      when: app_local_runtime.action == 'deploy'

    - name: Deliver the existing namespace-only HTTP verifier
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/container_http_health.py"
        dest: "{{ compose_directory.path }}/http-health.py"
        mode: '0600'

    - name: Hold exclusion through Compose, readiness and final observation
      ansible.builtin.shell: |
        python3 - <<'PY'
        import contextlib
        import fcntl
        import json
        import os
        import re
        import signal
        import subprocess
        import tempfile
        import time
        from pathlib import Path
        from uuid import UUID

        request = json.loads({{ app_local_runtime | to_json | to_json }})
        directory = Path({{ compose_directory.path | to_json }})
        deadline = time.monotonic() + {{ app_compose_timeout | default(240) | int }}
        project = 'opsctl-' + UUID(request['deployment_id']).hex
        previous = request.get('previous') or {'mounts': []}
        prefix = 'com.opsctl.'
        locked = []

        def fail(code):
            raise RuntimeError(code)

        def run(arguments, *, allowed=(0,), return_code=False):
            remaining = deadline - time.monotonic()
            if remaining <= 0:
                fail('compose_transition_timeout')
            with tempfile.TemporaryFile() as output:
                child = subprocess.Popen(arguments, stdout=output, stderr=subprocess.DEVNULL,
                                         start_new_session=True, pass_fds=tuple(locked))
                try:
                    while child.poll() is None:
                        if time.monotonic() >= deadline or os.fstat(output.fileno()).st_size > 1048576:
                            fail('compose_transition_unknown')
                        time.sleep(0.05)
                    if child.returncode not in allowed or os.fstat(output.fileno()).st_size > 1048576:
                        fail('compose_transition_unknown')
                    output.seek(0)
                    return child.returncode if return_code else output.read()
                finally:
                    if child.poll() is None:
                        os.killpg(child.pid, signal.SIGKILL)
                    child.wait()

        def inspect(kind, identity):
            values = json.loads(run(['docker', kind, 'inspect', '--', identity]))
            if not isinstance(values, list) or len(values) != 1:
                fail('compose_identity_unknown')
            return values[0]

        def container(identity):
            ids = run(['docker', 'ps', '-aq', '--no-trunc']).decode().splitlines()
            if len(ids) > 1024:
                fail('compose_inventory_limit')
            if re.fullmatch('[a-f0-9]{64}', identity):
                return inspect('container', identity) if identity in ids else None
            rows = [inspect('container', item) for item in ids]
            found = [row for row in rows if row.get('Name') == '/' + identity]
            if len(found) > 1:
                fail('compose_identity_unknown')
            return found[0] if found else None

        def native(item, family):
            identity = item['volume_id'] if family == 'Volume' else item['id']
            return ('opsctl-' + ('vol' if family == 'Volume' else 'net') + '-'
                    + UUID(request['organization_id']).hex + '-' + UUID(identity).hex
                    + '-g' + str(item['generation']))

        def owned(row, revision, identity=None):
            expected = {'org_id': request['organization_id'], 'deployment_id': request['deployment_id'],
                        'server_id': request['server_id'], 'revision_id': revision, 'managed': 'true'}
            labels = row.get('Config', {}).get('Labels') or {} if row else {}
            if (not row or not re.fullmatch('[a-f0-9]{64}', row.get('Id', ''))
                    or any(labels.get(prefix + key) != value for key, value in expected.items())
                    or labels.get('com.docker.compose.project') != project
                    or labels.get('com.docker.compose.service') != 'app'
                    or (identity is not None and row['Id'] != identity)):
                fail('compose_container_changed')

        def allocations():
            for mount in request['mounts'] + previous['mounts']:
                row = inspect('volume', native(mount, 'Volume'))
                expected = {'managed': 'true', 'org_id': request['organization_id'],
                            'resource_kind': 'Volume', 'resource_id': mount['volume_id'],
                            'volume_id': mount['volume_id'], 'backing_id': mount['backing_id'],
                            'server_id': request['server_id'], 'generation': str(mount['generation'])}
                if (row.get('Name') != native(mount, 'Volume') or row.get('Driver') != 'local'
                        or row.get('Scope') != 'local' or row.get('Options') not in (None, {})
                        or row.get('Labels') != {prefix + key: value for key, value in expected.items()}
                        or row.get('CreatedAt') != mount['incarnation']):
                    fail('compose_volume_changed')
            for network in request['networks'] + previous.get('networks', []):
                row = inspect('network', network['incarnation'])
                expected = {'managed': 'true', 'org_id': request['organization_id'],
                            'resource_kind': 'Network', 'resource_id': network['id'],
                            'server_id': request['server_id'], 'generation': str(network['generation'])}
                if (row.get('Id') != network['incarnation'] or row.get('Name') != native(network, 'Network')
                        or row.get('Driver') != 'bridge' or row.get('Scope') != 'local'
                        or row.get('Internal') is not False
                        or row.get('Labels') != {prefix + key: value for key, value in expected.items()}):
                    fail('compose_network_changed')

        def writers(permitted=None):
            names = {native(mount, 'Volume') for mount in request['mounts'] + previous['mounts']
                     if mount['mode'] == 'rw'}
            ids = run(['docker', 'ps', '-q', '--no-trunc']).decode().splitlines()
            if len(ids) > 1024:
                fail('compose_inventory_limit')
            for identity in ids:
                if identity == permitted:
                    continue
                row = inspect('container', identity)
                state = row.get('State')
                mounts = row.get('Mounts')
                if (not isinstance(state, dict) or type(state.get('Running')) is not bool
                        or not isinstance(mounts, list)):
                    fail('compose_writer_observation_unknown')
                for mount in mounts:
                    if not isinstance(mount, dict) or not isinstance(mount.get('Type'), str):
                        fail('compose_writer_observation_unknown')
                    if mount['Type'] != 'volume':
                        continue
                    if (not isinstance(mount.get('Name'), str) or not mount['Name']
                            or type(mount.get('RW')) is not bool):
                        fail('compose_writer_observation_unknown')
                    if state['Running'] and mount['Name'] in names and mount['RW']:
                        fail('compose_writer_conflict')

        def realized(row):
            owned(row, request['revision_id'])
            config, host = row['Config'], row['HostConfig']
            if config.get('Image') != request['image']:
                fail('compose_image_changed')
            for key, actual in [('command', config.get('Cmd')), ('memory_bytes', host.get('Memory'))]:
                if request.get(key) is not None and request[key] != actual:
                    fail('compose_configuration_changed')
            if request.get('health_exec') is not None and (config.get('Healthcheck') or {}).get('Test') != ['CMD', *request['health_exec']]:
                fail('compose_health_changed')
            for key, value in request.get('env', {}).items():
                if [item for item in config.get('Env', []) if item.startswith(key + '=')] != [key + '=' + value]:
                    fail('compose_environment_changed')
            expected = sorted((native(mount, 'Volume'), mount['path'], mount['mode'] == 'rw') for mount in request['mounts'])
            actual = sorted((mount.get('Name'), mount.get('Destination'), mount.get('RW'))
                            for mount in row.get('Mounts', []) if mount.get('Type') == 'volume')
            if actual != expected:
                fail('compose_mount_changed')
            networks = row.get('NetworkSettings', {}).get('Networks') or {}
            wanted = {native(network, 'Network') for network in request['networks']}
            if request['networks'] and set(networks) != wanted:
                fail('compose_network_changed')
            for network in request['networks']:
                state = networks.get(native(network, 'Network'), {})
                if state.get('NetworkID') != network['incarnation'] or not set(network.get('aliases', [])).issubset(state.get('Aliases') or []):
                    fail('compose_alias_changed')
            ports = {}
            for binding in request.get('published_ports', []):
                ports.setdefault(str(binding['container_port']) + '/tcp', []).append(
                    {'HostIp': binding['host_ip'], 'HostPort': str(binding['host_port'])})
            if (host.get('PortBindings') or {}) != ports:
                fail('compose_publication_changed')

        def ready(identity):
            while time.monotonic() < deadline:
                row = container(identity)
                realized(row)
                if not row.get('State', {}).get('Running'):
                    fail('compose_not_running')
                native_health = (row['Config'].get('Healthcheck') or {}).get('Test') or []
                if native_health and native_health[0] != 'NONE':
                    if row['State'].get('Health', {}).get('Status') == 'healthy':
                        return row
                elif request.get('http_health'):
                    health = request['http_health']
                    status = run(['python3', str(directory / 'http-health.py'), '--container', identity,
                         '--organization', request['organization_id'], '--deployment', request['deployment_id'],
                         '--revision', request['revision_id'], '--port', str(health['port']), '--path', health['path']],
                         allowed=(0, 1), return_code=True)
                    again = container(identity)
                    realized(again)
                    if status == 0 and again['State'].get('Running'):
                        return again
                else:
                    fail('compose_readiness_missing')
                time.sleep(min(3, max(0, deadline - time.monotonic())))
            fail('compose_health_failed')

        def observation(current):
            present = current is not None
            identity = current['Id'] if present else previous['container_id']
            revision = request['revision_id'] if present else previous['revision_id']
            mounts = request['mounts'] if present else previous['mounts']
            common = {key: request[key] for key in ('organization_id', 'deployment_id', 'server_id', 'operation_id')}
            def attachment(mount, container_id, revision_id, presence):
                return {**common, 'protocol': 'opsctl-volume-attachment/1', 'revision_id': revision_id,
                        'attachment_id': mount['attachment_id'], 'backing_id': mount['backing_id'],
                        'generation': mount['generation'], 'container_id': container_id,
                        'presence': presence, 'writer_excluded': True}
            retained = {mount['attachment_id'] for mount in mounts}
            return {**common, 'protocol': 'opsctl-local-runtime/1', 'revision_id': revision,
                    'container_id': identity, 'presence': 'present' if present else 'absent', 'ready': present,
                    'attachments': [attachment(mount, identity, revision, 'present' if present else 'absent') for mount in mounts],
                    'detached_attachments': [attachment(mount, previous['container_id'], previous['revision_id'], 'absent')
                        for mount in previous['mounts'] if present and mount['attachment_id'] not in retained]}

        try:
            with contextlib.ExitStack() as stack:
                root = Path('/run/lock/opsctl-compose')
                root.mkdir(mode=0o700, parents=True, exist_ok=True)
                keys = {'deployment-' + UUID(request['deployment_id']).hex}
                keys.update('volume-' + UUID(mount['backing_id']).hex for mount in request['mounts'] + previous['mounts'])
                keys.update('network-' + UUID(network['id']).hex
                            for network in request['networks'] + previous.get('networks', []))
                for key in sorted(keys):
                    fd = os.open(root / key, os.O_CREAT | os.O_RDWR | os.O_NOFOLLOW, 0o600)
                    stack.callback(os.close, fd)
                    while True:
                        try:
                            fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                            break
                        except BlockingIOError:
                            if time.monotonic() >= deadline:
                                fail('compose_lock_timeout')
                            time.sleep(0.05)
                    locked.append(fd)
                allocations()
                current = container(request['container_name'])
                project_ids = run(['docker', 'ps', '-aq', '--no-trunc', '--filter',
                                   'label=com.docker.compose.project=' + project]).decode().splitlines()
                if set(project_ids) != ({current['Id']} if current else set()):
                    fail('compose_project_identity_changed')
                config = directory / 'compose.yml'
                compose = ['docker', 'compose', '--project-name', project, '--file', str(config)]
                if request['action'] == 'remove':
                    if current is not None:
                        owned(current, previous['revision_id'], previous['container_id'])
                        config.write_text(json.dumps({'name': project, 'services': {'app': {
                            'image': current['Config']['Image'], 'container_name': request['container_name']}}}))
                        run([*compose, 'down', '--timeout', '20'])
                    if container(previous['container_id']) is not None or container(request['container_name']) is not None:
                        fail('compose_removal_unknown')
                    writers()
                    proof = observation(None)
                else:
                    if current is not None and current.get('Config', {}).get('Labels', {}).get(prefix + 'revision_id') != request['revision_id']:
                        if not request.get('previous'):
                            fail('compose_previous_identity_missing')
                        owned(current, previous['revision_id'], previous['container_id'])
                        run(['docker', 'stop', '--time', '20', current['Id']])
                        stopped = container(current['Id'])
                        owned(stopped, previous['revision_id'], previous['container_id'])
                        if stopped['State'].get('Running'):
                            fail('compose_old_writer_running')
                        current = None
                    if current is None:
                        writers()
                        run([*compose, 'up', '--detach', '--no-deps', '--pull', 'never', 'app'])
                        current = container(request['container_name'])
                    realized(current)
                    current = ready(current['Id'])
                    writers(current['Id'])
                    allocations()
                    proof = observation(current)
                print('TEMPLATE_OUTPUT_JSON=' + json.dumps({'local_runtime': proof}, sort_keys=True))
        except Exception:
            print('Compose transition could not establish exact runtime evidence.', file=__import__('sys').stderr)
            raise SystemExit(1)
        PY
      args:
        executable: /bin/sh
      register: compose_transition
      no_log: true
      changed_when: false

    - name: Publish value-free Compose observation
      ansible.builtin.debug:
        msg: "{{ compose_transition.stdout }}"
  always:
    - name: Remove private operation-scoped Compose files
      ansible.builtin.file:
        path: "{{ compose_directory.path }}"
        state: absent
