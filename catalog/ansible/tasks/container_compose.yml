---
- name: Require the managed Compose deployment prerequisite
  ansible.builtin.command: docker compose version --short
  register: compose_version
  changed_when: false
  failed_when: compose_version.rc != 0 or not (compose_version.stdout | trim is match('^v?2\.[0-9]+\.[0-9]+$'))

- name: Allocate a private operation-scoped Compose directory
  ansible.builtin.tempfile:
    state: directory
    prefix: opsctl-compose-
  register: compose_directory
  when: app_compose_runtime is not defined

- name: Identify verification-only prospective cleanup
  ansible.builtin.set_fact:
    compose_verify_absence: >-
      {{ app_compose_runtime is defined
         and app_compose_runtime.protocol == 'opsctl-compose-attempt-cleanup/2'
         and (app_compose_runtime.cleanup_mode | default('witness')) == 'verify_absence' }}

- name: Select private managed Compose revision directory
  ansible.builtin.set_fact:
    compose_directory:
      path: "{{ app_compose_runtime.input_directory if app_compose_runtime.protocol in ['opsctl-compose-runtime/2', 'opsctl-compose-attempt-cleanup/2'] else '/var/lib/opsctl/compose/' ~ app_compose_runtime.deployment_id ~ '/' ~ app_compose_runtime.revision_id }}"
  when: app_compose_runtime is defined

- name: Refuse symlinked or writable custody ancestors before file delivery
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import stat
    from pathlib import Path, PurePosixPath
    request = json.loads({{ app_compose_runtime | to_json | to_json }})
    directory = Path({{ compose_directory.path | to_json }})
    try:
        paths = [directory]
        for item in request['files']:
            relative = PurePosixPath(item['path'])
            if relative.is_absolute() or '..' in relative.parts or not relative.parts:
                raise ValueError
            paths.append(directory / str(relative))
        for path in paths:
            for component in (*reversed(path.parents), path):
                if component.is_symlink():
                    raise ValueError
                if component.exists():
                    info = component.stat()
                    if info.st_uid != 0 or info.st_mode & 0o022:
                        raise ValueError
                    if component != path and not stat.S_ISDIR(info.st_mode):
                        raise ValueError
    except Exception:
        raise SystemExit('Compose custody identity is unavailable.')
    PY
  args:
    executable: /bin/sh
  changed_when: false
  no_log: true
  when: app_compose_runtime is defined and not compose_verify_absence

- name: Preserve private revision custody for mounted regular files
  ansible.builtin.file:
    path: "{{ compose_directory.path }}"
    state: directory
    mode: '0700'
  when: app_compose_runtime is defined and not compose_verify_absence

- name: Run the exact shared Compose transition
  block:
    - name: Create private reviewed source parent directories
      ansible.builtin.file:
        path: "{{ compose_directory.path }}/{{ item.path | dirname }}"
        state: directory
        mode: '0700'
      loop: "{{ app_compose_runtime.files | default([]) }}"
      no_log: true
      when: app_compose_runtime is defined and not compose_verify_absence

    - name: Deliver exact originals and reviewed additions from existing file custody
      ansible.builtin.copy:
        src: "/var/run/opsctl/file-secret/{{ item.name }}"
        dest: "{{ compose_directory.path }}/{{ item.path }}"
        mode: "{{ item.mode }}"
        force: false
      loop: "{{ app_compose_runtime.files | default([]) }}"
      no_log: true
      when: app_compose_runtime is defined and not compose_verify_absence

    - name: Render reviewed desired Compose configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/container_compose.yml.j2"
        dest: "{{ compose_directory.path }}/compose.yml"
        mode: '0600'
      no_log: true
      when: app_compose_runtime is not defined and app_local_runtime.action == 'deploy'

    - name: Deliver the existing namespace-only HTTP verifier
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/container_http_health.py"
        dest: "{{ compose_directory.path }}/http-health.py"
        mode: '0600'
      when: app_compose_runtime is not defined

    - name: Hold exclusion through Compose, readiness and final observation
      ansible.builtin.shell:
        cmd: |
          python3 - <<'PY'
          import contextlib
          import hashlib
          import fcntl
          import json
          import os
          import re
          import signal
          import shutil
          import subprocess
          import tempfile
          import time
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from uuid import UUID

          request = json.loads({{ (app_compose_runtime if app_compose_runtime is defined else app_local_runtime) | to_json | to_json }})
          native_cleanup = request['protocol'] == 'opsctl-compose-attempt-cleanup/2'
          native_group = native_cleanup or request['protocol'] == 'opsctl-compose-runtime/2'
          grouped = native_group or request['protocol'] in {'opsctl-compose-runtime/1', 'opsctl-compose-attempt-cleanup/1'}
          prospective_cleanup = request['protocol'] == 'opsctl-compose-attempt-cleanup/1'
          directory = Path({{ compose_directory.path | to_json }})
          deadline = time.monotonic() + {{ app_compose_timeout | default(240) | int }}
          project = request['project_name'] if native_group else 'opsctl-' + UUID(request['deployment_id']).hex
          previous = request.get('previous') or {'mounts': []}
          prefix = 'com.opsctl.'
          locked = []
          attempt_observer = []
          registry_material = json.loads({{ lookup('ansible.builtin.file', '/secrets/registry-auth.json', errors='ignore') | default('{}', true) | to_json }})

          def fail(code):
              raise RuntimeError(code)

          def run(arguments, *, allowed=(0,), return_code=False, environment=None, result=False, input_bytes=None):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  fail('compose_transition_timeout')
              with tempfile.TemporaryFile() as output, tempfile.TemporaryFile() as errors, tempfile.TemporaryFile() as source:
                  if input_bytes is not None:
                      source.write(input_bytes)
                      source.seek(0)
                  child = subprocess.Popen(arguments, stdout=output, stderr=errors,
                                           stdin=source if input_bytes is not None else subprocess.DEVNULL,
                                           start_new_session=True, pass_fds=tuple(locked), env=environment)
                  try:
                      while child.poll() is None:
                          if (time.monotonic() >= deadline or os.fstat(output.fileno()).st_size > 1048576
                                  or os.fstat(errors.fileno()).st_size > 1048576):
                              fail('compose_transition_unknown')
                          time.sleep(0.05)
                      if (child.returncode not in allowed or os.fstat(output.fileno()).st_size > 1048576
                              or os.fstat(errors.fileno()).st_size > 1048576):
                          fail('compose_transition_unknown')
                      output.seek(0)
                      if result:
                          errors.seek(0)
                          return child.returncode, output.read(), errors.read()
                      return child.returncode if return_code else output.read()
                  finally:
                      if child.poll() is None:
                          os.killpg(child.pid, signal.SIGKILL)
                      child.wait()

          def inspect(kind, identity):
              values = json.loads(run(['docker', kind, 'inspect', '--', identity]))
              if not isinstance(values, list) or len(values) != 1:
                  fail('compose_identity_unknown')
              return values[0]

          def container(identity):
              ids = run(['docker', 'ps', '-aq', '--no-trunc']).decode().splitlines()
              if len(ids) > 1024:
                  fail('compose_inventory_limit')
              if re.fullmatch('[a-f0-9]{64}', identity):
                  return inspect('container', identity) if identity in ids else None
              rows = [inspect('container', item) for item in ids]
              found = [row for row in rows if row.get('Name') == '/' + identity]
              if len(found) > 1:
                  fail('compose_identity_unknown')
              return found[0] if found else None

          def native(item, family):
              identity = item['volume_id'] if family == 'Volume' else item['id']
              return ('opsctl-' + ('vol' if family == 'Volume' else 'net') + '-'
                      + UUID(request['organization_id']).hex + '-' + UUID(identity).hex
                      + '-g' + str(item['generation']))

          def owned(row, revision, identity=None):
              expected = {'org_id': request['organization_id'], 'deployment_id': request['deployment_id'],
                          'server_id': request['server_id'], 'revision_id': revision, 'managed': 'true'}
              labels = row.get('Config', {}).get('Labels') or {} if row else {}
              if (not row or not re.fullmatch('[a-f0-9]{64}', row.get('Id', ''))
                      or any(labels.get(prefix + key) != value for key, value in expected.items())
                      or labels.get('com.docker.compose.project') != project
                      or labels.get('com.docker.compose.service') != 'app'
                      or (identity is not None and row['Id'] != identity)):
                  fail('compose_container_changed')

          def allocations():
              for mount in request['mounts'] + previous['mounts']:
                  row = inspect('volume', native(mount, 'Volume'))
                  expected = {'managed': 'true', 'org_id': request['organization_id'],
                              'resource_kind': 'Volume', 'resource_id': mount['volume_id'],
                              'volume_id': mount['volume_id'], 'backing_id': mount['backing_id'],
                              'server_id': request['server_id'], 'generation': str(mount['generation'])}
                  if (row.get('Name') != native(mount, 'Volume') or row.get('Driver') != 'local'
                          or row.get('Scope') != 'local' or row.get('Options') not in (None, {})
                          or row.get('Labels') != {prefix + key: value for key, value in expected.items()}
                          or row.get('CreatedAt') != mount['incarnation']):
                      fail('compose_volume_changed')
              for network in request['networks'] + previous.get('networks', []):
                  row = inspect('network', network['incarnation'])
                  expected = {'managed': 'true', 'org_id': request['organization_id'],
                              'resource_kind': 'Network', 'resource_id': network['id'],
                              'server_id': request['server_id'], 'generation': str(network['generation'])}
                  if (row.get('Id') != network['incarnation'] or row.get('Name') != native(network, 'Network')
                          or row.get('Driver') != 'bridge' or row.get('Scope') != 'local'
                          or row.get('Internal') is not False
                          or row.get('Labels') != {prefix + key: value for key, value in expected.items()}):
                      fail('compose_network_changed')

          def writers(permitted=None):
              names = {native(mount, 'Volume') for mount in request['mounts'] + previous['mounts']
                       if mount['mode'] == 'rw'}
              ids = run(['docker', 'ps', '-q', '--no-trunc']).decode().splitlines()
              if len(ids) > 1024:
                  fail('compose_inventory_limit')
              for identity in ids:
                  if identity == permitted:
                      continue
                  row = inspect('container', identity)
                  state = row.get('State')
                  mounts = row.get('Mounts')
                  if (not isinstance(state, dict) or type(state.get('Running')) is not bool
                          or not isinstance(mounts, list)):
                      fail('compose_writer_observation_unknown')
                  for mount in mounts:
                      if not isinstance(mount, dict) or not isinstance(mount.get('Type'), str):
                          fail('compose_writer_observation_unknown')
                      if mount['Type'] != 'volume':
                          continue
                      if (not isinstance(mount.get('Name'), str) or not mount['Name']
                              or type(mount.get('RW')) is not bool):
                          fail('compose_writer_observation_unknown')
                      if state['Running'] and mount['Name'] in names and mount['RW']:
                          fail('compose_writer_conflict')

          def realized(row):
              owned(row, request['revision_id'])
              config, host = row['Config'], row['HostConfig']
              if config.get('Image') != request['image']:
                  fail('compose_image_changed')
              for key, actual in [('command', config.get('Cmd')), ('memory_bytes', host.get('Memory'))]:
                  if request.get(key) is not None and request[key] != actual:
                      fail('compose_configuration_changed')
              if request.get('health_exec') is not None and (config.get('Healthcheck') or {}).get('Test') != ['CMD', *request['health_exec']]:
                  fail('compose_health_changed')
              for key, value in request.get('env', {}).items():
                  if [item for item in config.get('Env', []) if item.startswith(key + '=')] != [key + '=' + value]:
                      fail('compose_environment_changed')
              expected = sorted((native(mount, 'Volume'), mount['path'], mount['mode'] == 'rw') for mount in request['mounts'])
              actual = sorted((mount.get('Name'), mount.get('Destination'), mount.get('RW'))
                              for mount in row.get('Mounts', []) if mount.get('Type') == 'volume')
              if actual != expected:
                  fail('compose_mount_changed')
              networks = row.get('NetworkSettings', {}).get('Networks') or {}
              wanted = {native(network, 'Network') for network in request['networks']}
              if request['networks'] and set(networks) != wanted:
                  fail('compose_network_changed')
              for network in request['networks']:
                  state = networks.get(native(network, 'Network'), {})
                  if state.get('NetworkID') != network['incarnation'] or not set(network.get('aliases', [])).issubset(state.get('Aliases') or []):
                      fail('compose_alias_changed')
              ports = {}
              for binding in request.get('published_ports', []):
                  ports.setdefault(str(binding['container_port']) + '/tcp', []).append(
                      {'HostIp': binding['host_ip'], 'HostPort': str(binding['host_port'])})
              if (host.get('PortBindings') or {}) != ports:
                  fail('compose_publication_changed')

          def ready(identity):
              while time.monotonic() < deadline:
                  row = container(identity)
                  realized(row)
                  if not row.get('State', {}).get('Running'):
                      fail('compose_not_running')
                  native_health = (row['Config'].get('Healthcheck') or {}).get('Test') or []
                  if native_health and native_health[0] != 'NONE':
                      if row['State'].get('Health', {}).get('Status') == 'healthy':
                          return row
                  elif request.get('http_health'):
                      health = request['http_health']
                      status = run(['python3', str(directory / 'http-health.py'), '--container', identity,
                           '--organization', request['organization_id'], '--deployment', request['deployment_id'],
                           '--revision', request['revision_id'], '--port', str(health['port']), '--path', health['path']],
                           allowed=(0, 1), return_code=True)
                      again = container(identity)
                      realized(again)
                      if status == 0 and again['State'].get('Running'):
                          return again
                  else:
                      fail('compose_readiness_missing')
                  time.sleep(min(3, max(0, deadline - time.monotonic())))
              fail('compose_health_failed')

          def observation(current):
              present = current is not None
              identity = current['Id'] if present else previous['container_id']
              revision = request['revision_id'] if present else previous['revision_id']
              mounts = request['mounts'] if present else previous['mounts']
              common = {key: request[key] for key in ('organization_id', 'deployment_id', 'server_id', 'operation_id')}
              def attachment(mount, container_id, revision_id, presence):
                  return {**common, 'protocol': 'opsctl-volume-attachment/1', 'revision_id': revision_id,
                          'attachment_id': mount['attachment_id'], 'backing_id': mount['backing_id'],
                          'generation': mount['generation'], 'container_id': container_id,
                          'presence': presence, 'writer_excluded': True}
              retained = {mount['attachment_id'] for mount in mounts}
              return {**common, 'protocol': 'opsctl-local-runtime/1', 'revision_id': revision,
                      'container_id': identity, 'presence': 'present' if present else 'absent', 'ready': present,
                      'attachments': [attachment(mount, identity, revision, 'present' if present else 'absent') for mount in mounts],
                      'detached_attachments': [attachment(mount, previous['container_id'], previous['revision_id'], 'absent')
                          for mount in previous['mounts'] if present and mount['attachment_id'] not in retained]}

          def native_transition():
              workspace = Path(request['workspace'])
              old = request.get('previous') or {'inventory': {'services': {}, 'networks': {}, 'volumes': {}},
                                                'owned_networks': [], 'owned_volumes': []}
              if native_cleanup and request.get('cleanup_mode', 'witness') == 'witness':
                  old = {'inventory': request['attempt']['partial'],
                         'owned_networks': request['attempt']['owned_networks'],
                         'owned_volumes': request['attempt']['owned_volumes']}
              environment = {key: value for key, value in os.environ.items()
                             if key in {'PATH', 'DOCKER_HOST', 'DOCKER_TLS_VERIFY', 'DOCKER_CERT_PATH'}}
              compose = ['docker', 'compose', '--project-name', project,
                         '--project-directory', str(workspace / request['project_directory'])]
              for path in request['compose_files']:
                  compose.extend(['--file', str(workspace / path)])
              for path in request['env_files']:
                  compose.extend(['--env-file', str(workspace / path)])
              for profile in request['profiles']:
                  compose.extend(['--profile', profile])

              def canonical(value):
                  return json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False).encode()

              def volumes():
                  names = run(['docker', 'volume', 'ls', '--quiet']).decode().splitlines()
                  if len(names) > 4096 or len(set(names)) != len(names):
                      fail('compose_volume_inventory_unknown')
                  return {name: volume(inspect('volume', name)) for name in names}

              def volume(row):
                  if not isinstance(row.get('Name'), str) or not isinstance(row.get('Driver'), str):
                      fail('compose_volume_identity_unknown')
                  created_at = row.get('CreatedAt')
                  if created_at:
                      created_at = datetime.fromisoformat(created_at.replace('Z', '+00:00')).isoformat().replace('+00:00', 'Z')
                  return {'name': row['Name'], 'driver': row['Driver'], 'created_at': created_at,
                          'options_fingerprint': hashlib.sha256(canonical(row.get('Options') or {})).hexdigest()}

              def instance(row):
                  labels = (row.get('Config') or {}).get('Labels') or {}
                  name = labels.get('com.docker.compose.service')
                  replica = labels.get('com.docker.compose.container-number', '')
                  if (labels.get('com.docker.compose.project') != project
                          or labels.get('com.docker.compose.oneoff', '').lower() == 'true'
                          or not replica.isascii() or not replica.isdecimal() or str(int(replica)) != replica
                          or int(replica) < 1 or not re.fullmatch('[a-f0-9]{64}', row.get('Id', ''))):
                      fail('compose_instance_identity_unknown')
                  image = inspect('image', row['Image'])
                  mounts = [{'kind': mount['Type'], 'target': mount['Destination'],
                             'source': mount.get('Source', ''), 'read_only': not mount['RW'],
                             'volume_name': mount.get('Name') if mount['Type'] == 'volume' else None}
                            for mount in row.get('Mounts', [])]
                  ports = []
                  for target, bindings in ((row.get('NetworkSettings') or {}).get('Ports') or {}).items():
                      number, protocol = target.rsplit('/', 1)
                      for binding in bindings or []:
                          ports.append({'protocol': protocol, 'host_ip': binding['HostIp'],
                                        'host_port': int(binding['HostPort']), 'container_port': int(number)})
                  state = row['State']
                  return name, replica, {
                      'container_id': row['Id'], 'container_name': row['Name'].removeprefix('/'),
                      'revision_id': str(UUID(labels['com.opsctl.revision_id'])),
                      'config_image_id': row['Image'], 'repo_digests': sorted(image.get('RepoDigests') or []),
                      'state': state['Status'], 'health': (state.get('Health') or {}).get('Status', 'none'),
                      'exit_code': state['ExitCode'], 'ports': sorted(ports, key=lambda item: canonical(item)),
                      'restart_policy': ((row.get('HostConfig') or {}).get('RestartPolicy') or {}).get('Name') or 'no',
                      'mounts': sorted(mounts, key=lambda item: canonical(item)),
                      'image_volume_targets': sorted((image.get('Config') or {}).get('Volumes') or {}),
                      'networks': {name: value['NetworkID'] for name, value in
                                   ((row.get('NetworkSettings') or {}).get('Networks') or {}).items()},
                  }

              def inventory(*, final=False):
                  expected = request['services'] if final else old['inventory']['services']
                  services = {name: {} for name in expected}
                  ids = run(['docker', 'ps', '-aq', '--no-trunc', '--filter',
                             'label=com.docker.compose.project=' + project]).decode().splitlines()
                  if len(ids) > request['admitted_budget']['instances'] or len(set(ids)) != len(ids):
                      fail('compose_instance_inventory_unknown')
                  mounted = set()
                  for identity in ids:
                      name, replica, observed = instance(inspect('container', identity))
                      if name not in services or replica in services[name]:
                          fail('compose_project_in_use')
                      services[name][replica] = observed
                      mounted.update(mount['volume_name'] for mount in observed['mounts'] if mount['kind'] == 'volume')
                  networks = {}
                  network_names = {value['name'] for value in old['inventory']['networks'].values()}
                  network_names.update(value['name'] for value in request['networks'].values())
                  all_network_ids = run(['docker', 'network', 'ls', '--quiet', '--no-trunc']).decode().splitlines()
                  if len(all_network_ids) > 4096:
                      fail('compose_network_inventory_unknown')
                  all_networks = [inspect('network', identity) for identity in all_network_ids]
                  for name in sorted(network_names):
                      matches = [row for row in all_networks if row.get('Name') == name]
                      if len(matches) > 1:
                          fail('compose_network_identity_unknown')
                      if matches:
                          row = matches[0]
                          networks[row['Id']] = {'native_id': row['Id'], 'name': name, 'driver': row['Driver']}
                  native_volumes = volumes()
                  names = set(old['inventory']['volumes'])
                  names.update(value['name'] for value in request['volumes'].values())
                  names.update(mounted)
                  if mounted - set(native_volumes):
                      fail('compose_mounted_volume_missing')
                  selected = {name: native_volumes[name] for name in names if name in native_volumes}
                  return {'services': services, 'networks': networks, 'volumes': selected}

              if native_cleanup and request.get('cleanup_mode', 'witness') == 'verify_absence':
                  def absence_inventory():
                      found = []
                      explicit = {item['container_name'] for item in request['services'].values()
                                  if item.get('container_name')}
                      ids = run(['docker', 'ps', '-aq', '--no-trunc']).decode().splitlines()
                      if len(ids) > 4096 or len(set(ids)) != len(ids):
                          fail('compose_instance_inventory_unknown')
                      for identity in ids:
                          row = inspect('container', identity)
                          name = row['Name'].removeprefix('/')
                          if (name in explicit or (row.get('Config', {}).get('Labels') or {}).get(
                                  'com.docker.compose.project') == project):
                              found.append({'kind': 'container', 'name': name})
                      observed = {'services': {name: {} for name in request['services']},
                                  'networks': {}, 'volumes': {}}
                      for kind, native_kind in (('networks', 'network'), ('volumes', 'volume')):
                          arguments = ['docker', native_kind, 'ls', '--quiet']
                          if kind == 'networks':
                              arguments.append('--no-trunc')
                          identities = run(arguments).decode().splitlines()
                          if len(identities) > 4096 or len(set(identities)) != len(identities):
                              fail('compose_resource_inventory_unknown')
                          desired = {item['name']: item for item in request[kind].values()}
                          for identity in identities:
                              row = inspect(native_kind, identity)
                              name = row['Name']
                              labelled = (row.get('Labels') or {}).get('com.docker.compose.project') == project
                              intent = desired.get(name)
                              if labelled or intent and intent['ownership'] != 'external':
                                  found.append({'kind': native_kind, 'name': name})
                              elif intent and intent['ownership'] == 'external':
                                  if kind == 'networks':
                                      observed[kind][row['Id']] = {'native_id': row['Id'], 'name': name,
                                                                 'driver': row['Driver']}
                                  else:
                                      observed[kind][name] = volume(row)
                      if found:
                          safe = []
                          for item in found[:64]:
                              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]{0,255}', item['name']):
                                  fail('compose_resource_identity_unknown')
                              safe.append(item)
                          print('OPERATION_STEP=' + json.dumps({
                              'name': 'compose:cleanup-verification', 'status': 'failed',
                              'metadata': {'display_name': 'Prospective Compose resources remain',
                                           'code': 'compose_attempt_resources_present',
                                           'resources': safe, 'resource_count': len(found),
                                           'truncated': len(found) > len(safe)},
                          }, sort_keys=True), flush=True)
                          fail('compose_attempt_resources_present')
                      return observed
                  before = absence_inventory()
                  after = absence_inventory()
                  if before != after:
                      fail('compose_reference_resource_changed')
                  proof = {key: request[key] for key in (
                      'protocol', 'organization_id', 'deployment_id', 'server_id', 'operation_id',
                      'revision_id', 'effective_digest', 'project_name', 'attempt_operation_id',
                      'attempt_job_uid', 'execution_revision_id', 'inventory_digest',
                  )}
                  proof.update(cleanup_mode='verify_absence', before=before, after=after)
                  print('TEMPLATE_OUTPUT_JSON=' + json.dumps({'compose_runtime': proof}, sort_keys=True))
                  return
              before = inventory()
              if native_cleanup and (set(before['networks']) - set(old['inventory']['networks'])
