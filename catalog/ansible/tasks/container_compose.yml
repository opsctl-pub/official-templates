---
- name: Require the managed Compose deployment prerequisite
  ansible.builtin.command: docker compose version --short
  register: compose_version
  changed_when: false
  failed_when: compose_version.rc != 0 or not (compose_version.stdout | trim is match('^v?2\.[0-9]+\.[0-9]+$'))

- name: Allocate a private operation-scoped Compose directory
  ansible.builtin.tempfile:
    state: directory
    prefix: opsctl-compose-
  register: compose_directory
  when: app_compose_runtime is not defined

- name: Select private managed Compose revision directory
  ansible.builtin.set_fact:
    compose_directory:
      path: "/var/lib/opsctl/compose/{{ app_compose_runtime.deployment_id }}/{{ app_compose_runtime.revision_id }}"
  when: app_compose_runtime is defined

- name: Refuse symlinked or writable custody ancestors before file delivery
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    import stat
    from pathlib import Path, PurePosixPath
    request = json.loads({{ app_compose_runtime | to_json | to_json }})
    directory = Path({{ compose_directory.path | to_json }})
    try:
        paths = [directory]
        for item in request['files']:
            relative = PurePosixPath(item['path'])
            if relative.is_absolute() or '..' in relative.parts or not relative.parts:
                raise ValueError
            paths.append(directory / str(relative))
        for path in paths:
            for component in (*reversed(path.parents), path):
                if component.is_symlink():
                    raise ValueError
                if component.exists():
                    info = component.stat()
                    if info.st_uid != 0 or info.st_mode & 0o022:
                        raise ValueError
                    if component != path and not stat.S_ISDIR(info.st_mode):
                        raise ValueError
    except Exception:
        raise SystemExit('Compose custody identity is unavailable.')
    PY
  args:
    executable: /bin/sh
  changed_when: false
  no_log: true
  when: app_compose_runtime is defined

- name: Preserve private revision custody for mounted regular files
  ansible.builtin.file:
    path: "{{ compose_directory.path }}"
    state: directory
    mode: '0700'
  when: app_compose_runtime is defined

- name: Run the exact shared Compose transition
  block:
    - name: Create private reviewed source parent directories
      ansible.builtin.file:
        path: "{{ compose_directory.path }}/{{ item.path | dirname }}"
        state: directory
        mode: '0700'
      loop: "{{ app_compose_runtime.files | default([]) }}"
      no_log: true
      when: app_compose_runtime is defined

    - name: Deliver exact originals and reviewed additions from existing file custody
      ansible.builtin.copy:
        src: "/var/run/opsctl/file-secret/{{ item.name }}"
        dest: "{{ compose_directory.path }}/{{ item.path }}"
        mode: "{{ item.mode }}"
        force: false
      loop: "{{ app_compose_runtime.files | default([]) }}"
      no_log: true
      when: app_compose_runtime is defined

    - name: Render reviewed desired Compose configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/container_compose.yml.j2"
        dest: "{{ compose_directory.path }}/compose.yml"
        mode: '0600'
      no_log: true
      when: app_compose_runtime is not defined and app_local_runtime.action == 'deploy'

    - name: Deliver the existing namespace-only HTTP verifier
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/container_http_health.py"
        dest: "{{ compose_directory.path }}/http-health.py"
        mode: '0600'
      when: app_compose_runtime is not defined

    - name: Hold exclusion through Compose, readiness and final observation
      ansible.builtin.shell: |
        python3 - <<'PY'
        import contextlib
        import hashlib
        import fcntl
        import json
        import os
        import re
        import signal
        import shutil
        import subprocess
        import tempfile
        import time
        from pathlib import Path
        from uuid import UUID

        request = json.loads({{ (app_compose_runtime if app_compose_runtime is defined else app_local_runtime) | to_json | to_json }})
        grouped = request['protocol'] in {'opsctl-compose-runtime/1', 'opsctl-compose-attempt-cleanup/1'}
        prospective_cleanup = request['protocol'] == 'opsctl-compose-attempt-cleanup/1'
        directory = Path({{ compose_directory.path | to_json }})
        deadline = time.monotonic() + {{ app_compose_timeout | default(240) | int }}
        project = 'opsctl-' + UUID(request['deployment_id']).hex
        previous = request.get('previous') or {'mounts': []}
        prefix = 'com.opsctl.'
        locked = []

        def fail(code):
            raise RuntimeError(code)

        def run(arguments, *, allowed=(0,), return_code=False, environment=None):
            remaining = deadline - time.monotonic()
            if remaining <= 0:
                fail('compose_transition_timeout')
            with tempfile.TemporaryFile() as output:
                child = subprocess.Popen(arguments, stdout=output, stderr=subprocess.DEVNULL,
                                         start_new_session=True, pass_fds=tuple(locked), env=environment)
                try:
                    while child.poll() is None:
                        if time.monotonic() >= deadline or os.fstat(output.fileno()).st_size > 1048576:
                            fail('compose_transition_unknown')
                        time.sleep(0.05)
                    if child.returncode not in allowed or os.fstat(output.fileno()).st_size > 1048576:
                        fail('compose_transition_unknown')
                    output.seek(0)
                    return child.returncode if return_code else output.read()
                finally:
                    if child.poll() is None:
                        os.killpg(child.pid, signal.SIGKILL)
                    child.wait()

        def inspect(kind, identity):
            values = json.loads(run(['docker', kind, 'inspect', '--', identity]))
            if not isinstance(values, list) or len(values) != 1:
                fail('compose_identity_unknown')
            return values[0]

        def container(identity):
            ids = run(['docker', 'ps', '-aq', '--no-trunc']).decode().splitlines()
            if len(ids) > 1024:
                fail('compose_inventory_limit')
            if re.fullmatch('[a-f0-9]{64}', identity):
                return inspect('container', identity) if identity in ids else None
            rows = [inspect('container', item) for item in ids]
            found = [row for row in rows if row.get('Name') == '/' + identity]
            if len(found) > 1:
                fail('compose_identity_unknown')
            return found[0] if found else None

        def native(item, family):
            identity = item['volume_id'] if family == 'Volume' else item['id']
            return ('opsctl-' + ('vol' if family == 'Volume' else 'net') + '-'
                    + UUID(request['organization_id']).hex + '-' + UUID(identity).hex
                    + '-g' + str(item['generation']))

        def owned(row, revision, identity=None):
            expected = {'org_id': request['organization_id'], 'deployment_id': request['deployment_id'],
                        'server_id': request['server_id'], 'revision_id': revision, 'managed': 'true'}
            labels = row.get('Config', {}).get('Labels') or {} if row else {}
            if (not row or not re.fullmatch('[a-f0-9]{64}', row.get('Id', ''))
                    or any(labels.get(prefix + key) != value for key, value in expected.items())
                    or labels.get('com.docker.compose.project') != project
                    or labels.get('com.docker.compose.service') != 'app'
                    or (identity is not None and row['Id'] != identity)):
                fail('compose_container_changed')

        def allocations():
            for mount in request['mounts'] + previous['mounts']:
                row = inspect('volume', native(mount, 'Volume'))
                expected = {'managed': 'true', 'org_id': request['organization_id'],
                            'resource_kind': 'Volume', 'resource_id': mount['volume_id'],
                            'volume_id': mount['volume_id'], 'backing_id': mount['backing_id'],
                            'server_id': request['server_id'], 'generation': str(mount['generation'])}
                if (row.get('Name') != native(mount, 'Volume') or row.get('Driver') != 'local'
                        or row.get('Scope') != 'local' or row.get('Options') not in (None, {})
                        or row.get('Labels') != {prefix + key: value for key, value in expected.items()}
                        or row.get('CreatedAt') != mount['incarnation']):
                    fail('compose_volume_changed')
            for network in request['networks'] + previous.get('networks', []):
                row = inspect('network', network['incarnation'])
                expected = {'managed': 'true', 'org_id': request['organization_id'],
                            'resource_kind': 'Network', 'resource_id': network['id'],
                            'server_id': request['server_id'], 'generation': str(network['generation'])}
                if (row.get('Id') != network['incarnation'] or row.get('Name') != native(network, 'Network')
                        or row.get('Driver') != 'bridge' or row.get('Scope') != 'local'
                        or row.get('Internal') is not False
                        or row.get('Labels') != {prefix + key: value for key, value in expected.items()}):
                    fail('compose_network_changed')

        def writers(permitted=None):
            names = {native(mount, 'Volume') for mount in request['mounts'] + previous['mounts']
                     if mount['mode'] == 'rw'}
            ids = run(['docker', 'ps', '-q', '--no-trunc']).decode().splitlines()
            if len(ids) > 1024:
                fail('compose_inventory_limit')
            for identity in ids:
                if identity == permitted:
                    continue
                row = inspect('container', identity)
                state = row.get('State')
                mounts = row.get('Mounts')
                if (not isinstance(state, dict) or type(state.get('Running')) is not bool
                        or not isinstance(mounts, list)):
                    fail('compose_writer_observation_unknown')
                for mount in mounts:
                    if not isinstance(mount, dict) or not isinstance(mount.get('Type'), str):
                        fail('compose_writer_observation_unknown')
                    if mount['Type'] != 'volume':
                        continue
                    if (not isinstance(mount.get('Name'), str) or not mount['Name']
                            or type(mount.get('RW')) is not bool):
                        fail('compose_writer_observation_unknown')
                    if state['Running'] and mount['Name'] in names and mount['RW']:
                        fail('compose_writer_conflict')

        def realized(row):
            owned(row, request['revision_id'])
            config, host = row['Config'], row['HostConfig']
            if config.get('Image') != request['image']:
                fail('compose_image_changed')
            for key, actual in [('command', config.get('Cmd')), ('memory_bytes', host.get('Memory'))]:
                if request.get(key) is not None and request[key] != actual:
                    fail('compose_configuration_changed')
            if request.get('health_exec') is not None and (config.get('Healthcheck') or {}).get('Test') != ['CMD', *request['health_exec']]:
                fail('compose_health_changed')
            for key, value in request.get('env', {}).items():
                if [item for item in config.get('Env', []) if item.startswith(key + '=')] != [key + '=' + value]:
                    fail('compose_environment_changed')
            expected = sorted((native(mount, 'Volume'), mount['path'], mount['mode'] == 'rw') for mount in request['mounts'])
            actual = sorted((mount.get('Name'), mount.get('Destination'), mount.get('RW'))
                            for mount in row.get('Mounts', []) if mount.get('Type') == 'volume')
            if actual != expected:
                fail('compose_mount_changed')
            networks = row.get('NetworkSettings', {}).get('Networks') or {}
            wanted = {native(network, 'Network') for network in request['networks']}
            if request['networks'] and set(networks) != wanted:
                fail('compose_network_changed')
            for network in request['networks']:
                state = networks.get(native(network, 'Network'), {})
                if state.get('NetworkID') != network['incarnation'] or not set(network.get('aliases', [])).issubset(state.get('Aliases') or []):
                    fail('compose_alias_changed')
            ports = {}
            for binding in request.get('published_ports', []):
                ports.setdefault(str(binding['container_port']) + '/tcp', []).append(
                    {'HostIp': binding['host_ip'], 'HostPort': str(binding['host_port'])})
            if (host.get('PortBindings') or {}) != ports:
                fail('compose_publication_changed')

        def ready(identity):
            while time.monotonic() < deadline:
                row = container(identity)
                realized(row)
                if not row.get('State', {}).get('Running'):
                    fail('compose_not_running')
                native_health = (row['Config'].get('Healthcheck') or {}).get('Test') or []
                if native_health and native_health[0] != 'NONE':
                    if row['State'].get('Health', {}).get('Status') == 'healthy':
                        return row
                elif request.get('http_health'):
                    health = request['http_health']
                    status = run(['python3', str(directory / 'http-health.py'), '--container', identity,
                         '--organization', request['organization_id'], '--deployment', request['deployment_id'],
                         '--revision', request['revision_id'], '--port', str(health['port']), '--path', health['path']],
                         allowed=(0, 1), return_code=True)
                    again = container(identity)
                    realized(again)
                    if status == 0 and again['State'].get('Running'):
                        return again
                else:
                    fail('compose_readiness_missing')
                time.sleep(min(3, max(0, deadline - time.monotonic())))
            fail('compose_health_failed')

        def observation(current):
            present = current is not None
            identity = current['Id'] if present else previous['container_id']
            revision = request['revision_id'] if present else previous['revision_id']
            mounts = request['mounts'] if present else previous['mounts']
            common = {key: request[key] for key in ('organization_id', 'deployment_id', 'server_id', 'operation_id')}
            def attachment(mount, container_id, revision_id, presence):
                return {**common, 'protocol': 'opsctl-volume-attachment/1', 'revision_id': revision_id,
                        'attachment_id': mount['attachment_id'], 'backing_id': mount['backing_id'],
                        'generation': mount['generation'], 'container_id': container_id,
                        'presence': presence, 'writer_excluded': True}
            retained = {mount['attachment_id'] for mount in mounts}
            return {**common, 'protocol': 'opsctl-local-runtime/1', 'revision_id': revision,
                    'container_id': identity, 'presence': 'present' if present else 'absent', 'ready': present,
                    'attachments': [attachment(mount, identity, revision, 'present' if present else 'absent') for mount in mounts],
                    'detached_attachments': [attachment(mount, previous['container_id'], previous['revision_id'], 'absent')
                        for mount in previous['mounts'] if present and mount['attachment_id'] not in retained]}

        def grouped_transition():
            if request['project_name'] != project:
                fail('compose_project_identity_changed')
            for item in request['files']:
                path = directory / item['path']
                if (path.is_symlink() or not path.is_file()
                        or hashlib.sha256(path.read_bytes()).hexdigest() != item['sha256']
                        or (path.stat().st_mode & 0o777) != int(item['mode'], 8)):
                    fail('compose_file_changed')
            effective = [item for item in request['files'] if item['path'].endswith('/effective.json')]
            if len(effective) != 1:
                fail('compose_model_missing')
            model = json.loads((directory / effective[0]['path']).read_bytes())
            if set(model.get('services', {})) != set(request['services']):
                fail('compose_model_changed')
            old = request.get('previous') or {'containers': {}, 'networks': {}}
            base_labels = {prefix + key: request[key] for key in ('organization_id', 'deployment_id', 'server_id')}
            base_labels[prefix + 'org_id'] = base_labels.pop(prefix + 'organization_id')
            base_labels[prefix + 'managed'] = 'true'

            def project_containers():
                ids = run(['docker', 'ps', '-aq', '--no-trunc', '--filter',
                           'label=com.docker.compose.project=' + project]).decode().splitlines()
                if len(ids) > 8 or len(set(ids)) != len(ids):
                    fail('compose_project_inventory_changed')
                return {identity: inspect('container', identity) for identity in ids}

            def group_owned(row, name, revision, identity=None):
                labels = (row.get('Config') or {}).get('Labels') or {} if row else {}
                if (not row or any(labels.get(key) != value for key, value in base_labels.items())
                        or labels.get(prefix + 'revision_id') != revision
                        or labels.get('com.docker.compose.project') != project
                        or labels.get('com.docker.compose.service') != name
                        or not re.fullmatch('[a-f0-9]{64}', row.get('Id', ''))
                        or identity is not None and row['Id'] != identity):
                    fail('compose_container_changed')

            def project_networks(allowed_containers):
                ids = run(['docker', 'network', 'ls', '--no-trunc', '-q', '--filter',
                           'label=com.docker.compose.project=' + project]).decode().splitlines()
                if len(ids) > 16 or len(set(ids)) != len(ids):
                    fail('compose_network_inventory_changed')
                result = {}
                for identity in ids:
                    row = inspect('network', identity)
                    labels = row.get('Labels') or {}
                    name = labels.get('com.docker.compose.network')
                    expected_name = project + '-' + hashlib.sha256(str(name).encode()).hexdigest()[:16]
                    members = row.get('Containers')
                    if (not isinstance(name, str) or name in result or row.get('Id') != identity
                            or row.get('Name') != expected_name or row.get('Driver') != 'bridge'
                            or row.get('Scope') != 'local' or row.get('Options') not in ({}, None)
                            or any(labels.get(key) != value for key, value in base_labels.items())
                            or not isinstance(members, dict) or set(members) - allowed_containers):
                        fail('compose_network_changed')
                    if prospective_cleanup and name not in request['network_names']:
                        fail('compose_network_changed')
                    result[name] = identity
                return result

            current = project_containers()
            if prospective_cleanup:
                if (request['action'] != 'remove' or request.get('previous') is not None
                        or request['attempt_operation_id'] != request['revision_id']
                        or request['attempt_job_name'] != 'op-' + UUID(request['attempt_operation_id']).hex):
                    fail('compose_attempt_cleanup_invalid')
                observed_attempt = {}
                accounted = set()
                for name, expected in request['services'].items():
                    row = container(expected['container_name'])
                    if row is not None:
                        group_owned(row, name, request['revision_id'])
                        if (row['Id'] not in current or row['Name'] != '/' + expected['container_name']
                                or row['Config'].get('Image') != expected['image']):
                            fail('compose_attempt_cleanup_invalid')
                        accounted.add(row['Id'])
                    observed_attempt[name] = row['Id'] if row else None
                if accounted != set(current):
                    fail('compose_project_inventory_changed')
                attempt_networks = project_networks(accounted)
                old = {'revision_id': request['revision_id'],
                       'containers': {name: identity for name, identity in observed_attempt.items()
                                      if identity is not None}, 'networks': attempt_networks}
            new_revision = request['action'] == 'deploy' and bool(current) and all(
                (row.get('Config', {}).get('Labels') or {}).get(prefix + 'revision_id') == request['revision_id']
                for row in current.values())
            if current and new_revision and request['action'] == 'deploy':
                if len(current) != len(request['services']):
                    fail('compose_project_inventory_changed')
                for name, expected in request['services'].items():
                    row = container(expected['container_name'])
                    group_owned(row, name, request['revision_id'])
                    if row['Id'] not in current:
                        fail('compose_project_inventory_changed')
            else:
                if set(current) != set(old['containers'].values()) and current:
                    fail('compose_previous_identity_missing')
                if request['action'] == 'deploy' and old['containers'] and not current:
                    fail('compose_previous_identity_missing')
                for name, identity in old['containers'].items():
                    row = current.get(identity)
                    if row is not None:
                        group_owned(row, name, old['revision_id'], identity)
            for name, expected in request['services'].items():
                row = container(expected['container_name'])
                if row is not None and row['Id'] not in current:
                    fail('compose_container_name_conflict')
            networks = project_networks(set(current))
            if not new_revision and networks != old['networks']:
                if not (request['action'] == 'remove' and not current and not networks):
                    fail('compose_network_changed')
            for name in request['network_names']:
                native_name = project + '-' + hashlib.sha256(name.encode()).hexdigest()[:16]
                ids = run(['docker', 'network', 'ls', '--no-trunc', '-q', '--filter', 'name=^' + native_name + '$']).decode().splitlines()
                if any(identity not in networks.values() for identity in ids):
                    fail('compose_network_name_conflict')
            compose = ['docker', 'compose', '--project-name', project,
                       '--project-directory', str(directory / request['project_directory'])]
            for path in request['compose_files']:
                compose.extend(['--file', str(directory / path)])
            for path in request['env_files']:
                compose.extend(['--env-file', str(directory / path)])
            for profile in request['profiles']:
                compose.extend(['--profile', profile])
            environment = {key: value for key, value in os.environ.items()
                           if key in {'PATH', 'DOCKER_HOST', 'DOCKER_TLS_VERIFY', 'DOCKER_CERT_PATH'}}
            if request['action'] == 'deploy':
                for name, expected in request['services'].items():
                    image = inspect('image', expected['image'])
                    declared = (image.get('Config') or {}).get('Volumes') or {}
                    if not isinstance(declared, dict):
                        fail('compose_image_storage_unknown')
                    covered = {mount['target'] for mount in model['services'][name].get('volumes', [])
                               if mount.get('type') == 'bind' and mount.get('read_only') is True
                               and mount.get('source') in {item['path'] for item in request['files']}}
                    for kind in ('configs', 'secrets'):
                        for mount in model['services'][name].get(kind, []):
                            resource = model.get(kind, {}).get(mount.get('source'), {})
                            if resource.get('file') in {item['path'] for item in request['files']}:
                                covered.add(mount.get('target') or '/' + mount['source'])
                    if set(declared) - covered:
                        fail('compose_image_storage_unsupported')
                if not new_revision:
                    run([*compose, 'up', '--detach', '--remove-orphans', '--pull', 'never'], environment=environment)
                while True:
                    current = project_containers()
                    if len(current) != len(request['services']):
                        fail('compose_project_inventory_changed')
                    observed = {}
                    waiting = False
                    for name, expected in request['services'].items():
                        row = container(expected['container_name'])
                        group_owned(row, name, request['revision_id'])
                        if row['Id'] not in current or row['Config'].get('Image') != expected['image']:
                            fail('compose_image_changed')
                        if not row.get('State', {}).get('Running'):
                            fail('compose_not_running')
                        if any(mount.get('Type') == 'volume' for mount in row.get('Mounts', [])):
                            fail('compose_storage_unsupported')
                        health = row['State'].get('Health', {}).get('Status')
                        if expected['health_declared']:
                            waiting = waiting or health != 'healthy'
                        observed[name] = {'container_id': row['Id'], 'image': expected['image'],
                                          'state': 'healthy' if expected['health_declared'] else 'started'}
                    if not waiting:
                        break
                    if time.monotonic() >= deadline:
                        fail('compose_health_failed')
                    time.sleep(min(1, max(0, deadline - time.monotonic())))
                retired = {name: identity for name, identity in old['containers'].items() if identity not in current}
                if any(container(identity) is not None for identity in retired.values()):
                    fail('compose_retired_container_present')
                networks = project_networks(set(current))
                for name in set(networks) - set(request['network_names']):
                    if old['networks'].get(name) != networks[name]:
                        fail('compose_network_changed')
                    row = inspect('network', networks[name])
                    if row['Containers']:
                        fail('compose_network_in_use')
                    run(['docker', 'network', 'rm', networks[name]])
                networks = project_networks(set(current))
                if set(networks) != set(request['network_names']):
                    fail('compose_network_inventory_changed')
                presence = 'present'
            else:
                if current or networks:
                    run([*compose, 'down', '--timeout', '20'], environment=environment)
                if project_containers() or project_networks(set()):
                    fail('compose_removal_unknown')
                remaining_networks = set(run(['docker', 'network', 'ls', '--no-trunc', '-q']).decode().splitlines())
                if remaining_networks.intersection(old['networks'].values()):
                    fail('compose_removal_unknown')
                for name in request['network_names']:
                    native_name = project + '-' + hashlib.sha256(name.encode()).hexdigest()[:16]
                    if run(['docker', 'network', 'ls', '--no-trunc', '-q', '--filter',
                            'name=^' + native_name + '$']).decode().splitlines():
                        fail('compose_removal_unknown')
                for name, expected in request['services'].items():
                    identity = old['containers'].get(name)
                    if (identity is not None and container(identity) is not None
                            or container(expected['container_name']) is not None):
                        fail('compose_removal_unknown')
                networks, retired = {}, {}
                observed = {name: {'container_id': old['containers'].get(name),
                                  'image': expected['image'], 'state': 'absent'}
                            for name, expected in request['services'].items()}
                presence = 'absent'
            obsolete_revisions = {old.get('revision_id')} - {None, request['revision_id']}
            if request['action'] == 'remove':
                obsolete_revisions.add(request['revision_id'])
            custody_paths = [Path('/var/lib/opsctl/compose') / str(UUID(request['deployment_id'])) / str(UUID(revision))
                             for revision in obsolete_revisions]
            if custody_paths:
                ids = run(['docker', 'ps', '-aq', '--no-trunc']).decode().splitlines()
                if len(ids) > 1024:
                    fail('compose_inventory_limit')
                for identity in ids:
                    mounts = inspect('container', identity).get('Mounts')
                    if not isinstance(mounts, list):
                        fail('compose_mount_observation_unknown')
                    for mount in mounts:
                        if not isinstance(mount, dict) or not isinstance(mount.get('Source'), str):
                            fail('compose_mount_observation_unknown')
                        source = Path(mount['Source'])
                        if any(source == path or path in source.parents for path in custody_paths):
                            fail('compose_file_custody_in_use')
                for path in custody_paths:
                    if path.is_symlink():
                        fail('compose_file_custody_changed')
                    if path.exists():
                        shutil.rmtree(path)
            proof = {key: request[key] for key in ('protocol', 'organization_id', 'deployment_id', 'server_id',
                                                  'operation_id', 'revision_id', 'effective_digest', 'project_name')}
            proof.update(presence=presence, services=observed, networks=networks, retired_containers=retired)
            if prospective_cleanup:
                proof.pop('retired_containers')
                proof.update(attempt_operation_id=request['attempt_operation_id'],
                             attempt_job_uid=request['attempt_job_uid'],
                             networks={name: attempt_networks.get(name) for name in request['network_names']})
            print('TEMPLATE_OUTPUT_JSON=' + json.dumps({'compose_runtime': proof}, sort_keys=True))

        try:
            with contextlib.ExitStack() as stack:
                root = Path('/run/lock/opsctl-compose')
                root.mkdir(mode=0o700, parents=True, exist_ok=True)
                keys = {'deployment-' + UUID(request['deployment_id']).hex}
                keys.update('volume-' + UUID(mount['backing_id']).hex for mount in request.get('mounts', []) + previous.get('mounts', []))
                keys.update('network-' + UUID(network['id']).hex
                            for network in request.get('networks', []) + (previous.get('networks', []) if not grouped else []))
                for key in sorted(keys):
                    fd = os.open(root / key, os.O_CREAT | os.O_RDWR | os.O_NOFOLLOW, 0o600)
                    stack.callback(os.close, fd)
                    while True:
                        try:
                            fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                            break
                        except BlockingIOError:
                            if time.monotonic() >= deadline:
                                fail('compose_lock_timeout')
                            time.sleep(0.05)
                    locked.append(fd)
                if grouped:
                    grouped_transition()
                    raise SystemExit(0)
                allocations()
                current = container(request['container_name'])
                project_ids = run(['docker', 'ps', '-aq', '--no-trunc', '--filter',
                                   'label=com.docker.compose.project=' + project]).decode().splitlines()
                if set(project_ids) != ({current['Id']} if current else set()):
                    fail('compose_project_identity_changed')
                config = directory / 'compose.yml'
                compose = ['docker', 'compose', '--project-name', project, '--file', str(config)]
                if request['action'] == 'remove':
                    if current is not None:
                        owned(current, previous['revision_id'], previous['container_id'])
                        config.write_text(json.dumps({'name': project, 'services': {'app': {
                            'image': current['Config']['Image'], 'container_name': request['container_name']}}}))
                        run([*compose, 'down', '--timeout', '20'])
                    if container(previous['container_id']) is not None or container(request['container_name']) is not None:
                        fail('compose_removal_unknown')
                    writers()
                    proof = observation(None)
                else:
                    if current is not None and current.get('Config', {}).get('Labels', {}).get(prefix + 'revision_id') != request['revision_id']:
                        if not request.get('previous'):
                            fail('compose_previous_identity_missing')
                        owned(current, previous['revision_id'], previous['container_id'])
                        run(['docker', 'stop', '--time', '20', current['Id']])
                        stopped = container(current['Id'])
                        owned(stopped, previous['revision_id'], previous['container_id'])
                        if stopped['State'].get('Running'):
                            fail('compose_old_writer_running')
                        current = None
                    if current is None:
                        writers()
                        run([*compose, 'up', '--detach', '--no-deps', '--pull', 'never', 'app'])
                        current = container(request['container_name'])
                    realized(current)
                    current = ready(current['Id'])
                    writers(current['Id'])
                    allocations()
                    proof = observation(current)
                print('TEMPLATE_OUTPUT_JSON=' + json.dumps({'local_runtime': proof}, sort_keys=True))
        except Exception as error:
            code = 'compose_transition_unknown'
            if (isinstance(error, RuntimeError) and len(error.args) == 1
                    and isinstance(error.args[0], str)
                    and re.fullmatch(r'compose_[a-z_]{1,56}', error.args[0])):
                code = error.args[0]
            print(code, file=__import__('sys').stderr)
            raise SystemExit(1)
        PY
      args:
        executable: /bin/sh
      register: compose_transition
      no_log: true
      changed_when: false
      failed_when: false

    - name: Require exact Compose transition evidence
      ansible.builtin.fail:
        msg: >-
          {{ compose_transition.stderr
             if compose_transition.stderr is match('^compose_[a-z_]{1,56}$')
             else 'compose_transition_unknown' }}
      when: compose_transition.rc != 0

    - name: Publish value-free Compose observation
      ansible.builtin.debug:
        msg: "{{ compose_transition.stdout }}"
  always:
    - name: Remove private operation-scoped Compose files
      ansible.builtin.file:
        path: "{{ compose_directory.path }}"
        state: absent
      when: app_compose_runtime is not defined
