---
- name: Validate workload secret file invocation
  ansible.builtin.assert:
    that:
      - workload_secret_action in ['stage', 'cleanup']
      - workload_secret_incarnation is string
      - workload_secret_incarnation is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - app_org_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - app_deployment_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - server_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
    fail_msg: Workload secret file identity is invalid.

- name: Derive the fixed workload secret namespace
  ansible.builtin.set_fact:
    workload_secret_root: /var/lib/opsctl/workload-secrets
    workload_secret_directory: "/var/lib/opsctl/workload-secrets/{{ app_org_id }}/{{ app_deployment_id }}/{{ server_id }}/{{ workload_secret_incarnation }}"
    workload_secret_parents:
      - /var
      - /var/lib
      - /var/lib/opsctl

- name: Inspect fixed system parents without following links
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop: "{{ workload_secret_parents }}"
  register: workload_system_parents

- name: Refuse mutable or linked system parents
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir and not item.stat.islnk and item.stat.uid == 0 and item.stat.mode[-2] in ['0', '1', '4', '5'] and item.stat.mode[-1] in ['0', '1', '4', '5'])
    fail_msg: Workload secret file parent is unsafe.
  loop: "{{ workload_system_parents.results }}"
  loop_control:
    label: fixed parent

- name: Create the fixed platform parent only when absent
  ansible.builtin.file:
    path: /var/lib/opsctl
    state: directory
    owner: '0'
    group: '0'
    mode: '0755'
    follow: false
  when:
    - workload_secret_action == 'stage'
    - not workload_system_parents.results[2].stat.exists

- name: Inspect each confined directory component without following links
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - "{{ workload_secret_root }}"
    - "{{ workload_secret_root }}/{{ app_org_id }}"
    - "{{ workload_secret_root }}/{{ app_org_id }}/{{ app_deployment_id }}"
    - "{{ workload_secret_root }}/{{ app_org_id }}/{{ app_deployment_id }}/{{ server_id }}"
    - "{{ workload_secret_directory }}"
  register: workload_secret_directories

- name: Refuse a linked or foreign workload secret directory
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir and not item.stat.islnk and item.stat.uid == 0 and item.stat.gid == 0 and item.stat.mode == '0700')
    fail_msg: Workload secret directory ownership is unavailable.
  loop: "{{ workload_secret_directories.results }}"
  loop_control:
    label: confined component

- name: Create only absent confined directory components
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: '0'
    group: '0'
    mode: '0700'
    follow: false
  loop: "{{ workload_secret_directories.results }}"
  loop_control:
    label: confined component
  when:
    - workload_secret_action == 'stage'
    - not item.stat.exists

- name: Manage the exact admitted file directory
  when: workload_secret_action == 'stage' or workload_secret_directories.results[-1].stat.exists
  no_log: true
  block:
    - name: Inspect the ownership manifest without following a link
      ansible.builtin.stat:
        path: "{{ workload_secret_directory }}/manifest.json"
        follow: false
        get_checksum: false
        get_mime: false
      register: workload_manifest_stat

    - name: Require a regular root-owned manifest when present
      ansible.builtin.assert:
        that:
          - not workload_manifest_stat.stat.exists or (workload_manifest_stat.stat.isreg and not workload_manifest_stat.stat.islnk and workload_manifest_stat.stat.nlink == 1 and workload_manifest_stat.stat.uid == 0 and workload_manifest_stat.stat.gid == 0 and workload_manifest_stat.stat.mode == '0400' and workload_manifest_stat.stat.size <= 32768)
          - workload_secret_action == 'stage' or workload_manifest_stat.stat.exists
        fail_msg: Workload secret ownership is unavailable.

    - name: Read the existing private ownership manifest
      ansible.builtin.slurp:
        src: "{{ workload_secret_directory }}/manifest.json"
      register: workload_manifest_stored
      when: workload_manifest_stat.stat.exists

    - name: Read only the bounded metadata from the private delivery
      ansible.builtin.set_fact:
        workload_secret_manifest: "{{ lookup('ansible.builtin.file', '/var/run/opsctl/file-secret/workload-secret-files.json', lstrip=false, rstrip=false) | from_json }}"
      when: workload_secret_action == 'stage'

    - name: Use the retained manifest for qualified cleanup
      ansible.builtin.set_fact:
        workload_secret_manifest: "{{ workload_manifest_stored.content | b64decode | from_json }}"
      when: workload_secret_action == 'cleanup'

    - name: Validate the exact manifest and namespace
      ansible.builtin.assert:
        that:
          - workload_secret_manifest is mapping
          - workload_secret_manifest.keys() | list | sort == ['deployment_id', 'files', 'operation_id', 'organization_id', 'server_id', 'version']
          - workload_secret_manifest.version is integer and workload_secret_manifest.version is not boolean and workload_secret_manifest.version == 1
          - workload_secret_manifest.operation_id == workload_secret_incarnation
          - workload_secret_manifest.organization_id == app_org_id
          - workload_secret_manifest.deployment_id == app_deployment_id
          - workload_secret_manifest.server_id == server_id
          - workload_secret_manifest.files is sequence and workload_secret_manifest.files is not string and workload_secret_manifest.files is not mapping
          - workload_secret_manifest.files | length >= 1 and workload_secret_manifest.files | length <= 16
          - not workload_manifest_stat.stat.exists or (workload_manifest_stored.content | b64decode | from_json) == workload_secret_manifest
        fail_msg: Workload secret manifest does not match its admitted incarnation.

    - name: Validate each closed file selection
      ansible.builtin.assert:
        that:
          - item is mapping and item.keys() | list | sort == ['gid', 'mode', 'name', 'target', 'uid']
          - item.name == 'secret-%02d' | format(workload_secret_index)
          - item.target is string and item.target | length <= 256
          - item.target.startswith('/run/secrets/') and '\\' not in item.target
          - item.target.split('/')[1:] | intersect(['', '.', '..']) | length == 0
          - item.target is not search('[\x00-\x20\x7f]')
          - item.uid is integer and item.uid is not boolean and item.uid >= 0 and item.uid <= 2147483647
          - item.gid is integer and item.gid is not boolean and item.gid >= 0 and item.gid <= 2147483647
          - item.mode is string and item.mode in ['0400', '0440']
        fail_msg: Workload secret file selection is invalid.
      loop: "{{ workload_secret_manifest.files }}"
      loop_control:
        index_var: workload_secret_index
        label: private file

    - name: Require unique nonoverlapping file destinations
      ansible.builtin.assert:
        that:
          - item.0.target != item.1.target and not item.0.target.startswith(item.1.target ~ '/') and not item.1.target.startswith(item.0.target ~ '/')
        fail_msg: Workload secret targets overlap.
      loop: "{{ workload_secret_manifest.files | product(workload_secret_manifest.files) | list }}"
      when: item.0.name != item.1.name
      loop_control:
        label: private target pair

    - name: List directory entries without recursive traversal
      ansible.builtin.find:
        paths: "{{ workload_secret_directory }}"
        file_type: any
        recurse: false
        follow: false
        hidden: true
        get_checksum: false
      register: workload_secret_entries

    - name: Refuse foreign entries or linked files
      ansible.builtin.assert:
        that:
          - item.isreg and not item.islnk
          - item.path | basename in (['manifest.json'] + (workload_secret_manifest.files | map(attribute='name') | list))
          - workload_manifest_stat.stat.exists or workload_secret_entries.matched == 0
        fail_msg: Workload secret directory contains unowned entries.
      loop: "{{ workload_secret_entries.files }}"
      loop_control:
        label: private entry

    - name: Persist ownership before staging any value
      ansible.builtin.copy:
        content: "{{ workload_secret_manifest | to_json }}"
        dest: "{{ workload_secret_directory }}/manifest.json"
        owner: '0'
        group: '0'
        mode: '0400'
        follow: false
        unsafe_writes: false
      when: workload_secret_action == 'stage'

    - name: Check immutable Kubernetes projected file sizes without reading values into variables
      ansible.builtin.stat:
        path: "/var/run/opsctl/file-secret/{{ item.name }}"
        follow: true
        get_checksum: false
        get_mime: false
      delegate_to: 127.0.0.1
      become: false
      loop: "{{ workload_secret_manifest.files }}"
      register: workload_secret_sources
      when: workload_secret_action == 'stage'

    - name: Require bounded regular delivery files
      ansible.builtin.assert:
        that:
          - item.stat.exists and item.stat.isreg and item.stat.size <= 65536
          - workload_secret_sources.results | map(attribute='stat.size') | sum <= 131072
        fail_msg: Workload secret delivery exceeds its bounds.
      loop: "{{ workload_secret_sources.results }}"
      when: workload_secret_action == 'stage'
      loop_control:
        label: private source

    - name: Inspect each exact target file before atomic staging
      ansible.builtin.stat:
        path: "{{ workload_secret_directory }}/{{ item.name }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop: "{{ workload_secret_manifest.files }}"
      register: workload_secret_destinations
      when: workload_secret_action == 'stage'

    - name: Refuse linked or foreign staging targets
      ansible.builtin.assert:
        that:
          - not item.stat.exists or (item.stat.isreg and not item.stat.islnk and item.stat.nlink == 1 and item.stat.uid == item.item.uid and item.stat.gid == item.item.gid and item.stat.mode == item.item.mode)
        fail_msg: Workload secret staging target is unsafe.
      loop: "{{ workload_secret_destinations.results }}"
      when: workload_secret_action == 'stage'
      loop_control:
        label: private target

    - name: Atomically stage the exact bytes and numeric permissions
      ansible.builtin.copy:
        src: "/var/run/opsctl/file-secret/{{ item.name }}"
        dest: "{{ workload_secret_directory }}/{{ item.name }}"
        owner: "{{ item.uid | string }}"
        group: "{{ item.gid | string }}"
        mode: "{{ item.mode }}"
        follow: false
        unsafe_writes: false
      loop: "{{ workload_secret_manifest.files }}"
      when: workload_secret_action == 'stage'
      loop_control:
        label: private file

    - name: Remove only the owned regular files after qualified workload absence
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
        follow: false
      loop: "{{ workload_secret_entries.files }}"
      when: workload_secret_action == 'cleanup'
      loop_control:
        label: private file

    - name: Remove the now-empty exact incarnation directory without recursion
      ansible.builtin.command:
        argv: [rmdir, '--', "{{ workload_secret_directory }}"]
      when: workload_secret_action == 'cleanup'
