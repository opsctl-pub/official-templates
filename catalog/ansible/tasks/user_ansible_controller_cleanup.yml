---
- name: Observe exact process closure without adopting an existing invocation
  block:
    - name: Treat only an invocation with no attempted creation as unstarted
      ansible.builtin.set_fact:
        controller_process_closed: true
      when:
        - not (controller_creation_attempted | default(false))
        - not (controller_existing_invocation | default(false))
        - controller_record_owned | default(false)

    - name: Require a fresh closure observation before any corresponding release
      ansible.builtin.set_fact:
        controller_process_closed: false
      when: controller_container_id is not none

    - name: Close the exact recorded process through the public helper
      ansible.builtin.command:
        argv: "{{ ['/bin/sh', controller_record + '/close.sh', controller_record, controller_cleanup_operation, 'normal'] + (['terminal-bash-gate'] if controller_terminal_gate_fence_qualified | default(false) else []) }}"
        expand_argument_vars: false
      environment:
        FENCE_RECORD_DEVICE: "{{ controller_record_identity.stat.dev | default('') | string }}"
        FENCE_RECORD_INODE: "{{ controller_record_identity.stat.inode | default('') | string }}"
        FENCE_GATE_DEVICE: "{{ controller_journal.private_identities.gate.dev | default('') | string }}"
        FENCE_GATE_INODE: "{{ controller_journal.private_identities.gate.inode | default('') | string }}"
        FENCE_JOURNAL_DIGEST: "{{ controller_journal_after.stat.checksum | default('') }}"
      when: controller_container_id is not none
      register: controller_closed
      no_log: true

    - name: Require actual close-helper observation before material release
      ansible.builtin.set_fact:
        controller_process_closed: true
        controller_close_presence: "{{ controller_closed.stdout.split(':')[2] }}"
        controller_timed_out: >-
          {{ controller_timed_out if (controller_execution_known | default(false) or controller_terminal_gate_fence_qualified | default(false))
          else controller_closed.stdout.split(':')[1] == 'deadline' }}
      when:
        - controller_container_id is not none
        - controller_closed.rc == 0
        - controller_closed.stdout is regex('process_closed:(normal|deadline|exited|absent):(stopped|absent)', match_type='fullmatch')

    - name: Refuse release when process identity or closure is unknown
      ansible.builtin.assert:
        that: controller_process_closed

    - name: Report actual deadline closure decision rather than timer activation
      ansible.builtin.set_fact:
        controller_reason: deadline_expired
        controller_outcome: timed_out
      when:
        - controller_timed_out
        - not (controller_execution_known | default(false))
  rescue:
    - name: Preserve the original reason and this phase liability
      ansible.builtin.set_fact:
        controller_original_reason: >-
          {{ controller_original_reason if controller_original_reason is not none else
          (controller_reason if controller_outcome != 'succeeded' else 'cleanup_failed') }}
        controller_reason: "{{ 'existing_invocation' if controller_existing_invocation | default(false) else 'cleanup_failed' }}"
        controller_outcome: "{{ controller_outcome if controller_execution_known | default(false) else ('refused' if controller_existing_invocation | default(false) else 'unknown') }}"
  when:
    - not (controller_collect_only | default(false))
    - not (controller_partial_finalizer | default(false))
  no_log: true

- name: Fence exact allocation-complete Bash effects before releasing other liabilities
  block:
    - name: Reobserve all original labels and frozen Bash command before removal
      community.docker.docker_container_info:
        name: "{{ controller_container_id }}"
      register: controller_fence_before_remove

    - name: Require the exact stopped network-none gate identity
      ansible.builtin.assert:
        that:
          - controller_fence_before_remove.exists
          - controller_fence_before_remove.container.Id == controller_container_id
          - controller_fence_before_remove.container.Config.Labels['opsctl.operation'] == controller_cleanup_operation
          - controller_fence_before_remove.container.Config.Labels['opsctl.source_digest'] == controller_journal.source_digest
          - controller_fence_before_remove.container.Config.Labels['opsctl.input_digest'] == controller_journal.input_digest
          - controller_fence_before_remove.container.Config.Labels['opsctl.payload_engine'] == 'bash'
          - controller_fence_before_remove.container.Config.Cmd == ['/run/opsctl-gate'] + controller_journal.payload_argv
          - controller_fence_before_remove.container.HostConfig.NetworkMode == 'none'
          - controller_fence_before_remove.container.NetworkSettings.Networks.keys() | list | difference(['none']) | length == 0
          - controller_fence_before_remove.container.State.Running is sameas false
          - controller_fence_before_remove.container.State.Pid is integer
          - controller_fence_before_remove.container.State.Pid is not boolean
          - controller_fence_before_remove.container.State.Pid == 0
      when: controller_fence_before_remove.exists

    - name: Remove only this stopped full-ID gate without recreating it
      community.docker.docker_container:
        name: "{{ controller_container_id }}"
        state: absent
        keep_volumes: true
      when: controller_fence_before_remove.exists

    - name: Positively observe exact full-ID absence before deadline or material release
      community.docker.docker_container_info:
        name: "{{ controller_container_id }}"
      register: controller_fence_after_remove

    - name: Refuse uncertain removal rather than infer an effect fence
      ansible.builtin.assert:
        that: controller_fence_after_remove.exists is sameas false

    - name: Retain only authoritative absence without manufacturing writer completion
      ansible.builtin.set_fact:
        controller_effect_fenced: true
        controller_close_presence: absent
  rescue:
    - name: Keep ambiguous effect removal and original outcome independent
      ansible.builtin.set_fact:
        controller_effect_fenced: false
        controller_original_reason: "{{ controller_original_reason if controller_original_reason is not none else controller_reason }}"
        controller_reason: cleanup_failed
  when:
    - controller_terminal_gate_fence_qualified | default(false)
    - not (controller_partial_finalizer | default(false))
    - controller_process_closed
    - not (controller_collect_only | default(false))
  no_log: true

- name: Collect bounded logs independently of safe liability cleanup
  block:
    - name: Read only a bounded merged log prefix before Ansible registration
      ansible.builtin.shell: |
        exec timeout -k 2 15 /bin/sh <<'OPSCTL_LOGS'
        set -eu
        umask 077
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT HUP INT TERM
        mkfifo "$tmp/stream"
        (
          set +e
          timeout -k 2 10 docker --host unix:///var/run/docker.sock logs "$CONTAINER" >"$tmp/stream" 2>&1
          printf '%s\n' "$?" >"$tmp/status"
        ) &
        reader=$!
        head -c "$((BUDGET + 1))" <"$tmp/stream" >"$tmp/raw"
        wait "$reader"
        count=$(wc -c <"$tmp/raw")
        status=$(cat "$tmp/status")
        case "$status" in
          0) ;;
          141) test "$count" -gt "$BUDGET" || exit 70 ;;
          *) exit 70 ;;
        esac
        if [ "$count" -gt "$BUDGET" ]; then printf 'truncated\n'; else printf 'complete\n'; fi
        head -c "$BUDGET" "$tmp/raw" | iconv -c -f UTF-8 -t UTF-8
        OPSCTL_LOGS
      args:
        executable: /bin/sh
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        DOCKER_CONTEXT: ''
        DOCKER_TLS_VERIFY: ''
        DOCKER_CERT_PATH: ''
        DOCKER_API_VERSION: ''
        CONTAINER: "{{ controller_container_id }}"
        BUDGET: "{{ controller_log_budget | string }}"
      register: controller_bounded_logs
      changed_when: false
      no_log: true
      when:
        - controller_container_id is not none
        - controller_close_presence | default('unknown') != 'absent'

    - name: Record bounded UTF8 output without raw module Output
      ansible.builtin.set_fact:
        controller_logs_truncated: "{{ controller_bounded_logs.stdout.startswith('truncated\n') }}"
        controller_logs: "{{ controller_bounded_logs.stdout.partition('\n')[2] }}"
      when:
        - controller_container_id is not none
        - controller_close_presence | default('unknown') != 'absent'
      no_log: true
  rescue:
    - name: Preserve the original reason and this phase liability
      ansible.builtin.set_fact:
        controller_original_reason: >-
          {{ controller_original_reason if controller_original_reason is not none else
          (controller_reason if controller_outcome != 'succeeded' else 'log_collection_failed') }}
        controller_reason: log_collection_failed
        controller_outcome: "{{ controller_outcome if controller_execution_known | default(false) else 'unknown' }}"
  when:
    - controller_process_closed or (controller_collect_only | default(false))
    - not (controller_existing_invocation | default(false))
    - controller_log_budget | default(0) | int > 0
  no_log: true

- name: Remove only the exact closed container or observe its absence
  block:
    - name: Observe exact identity once more before native removal
      community.docker.docker_container_info:
        name: "{{ controller_container_id }}"
      register: controller_before_remove
      when: controller_container_id is not none
      no_log: true

    - name: Require matching operation labels and observed process closure
      ansible.builtin.assert:
        that:
          - controller_before_remove.container.Id == controller_container_id
          - controller_before_remove.container.Config.Labels['opsctl.operation'] == controller_cleanup_operation
          - controller_before_remove.container.Config.Labels['opsctl.source_digest'] == controller_journal.source_digest
          - controller_before_remove.container.Config.Labels['opsctl.input_digest'] == controller_journal.input_digest
          - controller_before_remove.container.Config.Labels['opsctl.payload_engine'] == controller_journal.payload_engine
          - not controller_before_remove.container.State.Running
          - controller_before_remove.container.State.Pid == 0
      when:
        - controller_container_id is not none
        - controller_before_remove.exists
      no_log: true

    - name: Retain actual closed container exit independently of preparation failure
      ansible.builtin.set_fact:
        controller_exit_code: "{{ controller_before_remove.container.State.ExitCode }}"
      when:
        - controller_container_id is not none
        - controller_exit_code is none
        - controller_before_remove.exists

    - name: Remove only the observed closed exact container
      community.docker.docker_container:
        name: "{{ controller_container_id }}"
        state: absent
        keep_volumes: true
      when:
        - controller_container_id is not none
        - controller_before_remove.exists
      no_log: true

    - name: Observe exact container absence
      community.docker.docker_container_info:
        name: "{{ controller_container_id }}"
      register: controller_after_remove
      when: controller_container_id is not none
      no_log: true

    - name: Require observed container absence before private release
      ansible.builtin.assert:
        that: not controller_after_remove.exists
      when: controller_container_id is not none
  rescue:
    - name: Preserve the original reason and this phase liability
      ansible.builtin.set_fact:
        controller_original_reason: >-
          {{ controller_original_reason if controller_original_reason is not none else
          (controller_reason if controller_outcome != 'succeeded' else 'cleanup_failed') }}
        controller_reason: cleanup_failed
        controller_outcome: "{{ controller_outcome if controller_execution_known | default(false) else 'unknown' }}"
  when:
    - controller_process_closed
    - not (controller_existing_invocation | default(false))
    - not (controller_collect_only | default(false))
    - controller_writer_closed | default(false)
    - not (controller_terminal_gate_fence_qualified | default(false))
  no_log: true

- name: Settle only the exact owned network and policy
  block:
    - name: Observe exact owned network and membership before removal
      community.docker.docker_network_info:
        name: "{{ controller_network_id }}"
      register: controller_network_before_remove
      when: controller_network_id is defined
      no_log: true

    - name: Retain unresolved network allocation rather than infer its absence
      ansible.builtin.assert:
        that: controller_network_id is defined
      when: controller_network_cleanup == 'retained'

    - name: Refuse network cleanup with a changed owner or remaining member
      ansible.builtin.assert:
        that:
          - controller_network_before_remove.network.Id == controller_network_id
          - controller_network_before_remove.network.Labels['opsctl.operation'] == controller_cleanup_operation
          - controller_network_before_remove.network.Containers | default({}, true) | length == 0
      when:
        - controller_network_id is defined
        - controller_network_before_remove.exists
      no_log: true

    - name: Observe owned hook presence after possibly partial installation
      ansible.builtin.command:
        argv: "{{ item }}"
        expand_argument_vars: false
      loop:
        - [iptables, -w, '5', -C, DOCKER-USER, -j, "{{ controller_chain | default('') }}"]
        - [iptables, -w, '5', -C, INPUT, -i, "{{ controller_bridge | default('') }}", -m, comment, --comment, "{{ controller_cleanup_operation | default('') }}", -j, REJECT]
      register: controller_owned_hooks
      changed_when: false
      failed_when: controller_owned_hooks.rc not in [0, 1]
      when: controller_chain_owned | default(false)

    - name: Remove only observed exact owned hooks
      ansible.builtin.command:
        argv: "{{ item.item[:3] + ['-D'] + item.item[4:] }}"
        expand_argument_vars: false
      loop: "{{ controller_owned_hooks.results | default([]) }}"
      when:
        - controller_chain_owned | default(false)
        - item.rc == 0

    - name: Require both owned hooks absent before chain release
      ansible.builtin.command:
        argv: "{{ item.item }}"
        expand_argument_vars: false
      loop: "{{ controller_owned_hooks.results | default([]) }}"
      register: controller_hook_after_remove
      changed_when: false
      failed_when: controller_hook_after_remove.rc != 1
      when: controller_chain_owned | default(false)

    - name: Remove only the exact created chain
      ansible.builtin.command:
        argv: [iptables, -w, '5', "{{ item }}", "{{ controller_chain }}"]
        expand_argument_vars: false
      loop: [-F, -X]
      when: controller_chain_owned | default(false)

    - name: Remove the revalidated empty operation network
      community.docker.docker_network:
        name: "{{ controller_network_id }}"
        state: absent
      when: controller_network_id is defined

    - name: Observe owned network absence
      community.docker.docker_network_info:
        name: "{{ controller_network_id }}"
      register: controller_network_after_remove
      when: controller_network_id is defined

    - name: Require observed network removal
      ansible.builtin.assert:
        that: not controller_network_after_remove.exists
      when: controller_network_id is defined

    - name: Record owned policy and network removal
      ansible.builtin.set_fact:
        controller_network_cleanup: removed
      when: controller_network_id is defined
  rescue:
    - name: Preserve the original reason and this phase liability
      ansible.builtin.set_fact:
        controller_original_reason: >-
          {{ controller_original_reason if controller_original_reason is not none else
          (controller_reason if controller_outcome != 'succeeded' else 'cleanup_failed') }}
        controller_reason: cleanup_failed
        controller_outcome: "{{ controller_outcome if controller_execution_known | default(false) else 'unknown' }}"
  when:
    - controller_process_closed
    - not (controller_existing_invocation | default(false))
    - not (controller_collect_only | default(false))
    - controller_network_cleanup == 'retained'
    - controller_writer_closed | default(false) or controller_effect_fenced | default(false)
  no_log: true

- name: Release only revalidated fresh private material
  block:
    - name: Reobserve the fresh source directory before removing it
      ansible.builtin.stat:
        path: "{{ controller_source_workspace }}"
        follow: false
        get_checksum: false
        get_mime: false
      register: controller_source_before_remove
      when: controller_source_workspace is defined

    - name: Require unchanged fresh filesystem identity
      ansible.builtin.assert:
        that:
          - controller_source_before_remove.stat.isdir | default(false)
          - not controller_source_before_remove.stat.islnk | default(true)
          - controller_source_before_remove.stat.dev == controller_source_identity.stat.dev
          - controller_source_before_remove.stat.inode == controller_source_identity.stat.inode
          - controller_source_before_remove.stat.uid == controller_cleanup_uid
      when:
        - controller_source_workspace is defined
        - controller_source_before_remove.stat.exists

    - name: Reobserve the exclusively allocated root record before release
      ansible.builtin.stat:
        path: "{{ controller_record }}"
        follow: false
        get_checksum: false
        get_mime: false
      register: controller_record_before_remove
      when: controller_record_owned | default(false)

    - name: Observe each recorded private directory without following links
      ansible.builtin.stat:
        path: "{{ controller_record }}/{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop: [keys, gate]
      register: controller_private_before_remove

    - name: Require exact private allocation identities before release
      ansible.builtin.assert:
        that:
          - item.stat.isdir | default(false)
          - not item.stat.islnk | default(true)
          - controller_journal.private_identities[item.item] is mapping
          - item.stat.dev == controller_journal.private_identities[item.item].dev
          - item.stat.inode == controller_journal.private_identities[item.item].inode
          - item.stat.uid == controller_journal.private_identities[item.item].uid
          - item.stat.mode == controller_journal.private_identities[item.item].mode
      loop: "{{ controller_private_before_remove.results }}"
      when: item.stat.exists

    - name: Refuse private-record release on changed identity or ownership
      ansible.builtin.assert:
        that:
          - controller_record_before_remove.stat.isdir | default(false)
          - not controller_record_before_remove.stat.islnk | default(true)
          - controller_record_before_remove.stat.dev == controller_record_identity.stat.dev
          - controller_record_before_remove.stat.inode == controller_record_identity.stat.inode
          - controller_record_before_remove.stat.uid == 0
          - controller_record_before_remove.stat.mode == '0700'
      when: controller_record_owned | default(false)

    - name: Retain a closed nonprivate record so re-entry cannot redispatch
      ansible.builtin.copy:
        dest: "{{ controller_record }}/closed"
        content: "closed\n"
        owner: root
        group: root
        mode: '0600'
      when: controller_record_owned | default(false)

    - name: Release private material only under the exact completed-writer closure lock
      ansible.builtin.shell: |
        exec timeout -k 2 30 /bin/sh <<'OPSCTL_MATERIAL'
        set -eu
        umask 077
        test -d "$RECORD" && test ! -L "$RECORD"
        test "$(stat -c '%u:%a:%d:%i' "$RECORD")" = "0:700:$DEVICE:$INODE"
        test ! -L "$RECORD/lock"
        if test -e "$RECORD/lock"; then
          test -f "$RECORD/lock"
          case "$(stat -c '%u:%a:%h:%s' "$RECORD/lock")" in
            0:600:1:0|0:644:1:0) ;; *) exit 65 ;;
          esac
        fi
        exec 8>"$RECORD/lock"
        flock -x -w 5 8
        test -f "$RECORD/closed" && test ! -L "$RECORD/closed"
        test "$(stat -c '%u:%a' "$RECORD/closed")" = 0:600
        if test "$EFFECT_FENCED" = true; then
          test -f "$RECORD/journal.json" && test ! -L "$RECORD/journal.json"
          test "$(stat -c '%u:%a' "$RECORD/journal.json")" = 0:600
          actual=$(sha256sum "$RECORD/journal.json")
          test "${actual%% *}" = "$JOURNAL_DIGEST"
          test -d "$SOURCE" && test ! -L "$SOURCE"
          test "$(stat -c '%u:%a:%d:%i' "$SOURCE")" = "$SOURCE_UID:700:$SOURCE_DEVICE:$SOURCE_INODE"
          test -d "$RECORD/keys" && test ! -L "$RECORD/keys"
          test "$(stat -c '%u:%a:%d:%i' "$RECORD/keys")" = "$KEY_UID:700:$KEY_DEVICE:$KEY_INODE"
          test ! -L "$RECORD/gate"
          test -d "$RECORD/gate"
          test "$(stat -c '%u:%a:%d:%i' "$RECORD/gate")" = "0:755:$GATE_DEVICE:$GATE_INODE"
          test -f "$RECORD/gate/closed" && test ! -L "$RECORD/gate/closed"
          test "$(stat -c '%u:%a' "$RECORD/gate/closed")" = 0:444
        else
          test -f "$RECORD/writer-closed" && test ! -L "$RECORD/writer-closed"
          test "$(stat -c '%u:%a' "$RECORD/writer-closed")" = 0:600
        fi
        if test -e "$RECORD/source"; then
          test -d "$RECORD/source" && test ! -L "$RECORD/source"
          test "$(stat -c '%u:%a' "$RECORD/source")" = 0:700
        fi
        for name in source keys gate; do
          test ! -L "$RECORD/$name"
        done
        rm -rf -- "$RECORD/source" "$RECORD/keys" "$RECORD/gate"
        for name in source keys gate; do test ! -e "$RECORD/$name"; done
        OPSCTL_MATERIAL
      args:
        executable: /bin/sh
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        RECORD: "{{ controller_record }}"
        DEVICE: "{{ controller_record_identity.stat.dev | string }}"
        INODE: "{{ controller_record_identity.stat.inode | string }}"
        EFFECT_FENCED: "{{ 'true' if controller_effect_fenced | default(false) else 'false' }}"
        GATE_DEVICE: "{{ controller_journal.private_identities.gate.dev | default('') | string }}"
        GATE_INODE: "{{ controller_journal.private_identities.gate.inode | default('') | string }}"
        JOURNAL_DIGEST: "{{ controller_journal_after.stat.checksum | default('') }}"
        SOURCE: "{{ controller_source_workspace | default('') }}"
        SOURCE_UID: "{{ controller_cleanup_uid | string }}"
        SOURCE_DEVICE: "{{ controller_source_identity.stat.dev | default('') | string }}"
        SOURCE_INODE: "{{ controller_source_identity.stat.inode | default('') | string }}"
        KEY_UID: "{{ controller_journal.private_identities['keys'].uid | default('') | string }}"
        KEY_DEVICE: "{{ controller_journal.private_identities['keys'].dev | default('') | string }}"
        KEY_INODE: "{{ controller_journal.private_identities['keys'].inode | default('') | string }}"
      when: controller_record_owned | default(false)

    - name: Observe fresh private-material absence
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
      loop: "{{ ([controller_record + '/source', controller_record + '/keys', controller_record + '/gate'] if controller_record_owned | default(false) else []) }}"
      register: controller_material_after_remove

    - name: Require absence of every owned material allocation
      ansible.builtin.assert:
        that: not item.stat.exists
      loop: "{{ controller_material_after_remove.results }}"

    - name: Record observed private material removal
      ansible.builtin.set_fact:
        controller_material_cleanup: removed
      when: controller_source_workspace is defined or controller_record_owned | default(false)
  rescue:
    - name: Preserve the original reason and this phase liability
      ansible.builtin.set_fact:
        controller_original_reason: >-
          {{ controller_original_reason if controller_original_reason is not none else
          (controller_reason if controller_outcome != 'succeeded' else 'cleanup_failed') }}
        controller_reason: cleanup_failed
        controller_outcome: "{{ controller_outcome if controller_execution_known | default(false) else 'unknown' }}"
  when:
    - controller_process_closed
    - not (controller_existing_invocation | default(false))
    - controller_writer_closed | default(false) or controller_effect_fenced | default(false)
    - not (controller_collect_only | default(false))
    - controller_material_cleanup != 'removed'
  no_log: true

- name: Settle the independent deadline after process and private closure
  block:
    - name: Stop the owned deadline after observed closure without waiting under its lock
      ansible.builtin.command:
        argv: [timeout, -k, '2', '15', systemctl, stop, "{{ controller_unit }}.timer", "{{ controller_unit }}.service"]
        expand_argument_vars: false
      when: controller_deadline_cleanup == 'retained'
      failed_when: false

    - name: Observe the exact deadline inactive before deleting its record
      ansible.builtin.command:
        argv: [timeout, -k, '2', '5', systemctl, is-active, "{{ item }}"]
        expand_argument_vars: false
      changed_when: false
      register: controller_deadline_after
      failed_when: controller_deadline_after.rc not in [3, 4]
      loop: ["{{ controller_unit | default('') }}.timer", "{{ controller_unit | default('') }}.service"]
      when: controller_deadline_cleanup == 'retained'

    - name: Record verified deadline closure
      ansible.builtin.set_fact:
        controller_deadline_cleanup: removed
      when: controller_deadline_cleanup == 'retained'
  rescue:
    - name: Preserve the original reason and this phase liability
      ansible.builtin.set_fact:
        controller_original_reason: >-
          {{ controller_original_reason if controller_original_reason is not none else
          (controller_reason if controller_outcome != 'succeeded' else 'cleanup_failed') }}
        controller_reason: cleanup_failed
        controller_outcome: "{{ controller_outcome if controller_execution_known | default(false) else 'unknown' }}"
  when:
    - controller_process_closed
    - not (controller_existing_invocation | default(false))
    - not (controller_collect_only | default(false))
    - controller_writer_closed | default(false) or controller_effect_fenced | default(false)
    - not (controller_terminal_gate_fence_qualified | default(false)) or controller_material_cleanup == 'removed'
  no_log: true

- name: Persist only observed cleanup facts without replacing original execution
  block:
    - name: Retain the original journal generation before settlement
      ansible.builtin.set_fact:
        controller_journal_expected: "{{ controller_journal | to_json | hash('sha256') }}"

    - name: Retain original known facts and current independent liabilities
      ansible.builtin.set_fact:
        controller_journal: >-
          {{ controller_journal | combine({'material_cleanup': controller_material_cleanup,
          'network_cleanup': controller_network_cleanup, 'deadline_cleanup': controller_deadline_cleanup,
          'phase': 'closed' if controller_material_cleanup == 'removed' else controller_journal.phase}) |
          combine({'outcome': controller_outcome, 'reason': 'deadline_expired',
          'exit_code': controller_exit_code, 'timed_out': true} if
          controller_timed_out and not (controller_execution_known | default(false)) else {}) }}

    - name: Atomically persist settlement only if the original journal is unchanged
      ansible.builtin.shell: |
        exec timeout -k 2 15 /bin/sh <<'OPSCTL_JOURNAL'
        set -eu
        umask 077
        test -d "$RECORD" && test ! -L "$RECORD"
        test "$(stat -c '%u:%a:%d:%i' "$RECORD")" = "0:700:$DEVICE:$INODE"
        test ! -L "$RECORD/lock"
        if test -e "$RECORD/lock"; then
          test -f "$RECORD/lock"
          case "$(stat -c '%u:%a:%h:%s' "$RECORD/lock")" in
            0:600:1:0|0:644:1:0) ;; *) exit 65 ;;
          esac
        fi
        exec 8>"$RECORD/lock"
        flock -x -w 5 8
        test -f "$RECORD/journal.json" && test ! -L "$RECORD/journal.json"
        test "$(stat -c '%u:%a' "$RECORD/journal.json")" = 0:600
        actual=$(sha256sum "$RECORD/journal.json")
        test "${actual%% *}" = "$EXPECTED"
        pending=$(mktemp "$RECORD/journal.XXXXXXXX")
        trap 'rm -f -- "$pending"' EXIT HUP INT TERM
        printf '%s' "$JOURNAL" >"$pending"
        mv -- "$pending" "$RECORD/journal.json"
        OPSCTL_JOURNAL
      args:
        executable: /bin/sh
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        RECORD: "{{ controller_record }}"
        DEVICE: "{{ controller_record_identity.stat.dev | string }}"
        INODE: "{{ controller_record_identity.stat.inode | string }}"
        EXPECTED: "{{ controller_journal_expected }}"
        JOURNAL: "{{ controller_journal | to_json }}"
      diff: false
  rescue:
    - name: Report uncertain journal settlement without inventing success
      ansible.builtin.set_fact:
        controller_original_reason: "{{ controller_original_reason if controller_original_reason is not none else controller_reason }}"
        controller_reason: cleanup_failed
  when:
    - controller_record_owned | default(false)
    - controller_journal is defined
    - not (controller_collect_only | default(false))
    - not (controller_existing_invocation | default(false))
    - controller_writer_closed | default(false) or controller_effect_fenced | default(false)
  no_log: true
