---
- name: Prove file-only Traefik command and private broker secret without a provider effect
  hosts: all
  gather_facts: false
  vars:
    dns_challenge_broker_url: https://broker.example.test/api/v1/dns-challenge
    dns_challenge_token_revision_id: 11111111-1111-4111-8111-111111111111
    traefik_gateway_dashboard_enabled: false
    traefik_gateway_target_major: 3
    traefik_gateway_target_version: "3.7.13"
  tasks:
    - name: Create disposable credential directory
      ansible.builtin.tempfile:
        state: directory
      register: scratch

    - name: Exercise file-only command and secret replay
      block:
        - name: Set disposable credential paths
          ansible.builtin.set_fact:
            traefik_acme_dir: "{{ scratch.path }}/acme"
            traefik_dynamic_dir: "{{ scratch.path }}/dynamic"
            dns_challenge_token_source_file: "{{ scratch.path }}/dns-challenge-token"
            dns_challenge_token_file: "{{ scratch.path }}/acme/broker-secrets/token-{{ dns_challenge_token_revision_id }}"

        - name: Generate a disposable credential
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - "import secrets; print('opsctl_srv_test.' + secrets.token_urlsafe(32))"
          register: disposable_token
          changed_when: false
          no_log: true

        - name: Create mounted file-secret fixture
          ansible.builtin.copy:
            content: "{{ disposable_token.stdout }}"
            dest: "{{ dns_challenge_token_source_file }}"
            mode: "0440"
          no_log: true

        - name: Compute file-secret contract digest
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import hashlib
                import sys

                value = open(sys.argv[1], 'rb').read()
                name = b'dns-challenge-token'
                digest = hashlib.sha256()
                digest.update(b'opsctl-file-secret:1\0')
                digest.update(len(name).to_bytes(2, 'big'))
                digest.update(name)
                digest.update(len(value).to_bytes(8, 'big'))
                digest.update(value)
                print(digest.hexdigest())
              - "{{ dns_challenge_token_source_file }}"
          register: disposable_digest
          changed_when: false
          no_log: true

        - name: Bind disposable content digest
          ansible.builtin.set_fact:
            dns_challenge_token_content_digest: "{{ disposable_digest.stdout }}"
          no_log: true

        - name: Install credential on the first run
          ansible.builtin.include_tasks: ../tasks/traefik_gateway_dns_challenge_secret.yml

        - name: Replay credential installation
          ansible.builtin.include_tasks: ../tasks/traefik_gateway_dns_challenge_secret.yml

        - name: Inspect installed credential mode
          ansible.builtin.stat:
            path: "{{ dns_challenge_token_file }}"
          register: installed_token
          no_log: true

        - name: Require private immutable credential
          ansible.builtin.assert:
            that:
              - installed_token.stat.isreg
              - installed_token.stat.mode == '0600'
              - installed_token.stat.pw_name == 'root'

        - name: Build file-only command
          ansible.builtin.include_tasks: ../tasks/traefik_gateway_command.yml

        - name: Require file-only certificate command
          ansible.builtin.assert:
            that:
              - "('--providers.file.directory=' ~ scratch.path ~ '/dynamic') in traefik_command_args"
              - "'--providers.file.watch=true' in traefik_command_args"
              - "(traefik_command_args | select('match', '^--certificatesresolvers') | list | length) == 0"

        - name: Corrupt only the disposable installed credential
          ansible.builtin.copy:
            content: tampered
            dest: "{{ dns_challenge_token_file }}"
            mode: "0600"
          no_log: true

        - name: Require tampered replay to fail closed
          block:
            - name: Attempt tampered credential replay
              ansible.builtin.include_tasks: ../tasks/traefik_gateway_dns_challenge_secret.yml

            - name: Record unexpected tampered replay acceptance
              ansible.builtin.set_fact:
                tampered_replay_accepted: true
          rescue:
            - name: Record expected tampered credential refusal
              ansible.builtin.set_fact:
                tampered_replay_refused: true

        - name: Prove tampered replay was refused
          ansible.builtin.assert:
            that:
              - tampered_replay_refused | default(false)
              - not (tampered_replay_accepted | default(false))
      always:
        - name: Remove disposable credential directory
          ansible.builtin.file:
            path: "{{ scratch.path }}"
            state: absent
          no_log: true
